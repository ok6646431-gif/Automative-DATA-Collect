name: Archive regression guard

on:
  workflow_dispatch:
  push:
    branches:
      - run/control-plane
    paths:
      - 'orchestrator/archive_builder.py'
      - 'orchestrator/archive_acceptance.py'
      - 'orchestrator/user_archive_format.py'
      - 'orchestrator/cross_entity_attachment_scope.py'
      - 'tests/test_archive*.py'
      - 'tests/test_user_archive*.py'
      - 'tests/test_cross_entity_attachment_scope.py'
      - '.github/workflows/archive-regression.yml'

jobs:
  archive-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install regression dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 xlsxwriter openpyxl pypdf
      - name: Compile archive modules
        run: python -m py_compile orchestrator/archive_builder.py orchestrator/archive_acceptance.py orchestrator/user_archive_format.py
      - name: Run full parser and archive regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
