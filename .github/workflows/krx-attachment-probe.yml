name: KRX attachment probe

on:
  push:
    branches:
      - 'run/control-plane'
    paths:
      - '.github/workflows/krx-attachment-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Probe KRX disclosure attachments
        run: |
          mkdir -p krx_probe
          python - <<'PY' | tee krx_probe/summary.txt
          import re
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          disclosures={
              2023:{'acpt':'20240613000301','attach':'20240613000421'},
              2024:{'acpt':'20250616000602','attach':'20250616001359'},
              2025:{'acpt':'20260622000693','attach':'20260622001144'},
          }
          s=requests.Session(); s.headers.update({'User-Agent':UA})
          out=Path('krx_probe')

          js='https://kind.krx.co.kr/js/viewer.js?version=20250307'
          jr=s.get(js,timeout=(8,30)); print('VIEWER_JS',jr.status_code,jr.url,len(jr.content),jr.headers.get('Content-Type')); jr.raise_for_status(); (out/'viewer.js').write_bytes(jr.content)
          for line in jr.text.splitlines():
              if any(k in line.lower() for k in ('searchcontents','filedownload','pdfdownload','doclocpath','docserverpath')):
                  print('JS',line.strip()[:1800])

          for year,cfg in disclosures.items():
              viewer=f"https://kind.krx.co.kr/common/disclsviewer.do?acptNo={cfg['acpt']}&method=searchInitInfo"
              vr=s.get(viewer,timeout=(8,30)); vr.raise_for_status(); (out/f'{year}_viewer.html').write_bytes(vr.content)
              print(f'===== YEAR {year} acpt={cfg["acpt"]} attach={cfg["attach"]} =====')
              endpoint='https://kind.krx.co.kr/common/disclsviewer.do'
              for verb in ('GET','POST'):
                  if verb=='GET':
                      r=s.get(endpoint,params={'method':'searchContents','docNo':cfg['attach']},headers={'Referer':viewer},timeout=(8,30))
                  else:
                      r=s.post(endpoint,data={'method':'searchContents','docNo':cfg['attach']},headers={'Referer':viewer},timeout=(8,30))
                  print(verb,'STATUS',r.status_code,'FINAL',r.url,'TYPE',r.headers.get('Content-Type'),'BYTES',len(r.content))
                  (out/f'{year}_searchcontents_{verb.lower()}.txt').write_bytes(r.content)
                  sample=r.text[:4000].replace('\r',' ')
                  print(verb,'BODY',sample)
          PY
      - name: Upload probe result
        uses: actions/upload-artifact@v4
        with:
          name: krx-attachment-probe
          path: krx_probe/
          if-no-files-found: error
          retention-days: 3
