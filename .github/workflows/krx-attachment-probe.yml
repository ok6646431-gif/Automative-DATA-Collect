name: KRX attachment probe

on:
  push:
    branches:
      - 'run/control-plane'
    paths:
      - '.github/workflows/krx-attachment-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Resolve original and corrected KRX attachments
        run: |
          mkdir -p krx_probe
          python - <<'PY' | tee krx_probe/summary.txt
          import re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          docs={
              '2023_ORIGINAL':('20240613000301','20240613000421'),
              '2023_CORRECTION':('20240613000301','20240717000511'),
              '2024_ORIGINAL':('20250616000602','20250616001359'),
              '2024_CORRECTION_1':('20250616000602','20250708000755'),
              '2024_CORRECTION_2':('20250616000602','20250820000371'),
              '2025_ORIGINAL':('20260622000693','20260622001144'),
              '2025_CORRECTION':('20260622000693','20260722001742'),
          }
          s=requests.Session(); s.headers.update({'User-Agent':UA})
          endpoint='https://kind.krx.co.kr/common/disclsviewer.do'
          for label,(acpt,docno) in docs.items():
              viewer=f'https://kind.krx.co.kr/common/disclsviewer.do?acptNo={acpt}&method=searchInitInfo'
              r=s.get(endpoint,params={'method':'searchContents','docNo':docno},headers={'Referer':viewer},timeout=(8,30)); r.raise_for_status()
              m=re.search(r"parent\.setPath\('[^']*','([^']+)'",r.text)
              print('===== ',label,' =====',sep='')
              print('DOCNO',docno,'SEARCH_STATUS',r.status_code)
              if not m:
                  print('NO_ATTACHMENT_PATH'); continue
              page=m.group(1); print('ATTACHMENT_PAGE',page)
              p=s.get(page,headers={'Referer':viewer},timeout=(8,30)); print('PAGE_STATUS',p.status_code,'BYTES',len(p.content)); p.raise_for_status()
              soup=BeautifulSoup(p.text,'html.parser'); links=[]
              for a in soup.find_all('a',href=True):
                  href=str(a['href']); absolute=urljoin(p.url,href)
                  if '.pdf' in href.lower(): links.append(absolute)
              for link in links: print('PDF',link)
              if not links: print('NO_PDF_LINK')
          PY
      - name: Upload probe result
        uses: actions/upload-artifact@v4
        with:
          name: krx-attachment-probe
          path: krx_probe/
          if-no-files-found: error
          retention-days: 3
