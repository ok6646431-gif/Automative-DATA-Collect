name: KRX attachment probe

on:
  push:
    branches:
      - 'run/control-plane'
    paths:
      - '.github/workflows/krx-attachment-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Probe KRX disclosure attachments
        run: |
          python - <<'PY' | tee krx_attachment_probe.txt
          import html, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          disclosures={
              2023:'20240613000301',
              2024:'20250616000602',
              2025:'20260622000693',
          }
          s=requests.Session(); s.headers.update({'User-Agent':UA})
          for year,acpt in disclosures.items():
              url=f'https://kind.krx.co.kr/common/disclsviewer.do?acptNo={acpt}&method=searchInitInfo'
              print(f'===== YEAR {year} VIEWER {url} =====')
              r=s.get(url,timeout=(8,30)); print('STATUS',r.status_code,'FINAL',r.url,'BYTES',len(r.content)); r.raise_for_status()
              text=r.text
              soup=BeautifulSoup(text,'html.parser')
              candidates=[]
              for tag in soup.find_all(True):
                  for attr in ('href','src','value','action','data'):
                      val=tag.get(attr)
                      if not val: continue
                      val=html.unescape(str(val))
                      if any(k in val.lower() for k in ('pdf','attach','download','external','acptno','docno')):
                          candidates.append((tag.name,attr,val,urljoin(r.url,val)))
              for m in re.finditer(r'''(?i)(https?://[^\s"'<>]+|/[^\s"'<>]+\.pdf(?:\?[^\s"'<>]*)?)''',text):
                  val=html.unescape(m.group(1))
                  if 'pdf' in val.lower() or 'external' in val.lower():
                      candidates.append(('regex','text',val,urljoin(r.url,val)))
              seen=set()
              for row in candidates:
                  if row[3] in seen: continue
                  seen.add(row[3]); print('CANDIDATE',*row,sep='\t')
              print('RAW_PDF_OCCURRENCES',len(re.findall(r'(?i)\.pdf',text)))
          PY
      - name: Upload probe result
        uses: actions/upload-artifact@v4
        with:
          name: krx-attachment-probe
          path: krx_attachment_probe.txt
          if-no-files-found: error
          retention-days: 3
