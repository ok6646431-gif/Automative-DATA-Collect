name: Validate strict user archive formats on Kumho artifacts

on:
  push:
    branches:
      - run/control-plane
    paths:
      - '.github/workflows/repackage-user-format-validation.yml'
      - 'orchestrator/archive_builder.py'
      - 'orchestrator/archive_acceptance.py'
      - 'orchestrator/archive_contract.json'
      - 'orchestrator/archive_stage.py'
      - 'orchestrator/archive_zip_dedup.py'
      - 'orchestrator/archive_user_dedup_v2.py'
      - 'orchestrator/user_archive_format.py'
      - 'orchestrator/bat*.py'
      - 'orchestrator/bat*.json'
      - 'tools/prepare_human_archive_delivery.py'
      - 'tests/test_archive_delivery_contract.py'
      - 'tests/test_archive_user_dedup_v2.py'
      - 'tests/test_archive_zip_dedup.py'
      - 'tests/test_bat*.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 xlsxwriter openpyxl pypdf
      - name: Run archive and delivery contract tests
        run: >-
          python -m unittest
          tests.test_archive_delivery_contract
          tests.test_archive_user_dedup_v2
          tests.test_archive_zip_dedup
          tests.test_bat_resolver
          tests.test_bat_revision_collection
          tests.test_bat_archive
          -v
      - name: Install Korean fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-nanum
          sudo fc-cache -f
      - name: Bootstrap current Discovery
        run: >-
          python orchestrator/bootstrap_inputs.py
          --profile-out requests/runtime/company_profile.generated.json
          --request-out requests/current.generated.json
          --summary-out requests/runtime/Company_Discovery_Summary.json
      - name: Download retained stable artifacts
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33735414258
          github-token: ${{ github.token }}
          pattern: stable-*
          path: collected/stable
          merge-multiple: true
      - name: Download retained ICIS artifact
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33735414258
          github-token: ${{ github.token }}
          pattern: icis-attempt-*
          path: collected/icis
          merge-multiple: false
      - name: Assemble package with BAT resolution
        run: >-
          python orchestrator/package_run.py
          --stable collected/stable
          --icis collected/icis
          --profile requests/runtime/company_profile.generated.json
          --out assembled
      - name: Build normalized Human Archive
        run: >-
          python orchestrator/archive_stage.py
          --package assembled
          --stable collected/stable
          --documents requests/document_evidence.json
      - name: Validate exact final Human Archive ZIP
        run: |
          python - <<'PY'
          import csv,json,zipfile,io,tempfile
          from pathlib import Path
          from openpyxl import load_workbook
          from archive_acceptance import assert_pass, validate_archive_zip

          report=assert_pass(validate_archive_zip('assembled/Human_Archive.zip', expected_env_pdf_count=15), 'Kumho final Human Archive')
          summary=json.load(open('assembled/Archive_Summary.json',encoding='utf-8'))
          dedup=summary.get('envinfo_user_attachment_dedup') or {}
          if int(dedup.get('envinfo_attachment_occurrences') or 0) <= 0:
              raise SystemExit('ENVINFO user attachment dedup metadata missing')
          semantic_years=dedup.get('sustainability_semantic_candidate_years') or []
          if semantic_years not in ([], ['2022']):
              raise SystemExit(f"Unexpected sustainability semantic comparison years: {dedup}")
          if semantic_years==['2022'] and int(dedup.get('sustainability_semantic_duplicate_files_removed') or 0) != 1:
              raise SystemExit(f"2022 semantic comparison ran but did not remove the proven duplicate: {dedup}")
          if dedup.get('sustainability_semantic_failures'):
              raise SystemExit(f"Sustainability semantic dedup failures: {dedup.get('sustainability_semantic_failures')}")

          bat=summary.get('bat_archive') or {}
          if int(bat.get('bat_archive_candidate_count') or 0) != 5:
              raise SystemExit(f"Expected 5 Kumho site/BAT candidates, got {bat.get('bat_archive_candidate_count')}")
          if int(bat.get('bat_archive_current_pdf_count') or 0) != 0:
              raise SystemExit(f"Review/pending Kumho BAT candidates must not expose current PDFs: {bat}")
          if int(bat.get('bat_archive_superseded_pdf_count') or 0) != 0:
              raise SystemExit(f"No BAT family cleared the collection gate, so superseded PDFs must also be absent: {bat}")
          if bat.get('bat_archive_failures'):
              raise SystemExit(f"BAT archive failures: {bat.get('bat_archive_failures')}")

          with zipfile.ZipFile('assembled/Human_Archive.zip') as z:
              names=z.namelist()
              sustainability=[n for n in names if '/01_사용자자료/04_지속가능경영보고서/' in n and n.lower().endswith('.pdf')]
              expected_sustainability_years={'2020','2022','2023','2024','2025','2026'}
              sustainability_years=set()
              for n in sustainability:
                  name=Path(n).name
                  if name.startswith('ENVINFO공개연도_'):
                      raise SystemExit(f'ENVINFO-promoted sustainability duplicate leaked into final archive: {n}')
                  matches=[y for y in expected_sustainability_years if y in name]
                  if len(matches)!=1:
                      raise SystemExit(f'Could not resolve one annual sustainability year from canonical filename: {n}')
                  sustainability_years.add(matches[0])
              if len(sustainability)!=6 or sustainability_years!=expected_sustainability_years:
                  raise SystemExit(f'Expected exactly six canonical annual sustainability PDFs: files={sustainability} years={sorted(sustainability_years)}')
              y2022=[n for n in sustainability if '2022' in Path(n).name]
              if len(y2022)!=1:
                  raise SystemExit(f'Expected one canonical 2022 sustainability report, got {y2022}')

              bat_xlsx=[n for n in names if n.endswith('/BAT_기준서/BAT_적용후보_및_수집현황.xlsx')]
              current_pdfs=[n for n in names if '/BAT_기준서/01_현행_우선판/' in n and n.lower().endswith('.pdf')]
              old_pdfs=[n for n in names if '/BAT_기준서/02_구판_아카이브/' in n and n.lower().endswith('.pdf')]
              all_bat_pdfs=[n for n in names if '/BAT_기준서/' in n and n.lower().endswith('.pdf')]
              misplaced=[n for n in all_bat_pdfs if '/01_현행_우선판/' not in n and '/02_구판_아카이브/' not in n]
              if len(bat_xlsx)!=1:
                  raise SystemExit(f'Expected one BAT applicability XLSX, got {bat_xlsx}')
              if current_pdfs or old_pdfs or all_bat_pdfs:
                  raise SystemExit(f'No Kumho BAT candidate cleared collection; no BAT PDF may be exposed: current={current_pdfs} old={old_pdfs}')
              if misplaced:
                  raise SystemExit(f'BAT PDFs outside revision folders: {misplaced}')
              forbidden=[n for n in names if '/01_사용자자료/' in n and n.lower().endswith(('.html','.htm','.json','.jsonl'))]
              if forbidden:
                  raise SystemExit(f'Forbidden machine-readable files in user archive: {forbidden[:10]}')

              xlsx_bytes=z.read(bat_xlsx[0])
              if not xlsx_bytes.startswith(b'PK'):
                  raise SystemExit('BAT applicability workbook is not a valid XLSX container')
              with tempfile.NamedTemporaryFile(suffix='.xlsx') as tmp:
                  tmp.write(xlsx_bytes); tmp.flush()
                  wb=load_workbook(tmp.name,read_only=True,data_only=True)
                  ws=wb.active
                  rows=list(ws.iter_rows(values_only=True))
              if len(rows)<6:
                  raise SystemExit(f'BAT workbook must contain header plus five Kumho candidates: rows={len(rows)}')
              headers=[str(v or '') for v in rows[0]]
              records=[dict(zip(headers,row)) for row in rows[1:] if any(v not in (None,'') for v in row)]
              if len(records)!=5:
                  raise SystemExit(f'BAT workbook candidate row count changed: {len(records)}')
              flattened='\n'.join(' | '.join(str(v or '') for v in r.values()) for r in records)
              for site in ['금호타이어 광주공장','금호타이어 곡성공장','금호타이어 평택공장']:
                  if site not in flattened:
                      raise SystemExit(f'Missing expected rubber candidate site in BAT workbook: {site}')
              if 'REVIEW_BEFORE_COLLECTION' not in flattened or 'WAIT_FOR_PUBLICATION' not in flattened:
                  raise SystemExit('BAT workbook must expose both review-before-collection and wait-for-publication states')
              if 'KBREF_FAMILY_ELECTRIC_STEAM' in flattened or '전기 및 증기' in flattened:
                  raise SystemExit('Electric/steam false-positive BAT leaked into user workbook')

          print(json.dumps({
              'FINAL_ARCHIVE_ACCEPTANCE':'PASS',
              'zip_bytes':summary.get('zip_bytes'),
              'zip_sha256':summary.get('zip_sha256'),
              'checks':report['checks'],
              'normalization':summary.get('user_format_normalization'),
              'envinfo_user_attachment_dedup':dedup,
              'bat_archive':bat,
              'current_bat_pdf_members':current_pdfs,
              'superseded_bat_pdf_members':old_pdfs,
              'bat_xlsx_members':bat_xlsx,
              'bat_workbook_candidate_rows':len(records),
              'sustainability_members':sustainability,
              'sustainability_years':sorted(sustainability_years),
              'sustainability_2022_member':y2022[0],
          },ensure_ascii=False))
          PY
      - name: Build byte-preserving delivery package
        run: >-
          python tools/prepare_human_archive_delivery.py
          --source assembled/Human_Archive.zip
          --out-dir delivery
          --prefix '금호타이어_환경자료_2020-2026'
          --max-mib 500
      - name: Verify delivery lineage manifest
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.load(open('delivery/Delivery_Manifest.json',encoding='utf-8'))
          if m.get('status')!='PASS': raise SystemExit('delivery manifest did not pass')
          h=hashlib.sha256(Path('assembled/Human_Archive.zip').read_bytes()).hexdigest()
          if m.get('source_archive_sha256')!=h: raise SystemExit('delivery source SHA mismatch')
          for p in m.get('parts',[]):
              f=Path('delivery')/p['name']
              if not f.exists(): raise SystemExit(f'missing delivery part: {f}')
              if f.stat().st_size>500*1024*1024: raise SystemExit(f'delivery part too large: {f}')
              if hashlib.sha256(f.read_bytes()).hexdigest()!=p['sha256']: raise SystemExit(f'part SHA mismatch: {f}')
          print(json.dumps({'DELIVERY_LINEAGE':'PASS','parts':len(m.get('parts',[])),'selected_members':m.get('selected_member_count')},ensure_ascii=False))
          PY
      - name: Upload normalized archive
        uses: actions/upload-artifact@v4
        with:
          name: kumho-normalized-human-archive
          path: assembled/Human_Archive.zip
          retention-days: 7
          if-no-files-found: error
      - name: Upload delivery manifest
        uses: actions/upload-artifact@v4
        with:
          name: kumho-delivery-manifest
          path: delivery/Delivery_Manifest.json
          retention-days: 14
          if-no-files-found: error
      - name: Upload delivery part 01
        uses: actions/upload-artifact@v4
        with:
          name: kumho-delivery-part-01
          path: delivery/금호타이어_환경자료_2020-2026_part_01.zip
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload delivery part 02
        uses: actions/upload-artifact@v4
        with:
          name: kumho-delivery-part-02
          path: delivery/금호타이어_환경자료_2020-2026_part_02.zip
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload delivery part 03
        uses: actions/upload-artifact@v4
        with:
          name: kumho-delivery-part-03
          path: delivery/금호타이어_환경자료_2020-2026_part_03.zip
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload delivery part 04
        uses: actions/upload-artifact@v4
        with:
          name: kumho-delivery-part-04
          path: delivery/금호타이어_환경자료_2020-2026_part_04.zip
          retention-days: 14
          if-no-files-found: ignore
