name: Probe Kumho report links
on:
  push:
    branches: [run/control-plane]
    paths:
      - 'tools/probe_kumho_report_links.marker'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Probe report transport capabilities
        run: |
          python - <<'PY'
          import requests
          landing='https://www.kkpc.com/kor/winwin/esg/sustainabilityList/'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0'})
          r=s.get(landing,timeout=(10,30)); r.raise_for_status()
          urls={
              '2020-kor-seq':'https://www.kkpc.com/download/?seq=4017',
              '2021-kor-seq':'https://www.kkpc.com/download/?seq=5173',
              '2022-kor-seq':'https://www.kkpc.com/download/?seq=6252',
              '2023-kor-seq':'https://www.kkpc.com/download/?seq=7019',
              '2023-eng-static':'https://www.kkpc.com/upload/download/Kumho Petrochemical Sustainability Report 2023.pdf',
              '2024-kor-static':'https://www.kkpc.com/upload/download/금호석유화학 지속가능경영보고서 2024.pdf?v=20250822',
              '2025-kor-static':'https://www.kkpc.com/upload/download/금호석유화학 지속가능경영보고서 2025.pdf?v=20260724',
          }
          headers={'Referer':r.url,'Range':'bytes=0-1023'}
          for name,url in urls.items():
              print('\nPROBE',name,url)
              try:
                  with s.get(url,headers=headers,stream=True,allow_redirects=True,timeout=(10,30)) as q:
                      print('status',q.status_code,'final',q.url)
                      for h in ['Content-Type','Content-Length','Content-Range','Accept-Ranges','Content-Disposition','ETag','Last-Modified']:
                          print(h,repr(q.headers.get(h)))
                      first=next((c for c in q.iter_content(1024) if c),b'')
                      print('first_bytes',repr(first[:32]),'read',len(first))
              except Exception as exc:
                  print('ERROR',type(exc).__name__,repr(str(exc)))
          PY
