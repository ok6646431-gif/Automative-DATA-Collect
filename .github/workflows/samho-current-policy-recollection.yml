name: HD Samho current-policy source recollection and delivery QA
on:
  push:
    branches: [run/control-plane]
    paths: ['.github/workflows/samho-current-policy-recollection.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recollect_and_validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: orchestrator
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector, archive, PDF and spreadsheet dependencies
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 xlsxwriter openpyxl pypdf cryptography
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-nanum >/dev/null
          sudo fc-cache -f
      - name: Restore verified Samho discovery without changing shared Hanwha request files
        run: |
          git show 0cd4f040d056c44925346b580d33b2c7fcb9a092:requests/company_discovery.json > requests/company_discovery.json
          git show 0cd4f040d056c44925346b580d33b2c7fcb9a092:requests/document_evidence.json > requests/document_evidence.json
          git show 0cd4f040d056c44925346b580d33b2c7fcb9a092:requests/event_evidence.json > requests/event_evidence.json
          python orchestrator/bootstrap_inputs.py --profile-out requests/runtime/company_profile.generated.json --request-out requests/current.generated.json --summary-out requests/runtime/Company_Discovery_Summary.json
          python - <<'PY'
          import json
          d=json.load(open('requests/company_discovery.json'))
          assert d['requested_company_name']=='HD현대삼호'
          assert d['requested_scope']['mode']=='SITE_SET'
          print('SAMHO_IDENTITY_SCOPE', d['requested_scope']['label'])
          PY
      - name: Recollect stable public sources under current collectors
        run: |
          mkdir -p collected/stable
          python collectors/envinfo_collect.py requests/current.generated.json || true
          python collectors/envinfo_attachment_recovery.py --out output/ENVINFO --repo-root . || true
          python collectors/soosiro_collect.py requests/current.generated.json || true
          python collectors/cleansys_collect.py requests/current.generated.json || true
          for source in ENVINFO SOOSIRO_WATER CLEANSYS_AIR; do
            test -s "output/$source/status.json" || { echo "MISSING_STATUS $source"; exit 1; }
            cp -a "output/$source" collected/stable/
          done
      - name: Recollect official corporate document originals
        run: |
          python collectors/corporate_docs_collect.py requests/document_evidence.json requests/runtime/company_profile.generated.json || true
          test -s output/CORP_DOCS/status.json
          cp -a output/CORP_DOCS collected/stable/
      - name: Recollect PRTR and Chemical Statistics
        run: |
          mkdir -p collected/icis/icis-attempt-1
          python collectors/prtr_collect.py requests/current.generated.json || true
          python collectors/chem_stats_collect.py requests/current.generated.json || true
          for source in PRTR CHEM_STATS; do
            test -s "output/$source/status.json" || { echo "MISSING_STATUS $source"; exit 1; }
            cp -a "output/$source" collected/icis/icis-attempt-1/
          done
      - name: Assemble source inventory and master manifest
        run: >-
          python orchestrator/package_run.py --stable collected/stable --icis collected/icis --profile requests/runtime/company_profile.generated.json --out assembled
      - name: Build user-facing archive with current Korean-body and provenance QA
        run: >-
          python orchestrator/archive_stage.py --package assembled --stable collected/stable --documents requests/document_evidence.json
      - name: Validate final archive and build application materials
        run: |
          test -s assembled/Human_Archive.zip
          python tools/build_application_material_from_archive.py --input assembled/Human_Archive.zip --output-dir application-delivery --source-run "${{ github.run_id }}" --summary-out application-delivery/application_package_result.json
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          s=json.loads(Path('assembled/Archive_Summary.json').read_text())
          q=s.get('sustainability_korean_delivery_qa') or {}
          assert q.get('pass') is True and q.get('checked',0)>=5, q
          assert not q.get('separately_classified_envinfo_attachments'),q
          assert s['archive_completeness']=='COMPLETE', s.get('acceptance_checks')
          e=s.get('envinfo_content_qa') or {}
          assert e.get('pass') is True,e
          a=json.loads(Path('application-delivery/application_package_result.json').read_text())
          assert a.get('status')=='PASS',a
          with zipfile.ZipFile('assembled/Human_Archive.zip') as z:
            assert z.testzip() is None
            names=z.namelist()
            official=[n for n in names if '/01_사용자자료/04_지속가능경영보고서/' in n and n.lower().endswith('.pdf')]
            assert len(official)>=5 and all('ENVINFO공개연도_' not in n for n in official),official
          print('SAMHO_CURRENT_POLICY_PASS', 'official_KO=',len(official),'envinfo=',e.get('status'),'app=',a['status'])
          PY
      - name: Upload independently inspectable QA receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hd-samho-current-policy-qa-receipt
          path: |
            assembled/*.json
            assembled/*.csv
            output/CORP_DOCS/document_index.csv
            application-delivery/application_package_result.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload full current-policy Human Archive
        if: ${{ always() && hashFiles('assembled/Human_Archive.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: hd-samho-current-policy-human-archive
          path: assembled/Human_Archive.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload current-policy application materials
        if: ${{ always() && hashFiles('application-delivery/*.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: hd-samho-current-policy-application-materials
          path: application-delivery/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
