      - name: Upload POSCO part 04
        uses: actions/upload-artifact@v4
        with: {name: chat-posco-04, path: delivery/posco/포스코_지원용_part_04/, if-no-files-found: ignore, retention-days: 14}
      - name: Upload POSCO part 05
        uses: actions/upload-artifact@v4
        with: {name: chat-posco-05, path: delivery/posco/포스코_지원용_part_05/, if-no-files-found: ignore, retention-days: 14}
      - name: Upload POSCO part 06
        uses: actions/upload-artifact@v4
        with: {name: chat-posco-06, path: delivery/posco/포스코_지원용_part_06/, if-no-files-found: ignore, retention-days: 14}
