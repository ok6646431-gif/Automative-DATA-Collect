      - name: Upload Kumho part 15
        uses: actions/upload-artifact@v4
        with: {name: chat-kumho-15, path: delivery/kumho/금호석유화학_지원용_part_15/, if-no-files-found: ignore, retention-days: 14}
      - name: Upload Kumho part 16
        uses: actions/upload-artifact@v4
