name: Repackage Hyosung chat delivery

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/repackage-hyosung-chat-delivery.yml'

permissions:
  contents: write
  actions: read

jobs:
  repackage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/control-plane

      - name: Download final Hyosung package
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 35309723669
          name: hyosung-content-qa-final
          path: final
          github-token: ${{ github.token }}

      - name: Verify files
        run: |
          set -euo pipefail
          test -s final/source/Human_Archive.zip
          test -s final/delivery/효성티앤씨_지원용_환경자료.zip
          test -s final/source/Hyosung_Content_QA_Final.json
          sha256sum final/source/Human_Archive.zip final/delivery/효성티앤씨_지원용_환경자료.zip
          cat final/source/Hyosung_Content_QA_Final.json

      - name: Upload Human Archive separately
        uses: actions/upload-artifact@v4
        with:
          name: 효성티앤씨-Human-Archive
          path: final/source/Human_Archive.zip
          retention-days: 7
          compression-level: 0

      - name: Upload Application Materials separately
        uses: actions/upload-artifact@v4
        with:
          name: 효성티앤씨-지원용-환경자료
          path: final/delivery/효성티앤씨_지원용_환경자료.zip
          retention-days: 7
          compression-level: 0

      - name: Upload QA summary separately
        uses: actions/upload-artifact@v4
        with:
          name: 효성티앤씨-QA-summary
          path: |
            final/source/Hyosung_Content_QA_Final.json
            final/source/Application_Materials_Final.json
            final/source/Archive_Summary.json
          retention-days: 7

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name 'openai-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/repackage-hyosung-chat-delivery.yml
          git commit -m 'Remove Hyosung chat delivery workflow'
          git push origin HEAD:run/control-plane
