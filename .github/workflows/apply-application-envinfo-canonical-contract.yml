name: Apply application ENVINFO canonical contract

on:
  push:
    branches: [run/control-plane]
    paths:
      - requests/application_envinfo_canonical_contract.token
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/control-plane
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pypdf xlsxwriter
      - name: Apply generic canonical attachment contract
        run: python tools/patch_application_envinfo_canonical_contract.py
      - name: Run focused regressions
        run: |
          python -m unittest \
            tests.test_archive_user_dedup_v2 \
            tests.test_application_material_package \
            tests.test_application_material_package_validation
      - name: Compile changed modules
        run: |
          python -m py_compile \
            orchestrator/archive_user_dedup_v2.py \
            tools/build_application_material_package.py \
            tools/validate_application_material_package.py
      - name: Validate patch
        run: git diff --check
      - name: Commit production fix
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            orchestrator/archive_user_dedup_v2.py \
            tools/build_application_material_package.py \
            tools/validate_application_material_package.py \
            tests/test_archive_user_dedup_v2.py \
            tests/test_application_material_package.py \
            tests/test_application_material_package_validation.py
          git commit -m 'Preserve ENVINFO canonical attachment provenance in application packages'
          git push origin HEAD:run/control-plane
