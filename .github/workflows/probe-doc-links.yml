name: Probe SK hynix document links

on:
  pull_request:
    paths:
      - '.github/workflows/probe-doc-links.yml'
      - 'tools/probe_skhynix_docs.py'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Probe official and registry pages
        run: python tools/probe_skhynix_docs.py
