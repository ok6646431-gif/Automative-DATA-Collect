name: KKPC corporate document failover QA

on:
  push:
    branches:
      - 'run/control-plane'
    paths:
      - '.github/workflows/kkpc-corp-doc-failover-qa.yml'
      - 'requests/document_evidence.json'
      - 'collectors/corporate_docs_collect.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kkpc-corp-doc-failover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Bootstrap current company
        run: >-
          python orchestrator/bootstrap_inputs.py
          --profile-out requests/runtime/company_profile.generated.json
          --request-out requests/current.generated.json
          --summary-out requests/runtime/Company_Discovery_Summary.json
      - name: Build three-report QA evidence
        run: |
          python - <<'PY'
          import json
          src=json.load(open('requests/document_evidence.json',encoding='utf-8'))
          keep={'KKPC_SUSTAINABILITY_2023','KKPC_SUSTAINABILITY_2024','KKPC_SUSTAINABILITY_2025'}
          src['documents']=[d for d in src['documents'] if d.get('document_id') in keep]
          src['gaps']=[]
          json.dump(src,open('requests/document_evidence.qa.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print('QA documents',[(d['document_id'],len(d.get('fallback_sources',[]))) for d in src['documents']])
          PY
      - name: Verify KRX fallback payloads directly
        run: |
          python - <<'PY'
          import hashlib,json
          import requests
          cfg=json.load(open('requests/document_evidence.qa.json',encoding='utf-8'))
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          for doc in cfg['documents']:
              alt=doc['fallback_sources'][0]
              headers={'Referer':alt['source_locator']}
              with s.get(alt['source_url'],stream=True,timeout=(8,25),allow_redirects=True,headers=headers) as r:
                  r.raise_for_status(); h=hashlib.sha256(); size=0; head=b''
                  for chunk in r.iter_content(1024*1024):
                      if not chunk: continue
                      if not head: head=chunk[:16]
                      size+=len(chunk); h.update(chunk)
                  if not head.startswith(b'%PDF-'): raise RuntimeError(f"{doc['document_id']} fallback is not PDF: {head!r}")
                  print(doc['document_id'],'KRX_FALLBACK_OK','bytes='+str(size),'sha256='+h.hexdigest(),'final='+r.url)
          PY
      - name: Run bounded primary-to-fallback collection
        run: python collectors/corporate_docs_collect.py requests/document_evidence.qa.json requests/runtime/company_profile.generated.json
      - name: Show selection result
        run: |
          cat output/CORP_DOCS/status.json
          python - <<'PY'
          import csv
          for name in ('document_index.csv','download_attempts.csv'):
              print('\n###',name)
              with open('output/CORP_DOCS/'+name,encoding='utf-8-sig') as f:
                  for r in csv.DictReader(f):
                      print({k:r.get(k) for k in ('document_id','report_year','collection_status','source_role','attempt_status','source_url','bytes','sha256','notes') if k in r})
          PY
      - name: Upload QA results
        uses: actions/upload-artifact@v4
        with:
          name: kkpc-corp-doc-failover-qa
          path: output/CORP_DOCS/
          if-no-files-found: error
          retention-days: 7
