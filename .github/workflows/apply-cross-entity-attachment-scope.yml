name: Apply cross-entity attachment scope

on:
  push:
    branches: [run/control-plane]
    paths:
      - requests/cross_entity_attachment_scope.token
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: orchestrator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/control-plane
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check xlsxwriter pypdf openpyxl
      - name: Apply scope patch
        run: python tools/patch_cross_entity_attachment_scope.py
      - name: Run focused regressions
        run: |
          python -m unittest \
            tests.test_cross_entity_attachment_scope \
            tests.test_application_material_package_validation \
            tests.test_application_envinfo_canonical_contract \
            tests.test_archive_user_dedup_v2
      - name: Compile changed modules
        run: |
          python -m py_compile \
            orchestrator/cross_entity_attachment_scope.py \
            orchestrator/archive_builder.py \
            orchestrator/scope_quality.py \
            tests/test_cross_entity_attachment_scope.py
      - name: Validate patch
        run: git diff --check
      - name: Commit production fix
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            orchestrator/archive_builder.py \
            orchestrator/scope_quality.py
          git commit -m 'Exclude verified cross-entity attachments from user delivery'
          git push origin HEAD:run/control-plane
