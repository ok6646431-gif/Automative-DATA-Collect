name: Apply human content QA findings
on:
  push:
    branches: [run/control-plane]
    paths: ['.github/workflows/apply-human-content-qa-findings.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Patch language metadata and archive preference
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('orchestrator/document_language_preference.py')
          s=p.read_text(encoding='utf-8')
          old='for key in ("source_url","source_locator","expected_extension","verification_status","notes","original_filename"):\n'
          new='for key in ("source_url","source_locator","expected_extension","verification_status","notes","original_filename","title","source_report_title","label"):\n'
          if old in s:
              s=s.replace(old,new,1)
          elif '"source_report_title","label")' not in s:
              raise SystemExit('language metadata patch anchor missing')
          p.write_text(s,encoding='utf-8')

          p=Path('orchestrator/archive_builder.py')
          s=p.read_text(encoding='utf-8')
          marker="def build_corporate_user(package_root,archive_root,company_name):\n"
          helpers=(
              "def _document_language_hint(*values):\n"
              "    text=' '.join(str(v or '') for v in values).casefold()\n"
              "    ko=bool(re.search(r'(?:^|[/_.?=&-])(kr|ko|kor)(?:[/_.?=&-]|$)|\\\\bkorean\\\\b|국문|한글|한국어',text,re.I))\n"
              "    en=bool(re.search(r'(?:^|[/_.?=&-])(en|eng)(?:[/_.?=&-]|$)|\\\\benglish\\\\b|영문|영어',text,re.I))\n"
              "    if ko and not en: return 'KO'\n"
              "    if en and not ko: return 'EN'\n"
              "    return 'UNKNOWN'\n\n"
              "def _korean_report_already_exposed(folder,year):\n"
              "    folder=Path(folder)\n"
              "    if not folder.exists(): return False\n"
              "    y=str(year or '')\n"
              "    for p in folder.iterdir():\n"
              "        if not p.is_file() or p.suffix.lower()!='.pdf': continue\n"
              "        if y and y not in p.name: continue\n"
              "        if _document_language_hint(p.name)=='KO': return True\n"
              "    return False\n\n\n"
          )
          if '_korean_report_already_exposed' not in s:
              if marker not in s: raise SystemExit('corporate user marker missing')
              s=s.replace(marker,helpers+marker,1)
          old="        folder=user/doc_user_folder(dtype,title); year=str(doc.get('report_year') or '')\n        suffix=src.suffix or Path(str(doc.get('original_filename') or '')).suffix\n"
          new="        folder=user/doc_user_folder(dtype,title); year=str(doc.get('report_year') or '')\n        if dtype=='SUSTAINABILITY_REPORT' and year:\n            lang=_document_language_hint(doc.get('source_url'),doc.get('original_filename'),title)\n            if lang=='EN' and _korean_report_already_exposed(folder,year):\n                x=dict(doc); x['user_archive_status']='SKIPPED_ENGLISH_KOREAN_ALREADY_AVAILABLE'; rows.append(x); continue\n        suffix=src.suffix or Path(str(doc.get('original_filename') or '')).suffix\n"
          if old in s:
              s=s.replace(old,new,1)
          elif 'SKIPPED_ENGLISH_KOREAN_ALREADY_AVAILABLE' not in s:
              raise SystemExit('archive preference patch anchor missing')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify targeted behavior
        env:
          PYTHONPATH: .:orchestrator
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 xlsxwriter openpyxl
          python -m py_compile orchestrator/document_language_preference.py orchestrator/archive_builder.py
          python -m unittest tests.test_document_language_preference tests.test_archive_delivery_contract -v
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from orchestrator.archive_builder import _document_language_hint,_korean_report_already_exposed
          assert _document_language_hint('SR_2020_kr.pdf')=='KO'
          assert _document_language_hint('SR_2020_en.pdf')=='EN'
          with tempfile.TemporaryDirectory() as td:
              p=Path(td)/'효성티앤씨_지속가능경영보고서_2020_SR_2020_kr.pdf'
              p.write_bytes(b'%PDF-1.4\n%%EOF')
              assert _korean_report_already_exposed(Path(td),'2020')
          PY
      - name: Commit verified changes
        run: |
          git config user.name 'openai-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/apply-human-content-qa-findings.yml
          git add orchestrator/document_language_preference.py orchestrator/archive_builder.py
          git diff --cached --check
          git commit -m 'Apply human content QA language findings'
          git push origin HEAD:run/control-plane
