name: Korean annual report and ENVINFO content policy tests
on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/korean-annual-policy-checks.yml'
      - 'orchestrator/document_language_preference.py'
      - 'orchestrator/sustainability_korean_delivery_guard.py'
      - 'orchestrator/envinfo_zero_qa_gate.py'
      - 'orchestrator/envinfo_reference_lane.py'
      - 'orchestrator/archive_stage.py'
      - 'tests/test_document_language_preference.py'
      - 'tests/test_document_korean_only_policy.py'
      - 'tests/test_sustainability_korean_delivery_guard.py'
      - 'tests/test_envinfo_zero_qa_gate.py'
      - 'tests/test_envinfo_reference_lane.py'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf openpyxl xlsxwriter cryptography
      - name: Targeted source and content contract tests
        run: |
          python -m unittest discover -s tests -p 'test_document_korean_only_policy.py' -v
          python -m unittest discover -s tests -p 'test_sustainability_korean_delivery_guard.py' -v
          python -m unittest discover -s tests -p 'test_envinfo_zero_qa_gate.py' -v
          python -m unittest discover -s tests -p 'test_envinfo_reference_lane.py' -v
      - name: Full regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q
