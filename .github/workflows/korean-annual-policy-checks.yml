name: Korean annual report policy tests
on:
  push:
    branches: [run/control-plane]
    paths: ['.github/workflows/korean-annual-policy-checks.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf openpyxl xlsxwriter cryptography
      - name: Korean-only route tests
        run: python -m unittest discover -s tests -p 'test_document_korean_only_policy.py' -v
      - name: Full regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q
