name: Integrate completeness gate once

on:
  push:
    branches:
      - 'run/control-plane'
    paths:
      - '.github/workflows/integrate-completeness-gate-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/control-plane
      - name: Patch main collection path and archive index
        run: |
          python - <<'PY'
          from pathlib import Path

          collect=Path('.github/workflows/collect.yml')
          text=collect.read_text(encoding='utf-8')
          needle="""      - name: Preserve discovery bootstrap summary\n        if: always()\n"""
          insert="""      - name: Audit exact-period and document completeness\n        run: >-\n          python orchestrator/collection_completeness.py\n          --package assembled\n          --profile requests/runtime/company_profile.generated.json\n          --request requests/current.generated.json\n          --documents requests/document_evidence.json\n      - name: Preserve discovery bootstrap summary\n        if: always()\n"""
          if 'Audit exact-period and document completeness' not in text:
              if needle not in text:
                  raise SystemExit('collect.yml integration anchor not found')
              text=text.replace(needle,insert,1)
              collect.write_text(text,encoding='utf-8')

          archive=Path('orchestrator/archive_builder.py')
          text=archive.read_text(encoding='utf-8')
          anchor='    "Company_Profile.json", "Company_Discovery_Summary.json", "Master_Manifest.json", "Artifact_Index.csv",\n'
          replacement='    "Company_Profile.json", "Company_Discovery_Summary.json", "Master_Manifest.json", "Artifact_Index.csv",\n    "Collection_Completeness.json", "Collection_Completeness.csv", "Collection_No_Data.csv",\n'
          if 'Collection_Completeness.json' not in text:
              if anchor not in text:
                  raise SystemExit('archive_builder.py root-index anchor not found')
              text=text.replace(anchor,replacement,1)
              archive.write_text(text,encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name "openai-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/collect.yml orchestrator/archive_builder.py
          if git diff --cached --quiet; then
            echo "No integration changes required"
          else
            git commit -m "Integrate collection completeness gate"
            git push origin HEAD:run/control-plane
          fi
