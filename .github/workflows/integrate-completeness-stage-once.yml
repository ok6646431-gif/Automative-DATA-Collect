name: Integrate completeness stage once

on:
  push:
    branches:
      - 'run/control-plane'
    paths:
      - '.github/workflows/integrate-completeness-stage-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/control-plane
      - name: Patch non-workflow integration files
        run: |
          python - <<'PY'
          from pathlib import Path

          audit=Path('orchestrator/collection_completeness.py')
          text=audit.read_text(encoding='utf-8')
          anchor='from pathlib import Path\n\nSTRONG_VERIFICATION'
          replacement='from pathlib import Path\n\ntry:\n    from .request_builder import build as build_request\nexcept ImportError:\n    from request_builder import build as build_request\n\nSTRONG_VERIFICATION'
          if 'build as build_request' not in text:
              if anchor not in text: raise SystemExit('collection_completeness import anchor not found')
              text=text.replace(anchor,replacement,1)
          old='def audit(package_root, profile_path, request_path, evidence_path=None):\n    package = Path(package_root); output = package/"output"\n    profile = read_json(profile_path, {}) or {}; request = read_json(request_path, {}) or {}\n'
          new='def audit(package_root, profile_path, request_path=None, evidence_path=None):\n    package = Path(package_root); output = package/"output"\n    profile = read_json(profile_path, {}) or {}\n    request = read_json(request_path, {}) if request_path and Path(request_path).exists() else build_request(profile)\n    request = request or {}\n'
          if old in text:
              text=text.replace(old,new,1)
          elif 'def audit(package_root, profile_path, request_path=None' not in text:
              raise SystemExit('collection_completeness audit anchor not found')
          audit.write_text(text,encoding='utf-8')

          stage=Path('orchestrator/archive_stage.py')
          text=stage.read_text(encoding='utf-8')
          anchor='from postprocess import stable_id\n'
          replacement='from postprocess import stable_id\nfrom collection_completeness import audit as audit_collection_completeness\n'
          if 'audit_collection_completeness' not in text:
              if anchor not in text: raise SystemExit('archive_stage import anchor not found')
              text=text.replace(anchor,replacement,1)
          old='def run(package_root,stable,evidence=None):\n    root=Path(package_root).resolve(); copy_document_lane(root,stable,evidence)\n    vals,docs,env=document_reviews(root); merge_validations(root,vals)\n'
          new='def run(package_root,stable,evidence=None):\n    root=Path(package_root).resolve(); copy_document_lane(root,stable,evidence)\n    audit_collection_completeness(root, root/"Company_Profile.json", None, root/"Document_Evidence.json" if (root/"Document_Evidence.json").exists() else None)\n    vals,docs,env=document_reviews(root); merge_validations(root,vals)\n'
          if old in text:
              text=text.replace(old,new,1)
          elif 'audit_collection_completeness(root' not in text:
              raise SystemExit('archive_stage run anchor not found')
          stage.write_text(text,encoding='utf-8')

          archive=Path('orchestrator/archive_builder.py')
          text=archive.read_text(encoding='utf-8')
          anchor='    "Company_Profile.json", "Company_Discovery_Summary.json", "Master_Manifest.json", "Artifact_Index.csv",\n'
          replacement='    "Company_Profile.json", "Company_Discovery_Summary.json", "Master_Manifest.json", "Artifact_Index.csv",\n    "Collection_Completeness.json", "Collection_Completeness.csv", "Collection_No_Data.csv",\n'
          if 'Collection_Completeness.json' not in text:
              if anchor not in text: raise SystemExit('archive_builder root-index anchor not found')
              text=text.replace(anchor,replacement,1)
              archive.write_text(text,encoding='utf-8')
          PY
      - name: Run regression tests
        run: >-
          python -m unittest
          tests.test_collection_completeness
          tests.test_sustainability_coverage
          tests.test_bootstrap_inputs
          -v
      - name: Commit integration
        run: |
          git config user.name "openai-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orchestrator/collection_completeness.py orchestrator/archive_stage.py orchestrator/archive_builder.py
          if git diff --cached --quiet; then
            echo "No integration changes required"
          else
            git commit -m "Enforce completeness audit in archive stage"
            git push origin HEAD:run/control-plane
          fi
