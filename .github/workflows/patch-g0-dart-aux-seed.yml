name: Patch G0 DART auxiliary official seed

on:
  push:
    branches:
      - run/control-plane
    paths:
      - '.github/workflows/patch-g0-dart-aux-seed.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Apply exact generic recovery patch
        run: python maintenance/patch_g0_dart_aux_seed.py
      - name: Run targeted recovery regression
        run: |
          python -m py_compile orchestrator/g0_staged_official_recovery.py
          python -m unittest tests.test_g0_staged_official_recovery -v
      - name: Commit verified patch and remove temporary maintenance files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-g0-dart-aux-seed.yml maintenance/patch_g0_dart_aux_seed.py
          git add orchestrator/g0_staged_official_recovery.py tests/test_g0_staged_official_recovery.py
          git diff --cached --check
          git commit -m 'Recover thin DART sites from auxiliary official URLs'
          git push origin HEAD:run/control-plane
