name: Apply semantic sustainability dedup contract

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/apply-semantic-sustainability-dedup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/control-plane
      - name: Patch archive dependencies and final Kumho contract
        run: |
          python - <<'PY'
          from pathlib import Path

          collect=Path('.github/workflows/collect.yml')
          text=collect.read_text(encoding='utf-8')
          old='run: python -m pip install --disable-pip-version-check xlsxwriter\n'
          new='run: python -m pip install --disable-pip-version-check xlsxwriter pypdf\n'
          if old not in text and new not in text:
              raise SystemExit('collect.yml archive dependency anchor not found')
          text=text.replace(old,new,1)
          collect.write_text(text,encoding='utf-8')

          strict=Path('.github/workflows/repackage-user-format-validation.yml')
          text=strict.read_text(encoding='utf-8')
          old='run: python -m pip install --disable-pip-version-check requests beautifulsoup4 xlsxwriter openpyxl\n'
          new='run: python -m pip install --disable-pip-version-check requests beautifulsoup4 xlsxwriter openpyxl pypdf\n'
          if old not in text and new not in text:
              raise SystemExit('strict workflow dependency anchor not found')
          text=text.replace(old,new,1)

          anchor="""          if int(dedup.get('envinfo_attachment_occurrences') or 0) <= 0:\n              raise SystemExit('ENVINFO user attachment dedup metadata missing')\n"""
          insert="""          if int(dedup.get('envinfo_attachment_occurrences') or 0) <= 0:\n              raise SystemExit('ENVINFO user attachment dedup metadata missing')\n          if dedup.get('sustainability_semantic_candidate_years') != ['2022']:\n              raise SystemExit(f\"Expected only 2022 to require sustainability semantic comparison: {dedup}\")\n          if int(dedup.get('sustainability_semantic_duplicate_files_removed') or 0) != 1:\n              raise SystemExit(f\"Expected one proven 2022 sustainability semantic duplicate removal: {dedup}\")\n          if dedup.get('sustainability_semantic_failures'):\n              raise SystemExit(f\"Sustainability semantic dedup failures: {dedup.get('sustainability_semantic_failures')}\")\n"""
          if 'Expected one proven 2022 sustainability semantic duplicate removal' not in text:
              if anchor not in text:
                  raise SystemExit('strict semantic stats anchor not found')
              text=text.replace(anchor,insert,1)

          anchor="""              names=z.namelist()\n              bat_xlsx=[n for n in names if n.endswith('/BAT_기준서/BAT_적용후보_및_수집현황.xlsx')]\n"""
          insert="""              names=z.namelist()\n              sustainability=[n for n in names if '/01_사용자자료/04_지속가능경영보고서/' in n and n.lower().endswith('.pdf')]\n              expected_sustainability_years={'2020','2022','2023','2024','2025','2026'}\n              sustainability_years=set()\n              for n in sustainability:\n                  name=Path(n).name\n                  if name.startswith('ENVINFO공개연도_'):\n                      raise SystemExit(f'ENVINFO-promoted sustainability duplicate leaked into final archive: {n}')\n                  matches=[y for y in expected_sustainability_years if y in name]\n                  if len(matches)!=1:\n                      raise SystemExit(f'Could not resolve one annual sustainability year from canonical filename: {n}')\n                  sustainability_years.add(matches[0])\n              if len(sustainability)!=6 or sustainability_years!=expected_sustainability_years:\n                  raise SystemExit(f'Expected exactly six canonical annual sustainability PDFs: files={sustainability} years={sorted(sustainability_years)}')\n              bat_xlsx=[n for n in names if n.endswith('/BAT_기준서/BAT_적용후보_및_수집현황.xlsx')]\n"""
          if 'Expected exactly six canonical annual sustainability PDFs' not in text:
              if anchor not in text:
                  raise SystemExit('strict sustainability list anchor not found')
              text=text.replace(anchor,insert,1)

          anchor="""              'bat_workbook_candidate_rows':len(records),\n"""
          insert="""              'bat_workbook_candidate_rows':len(records),\n              'sustainability_members':sustainability,\n              'sustainability_years':sorted(sustainability_years),\n"""
          if "'sustainability_members':sustainability" not in text:
              if anchor not in text:
                  raise SystemExit('strict output anchor not found')
              text=text.replace(anchor,insert,1)

          strict.write_text(text,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/collect.yml .github/workflows/repackage-user-format-validation.yml
          if git diff --cached --quiet; then
            echo 'Patch already applied.'
          else
            git commit -m 'Enforce semantic sustainability archive dedup'
            git push origin HEAD:run/control-plane
          fi
