name: Hanwha Korean delivery gate regression
on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/hanwha-korean-delivery-regression.yml'
      - 'orchestrator/envinfo_reference_lane.py'
      - 'orchestrator/archive_stage.py'
permissions:
  contents: read
  actions: read
jobs:
  real_hanwha:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONPATH: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source and archive dependencies
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 xlsxwriter openpyxl pypdf cryptography
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-nanum >/dev/null
          sudo fc-cache -f
      - name: Download corrected public sources
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 35482930612
          name: stable-public-sources
          path: collected/stable
          github-token: ${{ github.token }}
      - name: Download official Korean corporate originals
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 35480886754
          name: stable-corporate-documents
          path: collected/stable
          github-token: ${{ github.token }}
      - name: Download corrected ICIS source
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 35482930612
          name: icis-attempt-2
          path: collected/icis/icis-attempt-2
          github-token: ${{ github.token }}
      - name: Bootstrap matching company and scope
        run: >-
          python orchestrator/bootstrap_inputs.py --profile-out requests/runtime/company_profile.generated.json --request-out requests/current.generated.json --summary-out requests/runtime/Company_Discovery_Summary.json
      - name: Assemble source evidence
        run: >-
          python orchestrator/package_run.py --stable collected/stable --icis collected/icis --profile requests/runtime/company_profile.generated.json --out assembled
      - name: Rebuild human archive using production gate
        run: >-
          python orchestrator/archive_stage.py --package assembled --stable collected/stable --documents requests/document_evidence.json
      - name: Verify official Korean originals and central ENVINFO source references in final ZIP
        run: |
          python - <<'PY'
          import csv, io, json, zipfile
          from pathlib import Path
          root = Path('assembled')
          summary = json.loads((root/'Archive_Summary.json').read_text(encoding='utf-8'))
          qa = summary['sustainability_korean_delivery_qa']
          assert qa['status'] == 'PASS' and qa['checked'] == 6 and qa['pass'], qa
          assert set(x['report_year'] for x in qa['items']) == set(range(2021, 2027)), qa
          assert not qa['separately_classified_envinfo_attachments'], qa
          assert summary['archive_completeness'] == 'COMPLETE', summary.get('blocking_acceptance_checks')
          prefix = summary['archive_root'] + '/'
          with zipfile.ZipFile(root/'Human_Archive.zip') as z:
              names = set(z.namelist())
              annual = [n for n in names if n.startswith(prefix+'01_사용자자료/04_지속가능경영보고서/') and n.endswith('.pdf')]
              originals = [n for n in names if n.startswith(prefix+'01_사용자자료/03_환경정보공개시스템/첨부자료_원문/') and n.endswith('.pdf')]
              assert len(annual) == 6, annual
              assert all('ENVINFO공개연도_' not in n for n in annual), annual
              assert originals, 'canonical ENVINFO original PDFs absent from centralized source folder'
              refs_path = prefix+'00_자료목록/ENVINFO_첨부자료_참조표.csv'
              assert refs_path in names, 'ENVINFO source-to-canonical path reference table missing'
              with z.open(refs_path) as raw:
                  refs = list(csv.DictReader(io.TextIOWrapper(raw, encoding='utf-8-sig')))
              assert refs, 'ENVINFO reference table is empty'
              missing = [r['최종_보존경로'] for r in refs if prefix+r['최종_보존경로'] not in names]
              assert not missing, ('ENVINFO reference target missing', missing[:10])
          print('REAL_HANWHA_DISTINCT_REPORT_LANES_PASS official=',len(annual), 'envinfo_originals=',len(originals), 'references=',len(refs))
          PY
      - name: Upload lightweight regression receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-hanwha-korean-delivery-gate-qa
          path: |
            assembled/Archive_Summary.json
            assembled/Collection_Completeness.json
          if-no-files-found: warn
          retention-days: 14
