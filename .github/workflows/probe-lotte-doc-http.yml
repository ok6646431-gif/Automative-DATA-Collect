name: Probe Lotte document HTTP headers

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/probe-lotte-doc-http.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Probe header variants
        run: |
          python - <<'PY'
          import requests
          urls = [
              'https://www.lottechem.com/',
              'https://www.lottechem.com/ko/esg/management_report.do',
              'https://www.lottechem.com/pdfRead.do?fileId=FILE_250729103412393&voNm=esgVo&category=ko',
          ]
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          variants = {
              'ua_only': {'User-Agent': ua},
              'g0': {'User-Agent': ua, 'Accept-Language': 'ko,en;q=0.8'},
              'browserish': {
                  'User-Agent': ua,
                  'Accept-Language': 'ko-KR,ko;q=0.9,en-US;q=0.8,en;q=0.7',
                  'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
                  'Upgrade-Insecure-Requests': '1',
              },
          }
          for name, headers in variants.items():
              s=requests.Session(); s.headers.update(headers)
              print('VARIANT', name)
              for u in urls:
                  try:
                      r=s.get(u, timeout=(8,20), allow_redirects=True, stream=True)
                      print(r.status_code, r.url, r.headers.get('Content-Type'), r.headers.get('Server'), u)
                      r.close()
                  except Exception as e:
                      print('ERR', type(e).__name__, str(e), u)
          PY
