name: Probe Lotte document HTTP headers

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/probe-lotte-doc-http.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Probe identity and range behavior
        run: |
          python - <<'PY'
          import requests
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          root='https://www.lottechem.com/'
          page='https://www.lottechem.com/ko/esg/management_report.do'
          pdf='https://www.lottechem.com/pdfRead.do?fileId=FILE_250729103412393&voNm=esgVo&category=ko'
          cases = [
              ('plain-root', root, {}),
              ('identity-root', root, {'Accept-Encoding':'identity'}),
              ('plain-page', page, {}),
              ('identity-page', page, {'Accept-Encoding':'identity'}),
              ('plain-pdf', pdf, {}),
              ('identity-pdf', pdf, {'Accept-Encoding':'identity'}),
              ('range-pdf', pdf, {'Range':'bytes=0-1048575'}),
              ('identity-range-pdf', pdf, {'Accept-Encoding':'identity','Range':'bytes=0-1048575'}),
          ]
          s=requests.Session(); s.headers.update({'User-Agent':ua})
          for name,u,h in cases:
              try:
                  r=s.get(u, headers=h, timeout=(8,20), allow_redirects=True, stream=True)
                  print(name, 'status=', r.status_code, 'ctype=', r.headers.get('Content-Type'), 'clen=', r.headers.get('Content-Length'), 'crange=', r.headers.get('Content-Range'), 'final=', r.url)
                  r.close()
              except Exception as e:
                  print(name, 'ERR', type(e).__name__, str(e))
          PY
