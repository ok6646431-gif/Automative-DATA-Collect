name: Verify Samsung K-BREF attachment

on:
  push:
    branches: ['run/control-plane']
    paths:
      - '.github/workflows/verify-samsung-kbref-attachment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Build one-document evidence
        run: |
          python orchestrator/bootstrap_inputs.py --profile-out requests/runtime/company_profile.generated.json --request-out requests/current.generated.json --summary-out requests/runtime/Company_Discovery_Summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          src=json.loads(Path('requests/document_evidence.json').read_text(encoding='utf-8'))
          doc=[d for d in src['documents'] if d.get('document_id')=='NIER_SEMICONDUCTOR_KBREF_2019'][0]
          out={'schema_version':'1.0','request_id':src['request_id'],'discovery_status':'COMPLETE','documents':[doc],'gaps':[]}
          Path('/tmp/kbref-evidence.json').write_text(json.dumps(out,ensure_ascii=False),encoding='utf-8')
          PY
      - name: Collect K-BREF
        run: |
          rm -rf output/CORP_DOCS
          python collectors/corporate_docs_collect.py /tmp/kbref-evidence.json requests/runtime/company_profile.generated.json
          cat output/CORP_DOCS/status.json
          cat output/CORP_DOCS/download_attempts.csv
          python - <<'PY'
          import csv, json
          from pathlib import Path
          status=json.loads(Path('output/CORP_DOCS/status.json').read_text(encoding='utf-8'))
          rows=list(csv.DictReader(Path('output/CORP_DOCS/document_index.csv').open(encoding='utf-8-sig')))
          assert status['downloaded']==1 and status['failed']==0, status
          row=rows[0]
          assert row['collection_status']=='DOWNLOADED', row
          p=Path(row['stored_path'])
          assert p.exists() and p.read_bytes()[:5]==b'%PDF-', (p, p.stat().st_size if p.exists() else None)
          print(json.dumps({'kbref':'DOWNLOADED','bytes':p.stat().st_size,'source_url':row['source_url'],'source_locator':row['source_locator']},ensure_ascii=False))
          PY
