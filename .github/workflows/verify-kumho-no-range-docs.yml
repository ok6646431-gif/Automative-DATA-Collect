name: Verify Kumho no-Range report alternatives
on:
  push:
    branches: [run/control-plane]
    paths:
      - 'tools/verify_kumho_no_range_docs.marker'
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - document_id: KUMHO_SUSTAINABILITY_2022
            source_url: https://www.kkpc.com/download/?seq=6416
          - document_id: KUMHO_SUSTAINABILITY_2021
            source_url: https://www.kkpc.com/download/?seq=5174
          - document_id: KUMHO_SUSTAINABILITY_2020
            source_url: https://www.kkpc.com/download/?seq=3778
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Bootstrap runtime company inputs
        run: >-
          python orchestrator/bootstrap_inputs.py
          --profile-out requests/runtime/company_profile.generated.json
          --request-out requests/current.generated.json
          --summary-out requests/runtime/Company_Discovery_Summary.json
      - name: Build isolated official alternative request
        env:
          DOC_ID: ${{ matrix.document_id }}
          SOURCE_URL: ${{ matrix.source_url }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          src=json.loads(Path('requests/document_evidence.json').read_text(encoding='utf-8'))
          wanted=os.environ['DOC_ID']
          docs=[dict(d) for d in src.get('documents',[]) if d.get('document_id')==wanted]
          if len(docs)!=1:
              raise SystemExit(f'Expected one document for {wanted}, got {len(docs)}')
          doc=docs[0]
          doc['source_url']=os.environ['SOURCE_URL']
          doc['verification_status']='VERIFIED'
          doc['notes']=(str(doc.get('notes') or '') + ' | Verification uses independently probed official English edition on kkpc.com.').strip(' |')
          doc['fallback_sources']=[]
          src['documents']=[doc]
          src['gaps']=[]
          Path('requests/runtime/one_document.json').write_text(json.dumps(src,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'document_id':wanted,'source_url':doc['source_url']},ensure_ascii=False))
          PY
      - name: Collect one official alternative
        continue-on-error: true
        run: python collectors/corporate_docs_collect.py requests/runtime/one_document.json requests/runtime/company_profile.generated.json
      - name: Print diagnostics
        if: always()
        run: |
          cat output/CORP_DOCS/status.json 2>/dev/null || true
          echo '--- attempts ---'
          cat output/CORP_DOCS/download_attempts.csv 2>/dev/null || true
          echo '--- index ---'
          cat output/CORP_DOCS/document_index.csv 2>/dev/null || true
          echo '--- files ---'
          find output/CORP_DOCS/raw_documents -type f -printf '%s %p\n' 2>/dev/null || true
      - name: Require real downloaded document
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          status=json.loads(Path('output/CORP_DOCS/status.json').read_text(encoding='utf-8'))
          rows=list(csv.DictReader(Path('output/CORP_DOCS/document_index.csv').open(encoding='utf-8-sig')))
          if status.get('downloaded') != 1 or len(rows)!=1 or rows[0].get('collection_status')!='DOWNLOADED':
              raise SystemExit(f'Verification failed: status={status}; rows={rows}')
          path=Path(rows[0]['stored_path'])
          if not path.exists() or path.stat().st_size != int(rows[0]['bytes']):
              raise SystemExit('Stored file/byte validation failed')
          if path.read_bytes()[:5] != b'%PDF-':
              raise SystemExit('Stored payload is not a PDF')
          print('REAL_DOWNLOAD_PASS', rows[0]['document_id'], rows[0]['bytes'], rows[0]['sha256'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: no-range-${{ matrix.document_id }}
          path: output/CORP_DOCS/
          if-no-files-found: warn
          retention-days: 2
