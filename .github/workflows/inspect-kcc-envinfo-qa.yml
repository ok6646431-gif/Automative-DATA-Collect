name: Inspect KCC ENVINFO content QA failures

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/inspect-kcc-envinfo-qa.yml'

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/control-plane

      - name: Download KCC Human Archive artifact
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 35323339919
          name: enterprise-env-human-archive
          path: kcc
          github-token: ${{ github.token }}

      - name: Extract QA failures
        run: |
          python - <<'PY'
          import csv, io, json, zipfile
          from pathlib import Path

          zpath=Path('kcc/Human_Archive.zip')
          if not zpath.exists():
              candidates=list(Path('kcc').rglob('*.zip'))
              if len(candidates)!=1:
                  raise SystemExit(f'Human Archive zip not found: {candidates}')
              zpath=candidates[0]

          with zipfile.ZipFile(zpath) as z:
              qa_names=[n for n in z.namelist() if n.endswith('/00_자료목록/ENVINFO_Content_QA.csv') or n=='00_자료목록/ENVINFO_Content_QA.csv']
              if len(qa_names)!=1:
                  raise SystemExit(f'QA CSV candidates={qa_names}')
              raw=z.read(qa_names[0]).decode('utf-8-sig')
              rows=list(csv.DictReader(io.StringIO(raw)))

          fails=[r for r in rows if r.get('판정')=='FAIL']
          warns=[r for r in rows if r.get('판정')=='WARN']
          print('QA_COLUMNS=' + json.dumps(list(rows[0].keys()) if rows else [], ensure_ascii=False))
          print('QA_FAILS=' + json.dumps(fails, ensure_ascii=False))
          print('QA_WARNS=' + json.dumps(warns, ensure_ascii=False))
          print('QA_COUNTS=' + json.dumps({
              'rows':len(rows),
              'pass':sum(r.get('판정')=='PASS' for r in rows),
              'warn':len(warns),
              'fail':len(fails),
          },ensure_ascii=False))
          Path('ENVINFO_Content_QA.csv').write_text(raw,encoding='utf-8-sig')
          Path('KCC_QA_Failures.json').write_text(json.dumps(fails,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: kcc-envinfo-content-qa-failures
          path: |
            ENVINFO_Content_QA.csv
            KCC_QA_Failures.json
          retention-days: 14

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name 'openai-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/inspect-kcc-envinfo-qa.yml
          git commit -m 'Remove KCC ENVINFO QA inspection workflow'
          git push origin HEAD:run/control-plane
