name: Apply corporate document range resume
on:
  push:
    branches: [run/control-plane]
    paths:
      - 'tools/patch_corp_docs_range_resume.py'
      - '.github/workflows/apply-corp-docs-range-resume.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python tools/patch_corp_docs_range_resume.py
      - run: python -m unittest discover -s tests -p 'test_corporate_docs_collect.py' -v
      - name: Commit resumable document transfers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add collectors/corporate_docs_collect.py tests/test_corporate_docs_collect.py
          git diff --cached --exit-code && exit 0
          git commit -m 'Resume interrupted corporate document transfers'
          git push
