name: Probe ENV-INFO desktop visual capture
on:
  push:
    branches: [run/control-plane]
    paths: ['.github/workflows/probe-envinfo-visual.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Capture official ENV-INFO view
        run: |
          BROWSER=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          URL='https://www.env-info.kr/user/register/viewUserSearch2.do?YEAR=2024&COMP_ID=CM000000000000001978&OPEN_YN=Y'
          mkdir -p probe
          "$BROWSER" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --window-size=1920,12000 --virtual-time-budget=12000 --screenshot=probe/desktop-1920x12000.png "$URL" || true
          "$BROWSER" --headless=new --disable-gpu --no-sandbox --window-size=1920,1080 --no-pdf-header-footer --virtual-time-budget=12000 --print-to-pdf=probe/window-print.pdf "$URL" || true
          file probe/* || true
          ls -lh probe || true
      - uses: actions/upload-artifact@v4
        with:
          name: envinfo-visual-probe
          path: probe
          retention-days: 2
      - name: Remove probe workflow
        run: |
          git config user.name 'openai-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/probe-envinfo-visual.yml
          git commit -m 'Remove ENV-INFO visual probe workflow'
          git push origin HEAD:run/control-plane
