name: Pipeline hardening v2 regressions

on:
  push:
    branches:
      - pipeline-hardening-v2
    paths:
      - 'orchestrator/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/pipeline-hardening-v2-tests.yml'
      - '.github/workflows/collect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check openpyxl xlsxwriter beautifulsoup4 pypdf requests
      - name: Review package regressions
        run: python -m unittest tests.test_human_review_package -v
      - name: Package validation regressions
        run: python -m unittest tests.test_package_validation tests.test_final_validation_semantics -v
      - name: Collection completeness regressions
        run: python -m unittest tests.test_collection_completeness -v
      - name: Archive builder regressions
        run: python -m unittest tests.test_archive_builder -v
