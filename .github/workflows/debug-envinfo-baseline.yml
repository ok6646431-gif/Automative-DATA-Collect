name: Debug ENVINFO baseline identities

on:
  push:
    branches:
      - run/control-plane
    paths:
      - '.github/workflows/debug-envinfo-baseline.yml'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: KUMHO
            company: 금호석유화학
            snapshot: 488ddccbb634cb7af181d2a81507883eb3291458
            missing: '00000000000000183149'
          - label: HANWHA_AEROSPACE
            company: 한화에어로스페이스
            snapshot: ccca0d9cc94a3849e8116a72015242c1eca89a8d
            missing: 'CM000000000000003233,CM000000000000003234'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 xlsxwriter
      - name: Restore frozen representative request snapshot
        env:
          SNAPSHOT: ${{ matrix.snapshot }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$SNAPSHOT"
          for f in company_discovery.json document_evidence.json event_evidence.json; do
            git show "FETCH_HEAD:requests/$f" > "requests/$f"
          done
      - name: Compile runtime request
        run: >-
          python orchestrator/bootstrap_inputs.py
          --profile-out requests/runtime/company_profile.generated.json
          --request-out requests/current.generated.json
          --summary-out requests/runtime/Company_Discovery_Summary.json
      - name: Force lightweight ENVINFO probe
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('requests/current.generated.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          c=d['sources']['ENVINFO']
          c['collect_details']=False
          c['collect_attachments']=False
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Run ENVINFO collector
        run: python collectors/envinfo_collect.py requests/current.generated.json
      - name: Diagnose missing baseline IDs
        env:
          MISSING: ${{ matrix.missing }}
        run: |
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          missing={x for x in os.environ['MISSING'].split(',') if x}
          print('MISSING_TARGETS', sorted(missing))
          found={}
          p=Path('output/ENVINFO/discovery.csv')
          if p.exists():
              with p.open(encoding='utf-8-sig',newline='') as f:
                  for r in csv.DictReader(f):
                      cid=str(r.get('compId') or '')
                      if cid in missing:
                          found[cid]=('ALLOWED',r)
          for filename,label in [('scope_rejected_rows.jsonl','SCOPE_REJECTED'),('excluded_rows.jsonl','EXCLUDED')]:
              q=Path('output/ENVINFO')/filename
              if not q.exists():
                  continue
              for line in q.read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  r=json.loads(line)
                  cid=str(r.get('compId') or '')
                  if cid in missing:
                      found[cid]=(label,r)
          for cid in sorted(missing):
              if cid in found:
                  label,row=found[cid]
                  print('BASELINE_ID',cid,'STATE',label)
                  print(json.dumps(row,ensure_ascii=False,sort_keys=True))
              else:
                  print('BASELINE_ID',cid,'STATE','NOT_RETURNED_BY_CURRENT_SEARCH')
          print('ALL_SCOPE_REJECTED')
          q=Path('output/ENVINFO/scope_rejected_rows.jsonl')
          if q.exists():
              for line in q.read_text(encoding='utf-8').splitlines():
                  if line.strip():
                      r=json.loads(line)
                      print(json.dumps({k:r.get(k) for k in ['year','compId','compNm','search_terms_hit','detail_scope_decision','detail_scope_reason']},ensure_ascii=False,sort_keys=True))
          PY
