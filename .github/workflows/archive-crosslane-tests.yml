name: Archive cross-lane sustainability dedup tests

on:
  push:
    branches:
      - run/control-plane
    paths:
      - 'orchestrator/archive_stage.py'
      - 'orchestrator/archive_user_dedup_v2.py'
      - 'orchestrator/archive_user_dedup_pipeline.py'
      - 'orchestrator/archive_sustainability_crosslane.py'
      - 'orchestrator/archive_zip_dedup.py'
      - 'tests/test_archive_user_dedup_v2.py'
      - 'tests/test_archive_sustainability_crosslane.py'
      - '.github/workflows/archive-crosslane-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check xlsxwriter pypdf openpyxl
      - name: Run archive cross-lane regression tests
        run: >-
          python -m unittest
          tests.test_archive_user_dedup_v2
          tests.test_archive_sustainability_crosslane
          tests.test_archive_zip_dedup
          -v
