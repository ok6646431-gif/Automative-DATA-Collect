name: Probe ENV-INFO static print reconstruction

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/probe-envinfo-static-print.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/control-plane

      - name: Download Hyosung stable public artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/10454610708/zip > stable.zip
          mkdir -p src
          unzip -p stable.zip 'ENVINFO/raw_detail/2020_CT000000000000040484_효성티앤씨_주식회사.html' > src/raw.html
          test -s src/raw.html

      - name: Build print reconstruction
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          src = Path('src/raw.html')
          out = Path('probe')
          out.mkdir(exist_ok=True)
          html = src.read_text(encoding='utf-8', errors='replace')

          # The saved response contains all 27 inquiry sections.  The live page's
          # JavaScript hides all but the selected tab, while the site's printThis
          # button temporarily exposes selected sections.  For a static archive,
          # keep all source sections and remove runtime scripts.
          html = re.sub(r'<script\\b[^>]*>.*?</script\\s*>', '', html, flags=re.I|re.S)

          # Restore official CSS/image assets for the saved HTML.
          html = re.sub(r'href=(["\\'])/(?!/)', r'href=\\1https://www.env-info.kr/', html, flags=re.I)
          html = re.sub(r'src=(["\\'])/(?!/)', r'src=\\1https://www.env-info.kr/', html, flags=re.I)

          css = r'''
          <style id="archive-static-print">
          @page { size: A4 portrait; margin: 10mm; }
          html, body { min-width:0 !important; width:auto !important; margin:0 !important; padding:0 !important; }
          .inquiry_wrap { width:100% !important; min-width:0 !important; height:auto !important; display:block !important; }
          .inquiry_wrap .colleft, .tbl_inquiry, #compSearchSelect, #totalInfoPopBtn,
          .btn_mtype1, .btn_wrap { display:none !important; }
          .inquiry_wrap .colright, .colright {
              width:100% !important; max-width:none !important; float:none !important;
              margin:0 !important; padding:0 !important; height:auto !important;
          }
          .inquiry_cont {
              display:block !important; width:100% !important; margin:0 0 20px 0 !important;
              page-break-inside:auto !important;
          }
          .inquiry_cont h3 {
              display:block !important; font-size:17px !important; line-height:1.35 !important;
              margin:18px 0 8px !important; padding:8px 10px !important;
              word-break:keep-all !important; overflow-wrap:break-word !important;
          }
          .inquiry_cont h4, .tit_wrap {
              word-break:keep-all !important; overflow-wrap:break-word !important;
          }
          table {
              width:100% !important; max-width:100% !important; table-layout:auto !important;
              border-collapse:collapse !important;
          }
          colgroup col { width:auto !important; }
          th, td {
              width:auto !important; min-width:0 !important; max-width:none !important;
              white-space:normal !important; word-break:keep-all !important;
              overflow-wrap:break-word !important; vertical-align:top !important;
          }
          img { max-width:100% !important; height:auto !important; }
          a { color:#000 !important; text-decoration:none !important; }
          </style>
          '''
          html = html.replace('</head>', css + '</head>', 1)
          (out/'normalized.html').write_text(html, encoding='utf-8')
          PY

      - name: Render PDF
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          "$CHROME"             --headless=new             --disable-gpu             --no-sandbox             --allow-file-access-from-files             --no-pdf-header-footer             --virtual-time-budget=12000             --print-to-pdf="$PWD/probe/normalized.pdf"             "file://$PWD/probe/normalized.html" || true
          test -s probe/normalized.pdf
          file probe/normalized.pdf
          pdfinfo probe/normalized.pdf | tee probe/pdfinfo.txt || true
          pdftotext -layout probe/normalized.pdf probe/extracted.txt || true
          python - <<'PY'
          from pathlib import Path
          p=Path('probe/extracted.txt')
          if not p.exists():
              raise SystemExit
          lines=[x.strip() for x in p.read_text(encoding='utf-8',errors='replace').splitlines() if x.strip()]
          single=sum(1 for x in lines if len(x)==1)
          anchors=['사업현황','녹색경영','대기오염물질 배출량','수질오염물질 배출량','폐기물','화학물질 배출량','환경법규 위반','지속가능']
          text='\\n'.join(lines)
          report=[
              f'nonempty_lines={len(lines)}',
              f'single_char_lines={single}',
              f'single_char_ratio={(single/len(lines) if lines else 0):.4f}',
          ]
          report += [f'anchor_{a}={a in text}' for a in anchors]
          Path('probe/content_qa.txt').write_text('\\n'.join(report)+'\\n',encoding='utf-8')
          print('\\n'.join(report))
          PY

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: envinfo-static-print-probe
          path: probe
          retention-days: 2

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name 'openai-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/probe-envinfo-static-print.yml
          git commit -m 'Remove ENV-INFO static print probe workflow'
          git push origin HEAD:run/control-plane
