name: Apply generic site catalog heading fix

on:
  workflow_dispatch:
  push:
    branches:
      - run/control-plane
    paths:
      - 'tools/apply_site_catalog_heading_fix.py'
      - '.github/workflows/apply-site-catalog-heading-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser test dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Apply generic parser patch
        run: python tools/apply_site_catalog_heading_fix.py
      - name: Validate parser and regression tests
        run: |
          python -m py_compile orchestrator/g0_domestic_site_catalog.py
          python -m unittest tests.test_g0_domestic_site_catalog -v
      - name: Commit validated patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orchestrator/g0_domestic_site_catalog.py tests/test_g0_domestic_site_catalog.py
          if git diff --cached --quiet; then
            echo 'No parser changes to commit.'
          else
            git commit -m 'Fix semantic site-card pairing and Korean beongil addresses'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
