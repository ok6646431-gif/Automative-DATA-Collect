name: Rebuild Hyosung current archive after human fixes

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/rebuild-hyosung-current.yml'

permissions:
  contents: write
  actions: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONPATH: orchestrator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/control-plane
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install archive runtime
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 xlsxwriter openpyxl pypdf cryptography
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-nanum >/dev/null
          sudo fc-cache -f

      - name: Download retained Hyosung source package
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 35112968790
          name: enterprise-env-final
          path: source
          github-token: ${{ github.token }}

      - name: Prepare replay lanes
        run: |
          set -euo pipefail
          test -s source/Company_Profile.json
          test -s source/output/ENVINFO/status.json
          mkdir -p stable evidence
          cp -a source/output/CORP_DOCS stable/CORP_DOCS
          if [ -s source/Document_Evidence.json ]; then
            cp source/Document_Evidence.json evidence/Document_Evidence.json
          fi
          rm -rf source/Human_Archive source/Human_Archive.zip

      - name: Rebuild with current production code
        run: |
          python orchestrator/archive_stage.py             --package source             --stable stable             --documents evidence/Document_Evidence.json

      - name: Validate final human state
        run: |
          python - <<'PY'
          import json, re, zipfile
          from pathlib import Path

          zpath=Path('source/Human_Archive.zip')
          summary=json.loads(Path('source/Archive_Summary.json').read_text(encoding='utf-8'))
          manifest=json.loads(Path('source/Master_Manifest.json').read_text(encoding='utf-8'))
          with zipfile.ZipFile(zpath) as z:
              names=z.namelist()
              reports=[
                  n for n in names
                  if '/01_사용자자료/04_지속가능경영보고서/' in n
                  and n.lower().endswith('.pdf')
              ]
              years=set()
              for n in reports:
                  m=re.search(r'(?<!\d)(20\d{2})(?!\d)',Path(n).name)
                  if m: years.add(int(m.group(1)))
              envinfo=[
                  n for n in names
                  if '/01_사용자자료/03_환경정보공개시스템/' in n
                  and n.endswith('_전체내용정적재현본.pdf')
              ]
          expected={2020,2021,2022,2023,2024,2025}
          if years != expected:
              raise SystemExit(f'sustainability years mismatch: {sorted(years)} reports={reports}')
          if len(envinfo)!=15:
              raise SystemExit(f'expected 15 ENVINFO reconstructed PDFs, got {len(envinfo)}')
          cov=summary.get('sustainability_coverage') or {}
          if set(cov.get('delivered_report_years') or []) != expected:
              raise SystemExit(f'coverage delivered years mismatch: {cov}')
          if cov.get('missing_target_years'):
              raise SystemExit(f'unexpected sustainability gaps: {cov}')
          if cov.get('resolved_without_file_years') != [2026]:
              raise SystemExit(f'2026 not-published resolution missing: {cov}')
          human=manifest.get('human_archive') or {}
          if summary.get('archive_completeness')!='COMPLETE':
              raise SystemExit(f'archive summary not complete: {summary.get("blocking_acceptance_checks")}')
          if human.get('status')!='PASS' or human.get('archive_completeness')!='COMPLETE':
              raise SystemExit(f'manifest human status stale/inconsistent: {human}')
          result={
              'status':'PASS',
              'report_files':[Path(x).name for x in reports],
              'report_years':sorted(years),
              'envinfo_reconstructed_pdf_count':len(envinfo),
              'archive_completeness':summary.get('archive_completeness'),
              'human_manifest_status':human.get('status'),
              'coverage':cov,
              'zip_bytes':zpath.stat().st_size,
          }
          Path('source/Hyosung_Rebuild_QA.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY

      - name: Upload regenerated archive
        uses: actions/upload-artifact@v4
        with:
          name: hyosung-human-archive-improved
          path: |
            source/Human_Archive.zip
            source/Hyosung_Rebuild_QA.json
            source/Archive_Summary.json
            source/Master_Manifest.json
          retention-days: 7
          compression-level: 0

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name 'openai-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/rebuild-hyosung-current.yml
          git commit -m 'Remove Hyosung rebuild workflow'
          git push origin HEAD:run/control-plane
