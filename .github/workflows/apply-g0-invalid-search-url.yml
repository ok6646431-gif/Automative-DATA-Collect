name: Apply G0 malformed search URL guard

on:
  push:
    branches: [run/control-plane]
    paths:
      - 'tools/patch_g0_invalid_search_url.py'
      - '.github/workflows/apply-g0-invalid-search-url.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Apply exact URL guard patch
        run: python tools/patch_g0_invalid_search_url.py
      - name: Run targeted regression
        run: |
          python -m py_compile orchestrator/g0_official_site_recovery.py
          python -m unittest tests.test_g0_official_site_recovery -v
      - name: Commit verified production change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orchestrator/g0_official_site_recovery.py tests/test_g0_official_site_recovery.py
          git diff --cached --check
          git commit -m "Ignore malformed search URL candidates in G0"
          git push origin HEAD:run/control-plane
