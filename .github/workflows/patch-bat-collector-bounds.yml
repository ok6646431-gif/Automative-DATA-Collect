name: Patch BAT collector bounded runtime

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/patch-bat-collector-bounds.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/control-plane
      - name: Apply bounded BAT download policy
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('orchestrator/bat_collector.py')
          s=p.read_text(encoding='utf-8')

          old="""def _session():
    # Network dependencies are intentionally lazy-loaded. Importing package_run
    # must not require requests/bs4 unless BAT collection is actually executed.
    import requests
    from requests.adapters import HTTPAdapter
    from urllib3.util.retry import Retry
    retry=Retry(total=4,connect=4,read=3,status=3,backoff_factor=1.2,
                status_forcelist=(408,425,429,500,502,503,504),allowed_methods=frozenset({'GET'}),
                raise_on_status=False,respect_retry_after_header=True)
    s=requests.Session()
    s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; EnvironmentalDataCollector/1.0; official-public-reference)'})
    s.mount('https://',HTTPAdapter(max_retries=retry)); s.mount('http://',HTTPAdapter(max_retries=retry)); return s
"""
          new="""def _session():
    # Network dependencies are intentionally lazy-loaded. Importing package_run
    # must not require requests/bs4 unless BAT collection is actually executed.
    # Retries are handled explicitly by fetch_pdf_from_spec for current direct
    # documents. Adapter-level retries are disabled so one unreachable official
    # endpoint cannot multiply into a many-minute hidden stall.
    import requests
    from requests.adapters import HTTPAdapter
    from urllib3.util.retry import Retry
    retry=Retry(total=0,connect=0,read=0,status=0,backoff_factor=0,
                status_forcelist=(408,425,429,500,502,503,504),allowed_methods=frozenset({'GET'}),
                raise_on_status=False,respect_retry_after_header=True)
    s=requests.Session()
    s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; EnvironmentalDataCollector/1.0; official-public-reference)'})
    s.mount('https://',HTTPAdapter(max_retries=retry)); s.mount('http://',HTTPAdapter(max_retries=retry)); return s
"""
          if old not in s: raise SystemExit('session block not found')
          s=s.replace(old,new)

          old="def _get(session,url,timeout=(15,90)):\n"
          new="def _get(session,url,timeout=(8,30)):\n"
          if old not in s: raise SystemExit('_get timeout block not found')
          s=s.replace(old,new)

          old="""def fetch_pdf_from_spec(spec):
    direct=str(spec.get('official_pdf_url') or '').strip(); expected=str(spec.get('official_pdf_sha256') or '').strip().lower(); errors=[]
    if direct:
        try:
            rr=_get(_session(),direct); final,data,digest=_verified_pdf_response(rr,expected)
            return final,data,f'VERIFIED_OFFICIAL_DIRECT_PDF:sha256={digest}'
        except Exception as exc: errors.append(f'direct:{direct}:{type(exc).__name__}:{exc}')
"""
          new="""def fetch_pdf_from_spec(spec,direct_attempts=2):
    direct=str(spec.get('official_pdf_url') or '').strip(); expected=str(spec.get('official_pdf_sha256') or '').strip().lower(); errors=[]
    if direct:
        attempts=max(1,min(int(direct_attempts or 1),2))
        for attempt in range(1,attempts+1):
            try:
                rr=_get(_session(),direct); final,data,digest=_verified_pdf_response(rr,expected)
                return final,data,f'VERIFIED_OFFICIAL_DIRECT_PDF:sha256={digest}; attempt={attempt}'
            except Exception as exc:
                errors.append(f'direct_attempt_{attempt}:{direct}:{type(exc).__name__}:{exc}')
"""
          if old not in s: raise SystemExit('fetch_pdf_from_spec block not found')
          s=s.replace(old,new)

          old="""def _family_entries(catalog,family):
    entries=[e for e in (catalog.get('entries',[]) or []) if str(e.get('catalog_family') or e.get('catalog_id') or '')==family]
    return sorted(entries,key=lambda e:(int(e.get('publication_year') or 0),str(e.get('revision_generation') or ''),str(e.get('catalog_id') or '')))
"""
          new="""def _family_entries(catalog,family):
    entries=[e for e in (catalog.get('entries',[]) or []) if str(e.get('catalog_family') or e.get('catalog_id') or '')==family]
    # Current/preferred evidence is the deliverable. Superseded revisions are
    # enrichment and must never delay or prevent current-reference collection.
    return sorted(entries,key=lambda e:(
        0 if e.get('preferred',True) is not False else 1,
        -int(e.get('publication_year') or 0),
        str(e.get('revision_generation') or ''),
        str(e.get('catalog_id') or ''),
    ))
"""
          if old not in s: raise SystemExit('_family_entries block not found')
          s=s.replace(old,new)

          old="""    rows=[]
    current_downloaded=current_failed=current_pending=current_locator_pending=0
    archive_downloaded=archive_failed=archive_locator_pending=0

    for family,group in sorted(by_family.items()):
"""
          new="""    rows=[]
    current_downloaded=current_failed=current_pending=current_locator_pending=0
    archive_downloaded=archive_failed=archive_locator_pending=0

    def record(row):
        rows.append(row)
        # Persist progress after every document so a runner timeout or source
        # outage still leaves an auditable partial index instead of a blank BAT stage.
        write_csv(out/'document_index.csv',rows,INDEX_FIELDS)
        print(json.dumps({
            'BAT_DOCUMENT_PROGRESS':len(rows),
            'catalog_id':row.get('catalog_id',''),
            'document_part':row.get('document_part',''),
            'revision_status':row.get('revision_status',''),
            'collection_status':row.get('collection_status',''),
        },ensure_ascii=False),flush=True)

    for family,group in sorted(by_family.items()):
"""
          if old not in s: raise SystemExit('record insertion point not found')
          s=s.replace(old,new)

          # All row appends below this point are document-index emissions.
          marker="    for family,group in sorted(by_family.items()):\n"
          head,tail=s.split(marker,1)
          tail=tail.replace('rows.append(', 'record(')
          s=head+marker+tail

          old="final_url,data,basis=fetch_pdf_from_spec(spec)"
          if s.count(old)!=2: raise SystemExit(f'expected two collector fetch call sites, got {s.count(old)}')
          s=s.replace(old,"final_url,data,basis=fetch_pdf_from_spec(spec,direct_attempts=1)",1)
          s=s.replace(old,"final_url,data,basis=fetch_pdf_from_spec(spec,direct_attempts=2)",1)

          p.write_text(s,encoding='utf-8')

          t=Path('tests/test_bat_revision_collection.py')
          q=t.read_text(encoding='utf-8')
          old="""            with patch('orchestrator.bat_collector.fetch_pdf_from_spec',return_value=('https://ieps.nier.go.kr/file.pdf',b'%PDF-1.4\\n%%EOF','TEST')):
                status=collect(package,catalog_path)
"""
          new="""            with patch('orchestrator.bat_collector.fetch_pdf_from_spec',return_value=('https://ieps.nier.go.kr/file.pdf',b'%PDF-1.4\\n%%EOF','TEST')) as mocked:
                status=collect(package,catalog_path)
"""
          if old not in q: raise SystemExit('revision test patch target not found')
          q=q.replace(old,new,1)
          anchor="""            self.assertEqual(status['current_downloaded'],1)
            self.assertEqual(status['superseded_downloaded'],1)
            self.assertEqual(status['status'],'DATA_FOUND')
"""
          repl="""            self.assertEqual(status['current_downloaded'],1)
            self.assertEqual(status['superseded_downloaded'],1)
            self.assertEqual(status['status'],'DATA_FOUND')
            self.assertEqual(mocked.call_args_list[0].args[0]['catalog_id'],'BAT_NEW')
            self.assertEqual(mocked.call_args_list[0].kwargs.get('direct_attempts'),2)
            self.assertEqual(mocked.call_args_list[1].args[0]['catalog_id'],'BAT_OLD')
            self.assertEqual(mocked.call_args_list[1].kwargs.get('direct_attempts'),1)
"""
          if anchor not in q: raise SystemExit('revision test assertion anchor not found')
          q=q.replace(anchor,repl,1)
          t.write_text(q,encoding='utf-8')
          PY
      - name: Run focused regressions before commit
        run: python -m unittest tests.test_bat_revision_collection tests.test_bat_effective_catalog -v
      - name: Commit bounded collector
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orchestrator/bat_collector.py tests/test_bat_revision_collection.py
          git diff --cached --check
          git commit -m "Bound BAT source collection runtime"
          git push origin HEAD:run/control-plane
