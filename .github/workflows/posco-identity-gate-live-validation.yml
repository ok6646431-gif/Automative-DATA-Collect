name: POSCO identity gate live validation

on:
  push:
    branches: [run/posco-identity-gate-validation]
    paths:
      - .github/workflows/posco-identity-gate-live-validation.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  validate-public-collectors:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 xlsxwriter
      - name: Restore verified POSCO discovery inputs
        run: |
          git fetch --depth=1 origin run/posco-support-pack
          for f in company_discovery.json document_evidence.json event_evidence.json; do
            git show FETCH_HEAD:requests/$f > requests/$f
          done
      - name: Build runtime request with identity gate
        run: >-
          python orchestrator/bootstrap_inputs.py
          --profile-out requests/runtime/company_profile.generated.json
          --request-out requests/current.generated.json
          --summary-out requests/runtime/Company_Discovery_Summary.json
      - name: Run identity gate unit tests
        run: python -m unittest tests.test_entity_scope_gate -v
      - name: Collect ENV-INFO with pre-download gate
        run: python collectors/envinfo_collect.py requests/current.generated.json
      - name: Recover ENV-INFO target attachments only
        run: python collectors/envinfo_attachment_recovery.py --out output/ENVINFO --repo-root .
      - name: Collect CleanSYS with candidate gate
        run: python collectors/cleansys_collect.py requests/current.generated.json
      - name: Collect SOOSIRO with candidate gate
        run: python collectors/soosiro_collect.py requests/current.generated.json
      - name: Collect PRTR with detail gate
        run: python collectors/prtr_collect.py requests/current.generated.json
      - name: Collect chemical statistics with detail/backfill gate
        run: python collectors/chem_stats_collect.py requests/current.generated.json
      - name: Verify and summarize upstream scope
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          root=Path('output')
          summary={}
          for source in ['ENVINFO','CLEANSYS_AIR','SOOSIRO_WATER','PRTR','CHEM_STATS']:
              p=root/source/'status.json'
              summary[source]=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {'status':'MISSING'}

          env=root/'ENVINFO'
          attachment_files=[p for p in (env/'raw_attachments').rglob('*') if p.is_file()] if (env/'raw_attachments').exists() else []
          summary['ENVINFO']['physical_attachment_files']=len(attachment_files)
          summary['ENVINFO']['physical_attachment_bytes']=sum(p.stat().st_size for p in attachment_files)
          idx=env/'attachment_index.csv'
          attachment_rows=[]
          if idx.exists():
              with idx.open(encoding='utf-8-sig', newline='') as f:
                  attachment_rows=list(csv.DictReader(f))
              summary['ENVINFO']['attachment_companies']=sorted({r.get('compNm','') for r in attachment_rows if r.get('compNm')})

          def names_jsonl(path, fields):
              out=[]
              if path.exists():
                  for line in path.read_text(encoding='utf-8',errors='replace').splitlines():
                      if not line.strip(): continue
                      r=json.loads(line)
                      val=' | '.join(str(r.get(k) or '') for k in fields).strip(' |')
                      if val and val not in out: out.append(val)
              return out[:100]

          summary['ENVINFO']['scope_rejected_names']=names_jsonl(env/'scope_rejected_rows.jsonl',['compNm'])
          summary['PRTR']['scope_rejected_names']=names_jsonl(root/'PRTR'/'scope_rejected_rows.jsonl',['company_name_raw'])
          summary['CHEM_STATS']['scope_rejected_names']=names_jsonl(root/'CHEM_STATS'/'scope_rejected_rows.jsonl',['bplcNm','locplcAdres'])
          summary['SOOSIRO_WATER']['scope_rejected_names']=names_jsonl(root/'SOOSIRO_WATER'/'scope_rejected_rows.jsonl',['FACT_NAME','FACT_FNAME'])
          cp=root/'CLEANSYS_AIR'/'scope_rejected_candidates.json'
          if cp.exists():
              summary['CLEANSYS_AIR']['scope_rejected_names']=[x.get('company_name_raw','') for x in json.loads(cp.read_text(encoding='utf-8'))][:100]

          disc=env/'discovery.csv'
          allowed_ids=set()
          if disc.exists():
              with disc.open(encoding='utf-8-sig',newline='') as f:
                  allowed_ids={str(r.get('compId') or '') for r in csv.DictReader(f)}
          bad=[r for r in attachment_rows if str(r.get('compId') or '') not in allowed_ids]
          if bad:
              raise SystemExit('ENVINFO heavy-download scope leak: '+str(bad[:3]))

          Path('posco_identity_gate_validation.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: posco-identity-gate-validation
          path: |
            posco_identity_gate_validation.json
            requests/current.generated.json
            output/ENVINFO/status.json
            output/ENVINFO/discovery.csv
            output/ENVINFO/scope_rejected_rows.jsonl
            output/ENVINFO/attachment_index.csv
            output/CLEANSYS_AIR/status.json
            output/CLEANSYS_AIR/candidates.json
            output/CLEANSYS_AIR/scope_rejected_candidates.json
            output/SOOSIRO_WATER/status.json
            output/SOOSIRO_WATER/fact_candidates.json
            output/SOOSIRO_WATER/scope_rejected_rows.jsonl
            output/PRTR/status.json
            output/PRTR/discovery.csv
            output/PRTR/scope_rejected_rows.jsonl
            output/CHEM_STATS/status.json
            output/CHEM_STATS/discovery.csv
            output/CHEM_STATS/scope_rejected_rows.jsonl
          if-no-files-found: warn
          retention-days: 7
