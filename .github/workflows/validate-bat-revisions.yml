name: Validate BAT revision archive
on:
  push:
    branches: [run/control-plane]
    paths:
      - 'orchestrator/bat_catalog_audit.py'
      - 'orchestrator/bat_catalog_discovery.py'
      - 'orchestrator/bat_catalog_effective.py'
      - 'orchestrator/bat_catalog_status_overrides.json'
      - 'orchestrator/bat_master_catalog.json'
      - 'orchestrator/bat_resolver.py'
      - 'orchestrator/bat_collector.py'
      - 'orchestrator/bat_archive.py'
      - 'tests/test_bat_catalog_audit.py'
      - 'tests/test_bat_catalog_discovery.py'
      - 'tests/test_bat_effective_catalog.py'
      - 'tests/test_bat_resolver.py'
      - 'tests/test_bat_revision_collection.py'
      - 'tests/test_bat_archive.py'
      - '.github/workflows/validate-bat-revisions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check xlsxwriter openpyxl
      - name: Run BAT revision tests
        run: python -m unittest tests.test_bat_catalog_audit tests.test_bat_catalog_discovery tests.test_bat_effective_catalog tests.test_bat_resolver tests.test_bat_revision_collection tests.test_bat_archive -v
      - name: Run static BAT catalog integrity audit
        run: python orchestrator/bat_catalog_audit.py --out BAT_Catalog_Audit.json
      - name: Compile BAT modules
        run: python -m py_compile orchestrator/bat_catalog_audit.py orchestrator/bat_catalog_discovery.py orchestrator/bat_catalog_effective.py orchestrator/bat_resolver.py orchestrator/bat_collector.py orchestrator/bat_archive.py
      - name: Upload BAT catalog audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bat-catalog-static-audit
          path: BAT_Catalog_Audit.json
          if-no-files-found: warn
          retention-days: 14
