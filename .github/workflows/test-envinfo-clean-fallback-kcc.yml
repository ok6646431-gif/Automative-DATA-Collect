name: Test generic ENV-INFO clean fallback on KCC

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/test-envinfo-clean-fallback-kcc.yml'

permissions:
  contents: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: orchestrator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/control-plane
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check beautifulsoup4 pypdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-nanum >/dev/null
          sudo fc-cache -f

      - name: Download KCC final package
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 35323339919
          name: enterprise-env-final
          path: final
          github-token: ${{ github.token }}

      - name: Build clean fallback PDFs and compare
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from archive_builder import render_html_pdf
          from envinfo_content_qa import compare_text, _source_text, _pdf_text

          sources=[
            ('울산공장','2021','2021_00000000000000148321_주_케이씨씨_울산공장.html'),
            ('안성공장','2022','2022_CM000000000000000307_주_케이씨씨_안성공장.html'),
          ]
          out=Path('fallback'); out.mkdir()
          CSS=r'''
          @page { size:A4 portrait; margin:10mm; }
          * { box-sizing:border-box; }
          body { margin:0; color:#111; font-family:"Noto Sans CJK KR","NanumGothic",sans-serif; font-size:10pt; line-height:1.45; }
          .inquiry_cont { display:block; width:100%; margin:0 0 14px 0; }
          h1,h2,h3,h4,h5 { color:#111; margin:12px 0 6px; page-break-after:avoid; }
          h3 { font-size:15pt; padding:6px 8px; border-top:2px solid #245a9b; border-bottom:1px solid #9fb2ca; }
          h4 { font-size:12pt; }
          table { width:100%; border-collapse:collapse; table-layout:auto; margin:4px 0 10px; }
          th,td { border:1px solid #b7c1ce; padding:4px 6px; vertical-align:top; white-space:normal; overflow-wrap:anywhere; }
          th { background:#eef2f7; font-weight:600; }
          img { max-width:100%; height:auto; }
          ul,ol { margin:4px 0 8px 20px; padding:0; }
          a { color:#111; text-decoration:none; }
          input,button,select,textarea { display:none !important; }
          '''
          result={}
          for site,year,name in sources:
              src=Path('final/output/ENVINFO/raw_detail')/name
              html=src.read_text(encoding='utf-8',errors='replace')
              soup=BeautifulSoup(html,'html.parser')
              sections=soup.select('.inquiry_cont')
              if not sections:
                  raise SystemExit(f'no inquiry sections: {src}')
              for section in sections:
                  for tag in section.find_all(['script','style','link','button','input','select','textarea']):
                      tag.decompose()
                  for tag in section.find_all(True):
                      for attr in ['style','class','id','onclick','onmouseover','onmouseout']:
                          tag.attrs.pop(attr,None)
              body='\n'.join(str(x) for x in sections)
              clean=f'<!doctype html><html><head><meta charset="utf-8"><style>{CSS}</style></head><body>{body}</body></html>'
              hp=out/f'{site}_{year}.html'; hp.write_text(clean,encoding='utf-8')
              pdf=out/f'{site}_{year}.pdf'
              ok,err=render_html_pdf(hp,pdf)
              if not ok: raise SystemExit(f'render failed {site} {year}: {err}')
              source_text,section_count=_source_text(src)
              pdf_text,pages=_pdf_text(pdf)
              cmp=compare_text(source_text,pdf_text)
              result[f'{site}_{year}']={
                  'source_sections':section_count,
                  'pages':pages,
                  'source_chars':len(source_text),
                  'pdf_chars':len(pdf_text),
                  **cmp,
                  'pdf_bytes':pdf.stat().st_size,
              }
          Path('fallback/result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if any(x['verdict']!='PASS' for x in result.values()):
              raise SystemExit('clean fallback did not reach PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: kcc-envinfo-clean-fallback-test
          path: fallback/
          retention-days: 14
          compression-level: 0

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name 'openai-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/test-envinfo-clean-fallback-kcc.yml
          git commit -m 'Remove ENV-INFO clean fallback KCC test workflow'
          git push origin HEAD:run/control-plane
