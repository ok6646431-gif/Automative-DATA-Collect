name: Enterprise environmental source collection

on:
  pull_request:
    paths:
      - 'requests/**'
      - 'collectors/**'
      - '.github/workflows/collect.yml'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Collect PRTR
        run: python collectors/prtr_collect.py requests/current.json

      - name: Upload raw and parsed artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-env-collection
          path: output/
          if-no-files-found: warn
          retention-days: 7
