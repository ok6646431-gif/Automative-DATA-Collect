name: Enterprise environmental ICIS collection

on:
  pull_request:
    paths:
      - 'requests/run_token.txt'
  workflow_dispatch:

jobs:
  icis_sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Collect PRTR
        continue-on-error: true
        run: python collectors/prtr_collect.py requests/current.json
      - name: Collect Chemical Statistics
        continue-on-error: true
        run: python collectors/chem_stats_collect.py requests/current.json
      - name: Upload ICIS artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icis-sources
          path: output/
          if-no-files-found: warn
          retention-days: 7
      - name: ICIS retry gate
        if: always()
        run: python collectors/icis_gate.py
