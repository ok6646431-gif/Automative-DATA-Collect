name: Enterprise environmental Master Orchestrator v1

on:
  pull_request:
    paths:
      - 'requests/company_discovery.json'
      - 'requests/event_evidence.json'
      - 'requests/document_evidence.json'
      - 'requests/company_profile.json'
      - 'requests/run_token.txt'
      - 'orchestrator/**'
      - 'collectors/**'
      - '.github/workflows/collect.yml'
  push:
    branches:
      - 'run/control-plane'
    paths:
      - 'requests/company_discovery.json'
      - 'requests/event_evidence.json'
      - 'requests/document_evidence.json'
      - 'requests/run_token.txt'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  stable_sources:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Bootstrap runtime company inputs
        run: >-
          python orchestrator/bootstrap_inputs.py
          --profile-out requests/runtime/company_profile.generated.json
          --request-out requests/current.generated.json
          --summary-out requests/runtime/Company_Discovery_Summary.json
      - name: Run parser regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Collect ENV-INFO
        continue-on-error: true
        run: python collectors/envinfo_collect.py requests/current.generated.json
      - name: Collect SOOSIRO
        continue-on-error: true
        run: python collectors/soosiro_collect.py requests/current.generated.json
      - name: Collect CleanSYS
        continue-on-error: true
        run: python collectors/cleansys_collect.py requests/current.generated.json
      - name: Collect corporate documents
        continue-on-error: true
        run: python collectors/corporate_docs_collect.py requests/document_evidence.json requests/runtime/company_profile.generated.json
      - name: Upload stable sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stable-sources
          path: output/
          if-no-files-found: warn
          retention-days: 7

  icis_attempt_1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      gate_outcome: ${{ steps.icis_gate.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Bootstrap runtime company inputs
        run: >-
          python orchestrator/bootstrap_inputs.py
          --profile-out requests/runtime/company_profile.generated.json
          --request-out requests/current.generated.json
          --summary-out requests/runtime/Company_Discovery_Summary.json
      - name: Collect PRTR
        continue-on-error: true
        run: python collectors/prtr_collect.py requests/current.generated.json
      - name: Collect Chemical Statistics
        continue-on-error: true
        run: python collectors/chem_stats_collect.py requests/current.generated.json
      - name: Upload ICIS attempt 1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icis-attempt-1
          path: output/
          if-no-files-found: warn
          retention-days: 7
      - name: ICIS gate
        id: icis_gate
        continue-on-error: true
        if: always()
        run: python collectors/icis_gate.py

  icis_attempt_2:
    needs: icis_attempt_1
    if: ${{ always() && needs.icis_attempt_1.outputs.gate_outcome == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      gate_outcome: ${{ steps.icis_gate.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Bootstrap runtime company inputs
        run: >-
          python orchestrator/bootstrap_inputs.py
          --profile-out requests/runtime/company_profile.generated.json
          --request-out requests/current.generated.json
          --summary-out requests/runtime/Company_Discovery_Summary.json
      - name: Collect PRTR
        continue-on-error: true
        run: python collectors/prtr_collect.py requests/current.generated.json
      - name: Collect Chemical Statistics
        continue-on-error: true
        run: python collectors/chem_stats_collect.py requests/current.generated.json
      - name: Upload ICIS attempt 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icis-attempt-2
          path: output/
          if-no-files-found: warn
          retention-days: 7
      - name: ICIS gate
        id: icis_gate
        continue-on-error: true
        if: always()
        run: python collectors/icis_gate.py

  icis_attempt_3:
    needs: icis_attempt_2
    if: ${{ always() && needs.icis_attempt_2.outputs.gate_outcome == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      gate_outcome: ${{ steps.icis_gate.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Bootstrap runtime company inputs
        run: >-
          python orchestrator/bootstrap_inputs.py
          --profile-out requests/runtime/company_profile.generated.json
          --request-out requests/current.generated.json
          --summary-out requests/runtime/Company_Discovery_Summary.json
      - name: Collect PRTR
        continue-on-error: true
        run: python collectors/prtr_collect.py requests/current.generated.json
      - name: Collect Chemical Statistics
        continue-on-error: true
        run: python collectors/chem_stats_collect.py requests/current.generated.json
      - name: Upload ICIS attempt 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icis-attempt-3
          path: output/
          if-no-files-found: warn
          retention-days: 7
      - name: ICIS gate
        id: icis_gate
        continue-on-error: true
        if: always()
        run: python collectors/icis_gate.py

  package_and_validate:
    needs: [stable_sources, icis_attempt_1, icis_attempt_2, icis_attempt_3]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap runtime company inputs
        run: >-
          python orchestrator/bootstrap_inputs.py
          --profile-out requests/runtime/company_profile.generated.json
          --request-out requests/current.generated.json
          --summary-out requests/runtime/Company_Discovery_Summary.json
      - name: Download stable artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: stable-sources
          path: collected/stable
      - name: Download ICIS attempts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: icis-attempt-*
          path: collected/icis
          merge-multiple: false
      - name: Assemble, validate and manifest
        run: >-
          python orchestrator/package_run.py
          --stable collected/stable
          --icis collected/icis
          --profile requests/runtime/company_profile.generated.json
          --out assembled
      - name: Preserve discovery bootstrap summary
        if: always()
        run: |
          mkdir -p assembled
          if [ -f requests/runtime/Company_Discovery_Summary.json ]; then
            cp requests/runtime/Company_Discovery_Summary.json assembled/Company_Discovery_Summary.json
          fi
      - name: Build human-facing archive
        run: >-
          python orchestrator/archive_stage.py
          --package assembled
          --stable collected/stable
          --documents requests/document_evidence.json
      - name: Upload human-facing archive
        id: human_archive_upload
        if: ${{ always() && hashFiles('assembled/Human_Archive.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-env-human-archive
          path: assembled/Human_Archive.zip
          if-no-files-found: warn
          retention-days: 14
      - name: Prepare lightweight metadata delivery
        if: always()
        run: |
          rm -rf delivery-metadata
          mkdir -p delivery-metadata/output
          for file in assembled/*.json assembled/*.csv; do
            if [ -f "$file" ]; then cp "$file" delivery-metadata/; fi
          done
          for source_dir in assembled/output/*; do
            [ -d "$source_dir" ] || continue
            target="delivery-metadata/output/$(basename "$source_dir")"
            mkdir -p "$target"
            for name in status.json discovery.csv candidates.json fact_candidates.json document_index.csv attachment_index.csv excluded_rows.jsonl excluded_candidates.json; do
              if [ -f "$source_dir/$name" ]; then cp "$source_dir/$name" "$target/"; fi
            done
          done
      - name: Upload lightweight metadata delivery
        id: metadata_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-env-metadata
          path: delivery-metadata/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload final orchestrated package
        id: final_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-env-final
          path: assembled/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish control-plane run receipt
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/run/control-plane' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_STATUS: ${{ job.status }}
          SERVER_URL: ${{ github.server_url }}
          ARTIFACT_ID: ${{ steps.final_upload.outputs.artifact-id }}
          HUMAN_ARTIFACT_ID: ${{ steps.human_archive_upload.outputs.artifact-id }}
          METADATA_ARTIFACT_ID: ${{ steps.metadata_upload.outputs.artifact-id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          state=os.environ.get("RUN_STATUS","error")
          if state not in {"success","failure","error","pending"}:
              state="error"
          repo=os.environ["REPOSITORY"]
          sha=os.environ["COMMIT_SHA"]
          run_id=os.environ["RUN_ID"]
          run_number=os.environ["RUN_NUMBER"]
          artifact_id=os.environ.get("ARTIFACT_ID","")
          human_id=os.environ.get("HUMAN_ARTIFACT_ID","")
          metadata_id=os.environ.get("METADATA_ARTIFACT_ID","")
          description=f"run #{run_number} {state}"
          if artifact_id:
              description += f"; final {artifact_id}"
          if human_id:
              description += f"; human {human_id}"
          if metadata_id:
              description += f"; meta {metadata_id}"
          payload={
              "state":state,
              "context":"enterprise-env/control-plane",
              "description":description[:140],
              "target_url":f"{os.environ['SERVER_URL']}/{repo}/actions/runs/{run_id}",
          }
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/statuses/{sha}",
              data=json.dumps(payload).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization":f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "Content-Type":"application/json",
              },
          )
          with urllib.request.urlopen(req,timeout=20) as response:
              print(response.read().decode("utf-8"))
          PY
