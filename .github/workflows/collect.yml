name: Enterprise environmental source collection

on:
  pull_request:
    paths:
      - 'requests/run_token.txt'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Probe source connectivity
        run: python collectors/network_probe.py

      - name: Run parser regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Discover ENV-INFO request format
        continue-on-error: true
        run: python collectors/envinfo_discover.py requests/current.json

      - name: Collect SOOSIRO proof
        continue-on-error: true
        run: python collectors/soosiro_collect.py requests/current.json

      - name: Collect CleanSYS proof
        continue-on-error: true
        run: python collectors/cleansys_collect.py requests/current.json

      - name: Collect PRTR proof
        continue-on-error: true
        run: python collectors/prtr_collect.py requests/current.json

      - name: Upload raw and parsed artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-env-collection
          path: output/
          if-no-files-found: warn
          retention-days: 7
