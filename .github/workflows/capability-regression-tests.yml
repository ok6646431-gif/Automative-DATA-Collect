name: Capability regression corpus

on:
  push:
    branches:
      - 'run/control-plane'
    paths:
      - 'orchestrator/zero_touch_discovery.py'
      - 'orchestrator/dart_public_resolver.py'
      - 'orchestrator/g0_*.py'
      - 'orchestrator/request_builder.py'
      - 'orchestrator/requested_scope.py'
      - 'orchestrator/collection_completeness.py'
      - 'orchestrator/archive*.py'
      - 'tests/test_requested_scope*.py'
      - 'tests/test_capability_regression_corpus.py'
      - 'tests/regression_cases/capability_cases.json'
      - 'docs/CAPABILITY_MATRIX.md'
      - 'docs/TEST_COMPANY_PORTFOLIO.md'
      - '.github/workflows/capability-regression-tests.yml'
  pull_request:
    paths:
      - 'orchestrator/zero_touch_discovery.py'
      - 'orchestrator/dart_public_resolver.py'
      - 'orchestrator/g0_*.py'
      - 'orchestrator/request_builder.py'
      - 'orchestrator/requested_scope.py'
      - 'orchestrator/collection_completeness.py'
      - 'orchestrator/archive*.py'
      - 'tests/test_requested_scope*.py'
      - 'tests/test_capability_regression_corpus.py'
      - 'tests/regression_cases/capability_cases.json'
      - 'docs/CAPABILITY_MATRIX.md'
      - 'docs/TEST_COMPANY_PORTFOLIO.md'
      - '.github/workflows/capability-regression-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 xlsxwriter
      - name: Run capability and requested-scope regressions
        run: >-
          python -m unittest
          tests.test_capability_regression_corpus
          tests.test_requested_scope
          tests.test_requested_scope_subunits
          tests.test_requested_scope_rename_bridge
          tests.test_requested_scope_bilingual_bridge
          tests.test_collection_completeness
          -v
