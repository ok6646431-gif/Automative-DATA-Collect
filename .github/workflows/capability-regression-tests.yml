name: Capability regression corpus

on:
  push:
    branches:
      - 'run/control-plane'
    paths:
      - 'orchestrator/zero_touch_discovery.py'
      - 'orchestrator/dart_public_resolver.py'
      - 'orchestrator/g0_*.py'
      - 'orchestrator/company_profile_builder.py'
      - 'orchestrator/request_builder.py'
      - 'orchestrator/requested_scope.py'
      - 'orchestrator/collection_completeness.py'
      - 'orchestrator/archive*.py'
      - 'collectors/soosiro_collect.py'
      - 'tools/build_application_material_from_archive.py'
      - 'tests/test_g0_generic_js_local_year.py'
      - 'tests/test_g0_js_form_report_recovery.py'
      - 'tests/test_g0_report_entity_alignment.py'
      - 'tests/test_application_material_from_archive.py'
      - 'tests/test_company_profile_builder.py'
      - 'tests/test_request_builder.py'
      - 'tests/test_requested_scope*.py'
      - 'tests/test_soosiro_retry.py'
      - 'tests/test_capability_regression_corpus.py'
      - 'tests/regression_cases/capability_cases.json'
      - 'docs/CAPABILITY_MATRIX.md'
      - 'docs/TEST_COMPANY_PORTFOLIO.md'
      - '.github/workflows/capability-regression-tests.yml'
  pull_request:
    paths:
      - 'orchestrator/zero_touch_discovery.py'
      - 'orchestrator/dart_public_resolver.py'
      - 'orchestrator/g0_*.py'
      - 'orchestrator/company_profile_builder.py'
      - 'orchestrator/request_builder.py'
      - 'orchestrator/requested_scope.py'
      - 'orchestrator/collection_completeness.py'
      - 'orchestrator/archive*.py'
      - 'collectors/soosiro_collect.py'
      - 'tools/build_application_material_from_archive.py'
      - 'tests/test_g0_generic_js_local_year.py'
      - 'tests/test_g0_js_form_report_recovery.py'
      - 'tests/test_g0_report_entity_alignment.py'
      - 'tests/test_application_material_from_archive.py'
      - 'tests/test_company_profile_builder.py'
      - 'tests/test_request_builder.py'
      - 'tests/test_requested_scope*.py'
      - 'tests/test_soosiro_retry.py'
      - 'tests/test_capability_regression_corpus.py'
      - 'tests/regression_cases/capability_cases.json'
      - 'docs/CAPABILITY_MATRIX.md'
      - 'docs/TEST_COMPANY_PORTFOLIO.md'
      - '.github/workflows/capability-regression-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 xlsxwriter
      - name: Run capability, identity and requested-scope regressions
        run: >-
          python -m unittest
          tests.test_g0_generic_js_local_year
          tests.test_g0_js_form_report_recovery
          tests.test_g0_report_entity_alignment
          tests.test_application_material_from_archive
          tests.test_capability_regression_corpus
          tests.test_company_profile_builder
          tests.test_request_builder
          tests.test_requested_scope
          tests.test_requested_scope_subunits
          tests.test_requested_scope_rename_bridge
          tests.test_requested_scope_bilingual_bridge
          tests.test_requested_scope_company_entity_filter
          tests.test_requested_scope_analysis_entity_filter
          tests.test_collection_completeness
          tests.test_soosiro_retry
          -v

  soosiro_live_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Bootstrap current control-plane request
        run: >-
          python orchestrator/bootstrap_inputs.py
          --profile-out requests/runtime/company_profile.generated.json
          --request-out requests/current.generated.json
          --summary-out requests/runtime/Company_Discovery_Summary.json
      - name: Probe SOOSIRO only
        continue-on-error: true
        run: python collectors/soosiro_collect.py requests/current.generated.json
      - name: Print SOOSIRO diagnostics
        if: always()
        run: |
          cat output/SOOSIRO_WATER/status.json || true
          echo '--- errors.log ---'
          cat output/SOOSIRO_WATER/errors.log || true
          echo '--- annual response contracts ---'
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('output/SOOSIRO_WATER/raw_annual')
          for p in sorted(root.glob('*.json')):
              try:
                  obj=json.loads(p.read_text(encoding='utf-8').lstrip('\ufeff'))
                  ok=isinstance(obj,dict) and isinstance(obj.get('list'),list)
                  rows=len(obj.get('list') or []) if ok else None
              except Exception as e:
                  ok=False; rows=None
              print(f'{p.name}\tbytes={p.stat().st_size}\tcontract_ok={ok}\trows={rows}')
          PY
