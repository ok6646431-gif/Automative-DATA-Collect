name: Apply corporate document Range segmentation
on:
  push:
    branches: [run/control-plane]
    paths:
      - 'tools/patch_corp_docs_range_segments.py'
      - 'tools/patch_corp_docs_range_test.py'
      - 'tests/test_corporate_docs_range_segments.py'
      - '.github/workflows/apply-corp-docs-range-segments.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Apply collector patch
        run: python tools/patch_corp_docs_range_segments.py
      - name: Update bounded Range regression
        run: python tools/patch_corp_docs_range_test.py
      - name: Run corporate document tests
        run: python -m unittest tests.test_corporate_docs_collect tests.test_corporate_docs_slow_retry tests.test_corporate_docs_range_segments -v
      - name: Commit collector and regression change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add collectors/corporate_docs_collect.py tests/test_corporate_docs_collect.py
          git diff --cached --exit-code && exit 0
          git commit -m 'Download Range-capable documents in bounded segments'
          git push
