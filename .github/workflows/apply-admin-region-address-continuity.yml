name: Apply administrative-region address continuity patch

on:
  push:
    branches: [run/control-plane]
    paths:
      - 'tools/patch_admin_region_address_continuity.py'
      - '.github/workflows/apply-admin-region-address-continuity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/patch_admin_region_address_continuity.py
      - run: python -m unittest tests.test_admin_region_address_continuity -v
      - run: python -m unittest tests.test_postprocess -v
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orchestrator/postprocess.py tests/test_admin_region_address_continuity.py
          git diff --cached --quiet && exit 0
          git commit -m "Bridge verified sites across administrative-region changes"
          git push
