name: Isolated POSCO full environmental pack

on:
  push:
    branches:
      - support/posco-full-pack-20260915
    paths:
      - '.github/workflows/posco-full-pack.yml'
      - 'requests/zero_touch_request.json'

permissions:
  contents: write
  actions: write

jobs:
  discover_and_dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install discovery dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 jsonschema
      - name: Read requested company
        id: request
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('requests/zero_touch_request.json').read_text(encoding='utf-8'))
          name=str(d.get('company_name') or '').strip()
          if not name:
              raise SystemExit('company_name missing')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('company_name=' + name.replace('\n',' ') + '\n')
          print(name)
          PY
      - name: Run fail-closed live Discovery
        env:
          COMPANY_NAME: ${{ steps.request.outputs.company_name }}
        run: >-
          python orchestrator/zero_touch_runner.py
          --company-name "$COMPANY_NAME"
          --out-dir generated-discovery
          --start-year 2020
          --max-pages 90
      - name: Run annual document recovery
        run: >-
          python orchestrator/g0_document_recovery_runner.py
          --out-dir generated-discovery
          --budget-seconds 150
      - name: Require PASS and validate schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          audit=json.loads(Path('generated-discovery/Discovery_Audit.json').read_text(encoding='utf-8'))
          if audit.get('gate_status') != 'PASS':
              raise SystemExit('Discovery gate=' + str(audit.get('gate_status')))
          pairs=[
            ('requests/company_discovery.schema.json','generated-discovery/company_discovery.json'),
            ('requests/document_evidence.schema.json','generated-discovery/document_evidence.json'),
            ('requests/event_evidence.schema.json','generated-discovery/event_evidence.json'),
          ]
          for sp,dp in pairs:
              data=json.loads(Path(dp).read_text(encoding='utf-8'))
              data.setdefault('gaps',[]) if dp.endswith('event_evidence.json') else None
              if dp.endswith('event_evidence.json'):
                  Path(dp).write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              schema=json.loads(Path(sp).read_text(encoding='utf-8'))
              jsonschema.Draft202012Validator(schema).validate(data)
          print(json.dumps({'gate':'PASS','company':audit.get('company'),'unresolved_count':audit.get('unresolved_count')},ensure_ascii=False))
          PY
      - name: Upload Discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: posco-full-discovery-${{ github.run_id }}
          path: generated-discovery/
          retention-days: 14
      - name: Promote only on isolated branch
        env:
          COMPANY_NAME: ${{ steps.request.outputs.company_name }}
        run: |
          tmp="$(mktemp -d)"
          cp generated-discovery/company_discovery.json "$tmp/company_discovery.json"
          cp generated-discovery/document_evidence.json "$tmp/document_evidence.json"
          cp generated-discovery/event_evidence.json "$tmp/event_evidence.json"
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          cp "$tmp/company_discovery.json" requests/company_discovery.json
          cp "$tmp/document_evidence.json" requests/document_evidence.json
          cp "$tmp/event_evidence.json" requests/event_evidence.json
          python orchestrator/document_route_registry.py update --registry requests/verified_document_routes.json --company requests/company_discovery.json --documents requests/document_evidence.json
          python - <<'PY'
          import datetime, json
          from pathlib import Path
          d=json.loads(Path('requests/company_discovery.json').read_text(encoding='utf-8'))
          Path('requests/run_token.txt').write_text('posco-support:' + d['request_id'] + ':' + datetime.datetime.now(datetime.timezone.utc).isoformat() + '\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requests/company_discovery.json requests/document_evidence.json requests/event_evidence.json requests/verified_document_routes.json requests/run_token.txt
          git commit -m "Promote isolated zero-touch Discovery for ${COMPANY_NAME}" || true
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Dispatch full Master Orchestrator
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref "${GITHUB_REF_NAME}"
