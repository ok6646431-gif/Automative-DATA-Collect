name: Validate Kumho 2025 corporate report route

on:
  workflow_dispatch:
  push:
    branches:
      - run/control-plane
    paths:
      - '.github/workflows/validate-kumho-2025-report.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Bootstrap current company scope
        run: >-
          python orchestrator/bootstrap_inputs.py
          --profile-out requests/runtime/company_profile.generated.json
          --request-out requests/current.generated.json
          --summary-out requests/runtime/Company_Discovery_Summary.json
      - name: Build isolated 2025 evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src=json.loads(Path('requests/document_evidence.json').read_text(encoding='utf-8'))
          docs=[d for d in src.get('documents',[]) if str(d.get('document_type'))=='SUSTAINABILITY_REPORT' and str(d.get('report_year'))=='2025']
          assert len(docs)==1, docs
          out=dict(src)
          out['documents']=docs
          out['gaps']=[]
          Path('requests/runtime/document_evidence_2025.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'source_url':docs[0].get('source_url'),'fallback_sources':len(docs[0].get('fallback_sources') or [])},ensure_ascii=False))
          PY
      - name: Collect isolated 2025 report
        run: >-
          python collectors/corporate_docs_collect.py
          requests/runtime/document_evidence_2025.json
          requests/runtime/company_profile.generated.json
      - name: Assert KRX primary download
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          root=Path('output/CORP_DOCS')
          status=json.loads((root/'status.json').read_text(encoding='utf-8'))
          rows=list(csv.DictReader((root/'document_index.csv').open(encoding='utf-8-sig',newline='')))
          attempts=list(csv.DictReader((root/'download_attempts.csv').open(encoding='utf-8-sig',newline='')))
          assert status.get('downloaded') == 1, status
          assert status.get('failed') == 0, status
          assert len(rows)==1, rows
          assert rows[0].get('collection_status') == 'DOWNLOADED', rows[0]
          assert 'kind.krx.co.kr' in rows[0].get('source_url',''), rows[0]
          assert attempts and attempts[0].get('attempt_status') == 'DOWNLOADED', attempts
          print(json.dumps({'status':status,'document':rows[0],'attempts':attempts},ensure_ascii=False))
          PY
      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: kumho-2025-report-route-validation
          path: output/CORP_DOCS/
          if-no-files-found: error
          retention-days: 7
