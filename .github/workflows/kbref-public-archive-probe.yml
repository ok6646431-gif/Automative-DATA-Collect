name: K-BREF public archive probe

on:
  push:
    branches:
      - 'run/control-plane'
    paths:
      - '.github/workflows/kbref-public-archive-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Probe National Archives publication records, JavaScript and detail responses
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          base='https://theme.archives.go.kr'
          url=base+'/next/publishment/organSearch.do?page=519'
          detail_url=base+'/next/publishment/detailInfo.do'
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          r=s.get(url,timeout=(8,25)); r.raise_for_status()
          Path('probe').mkdir(exist_ok=True)
          Path('probe/archive_page.html').write_text(r.text,encoding='utf-8')
          soup=BeautifulSoup(r.text,'html.parser')
          scripts=[urljoin(url,tag.get('src')) for tag in soup.find_all('script') if tag.get('src')]
          result={'source_url':url,'status_code':r.status_code,'detail_url':detail_url,'scripts':scripts,'records':{}}

          for script_url in scripts:
              if 'publishment' not in script_url: continue
              js=s.get(script_url,timeout=(8,25)); js.raise_for_status()
              Path('probe/publishment.js').write_text(js.text,encoding='utf-8')
              match=re.search(r'function\s+detailInfo\s*\([^)]*\)\s*\{',js.text)
              if match:
                  start=match.start(); depth=0; end=None
                  for i,ch in enumerate(js.text[match.end()-1:],start=match.end()-1):
                      if ch=='{': depth+=1
                      elif ch=='}':
                          depth-=1
                          if depth==0:
                              end=i+1; break
                  block=js.text[start:end] if end else js.text[start:start+5000]
                  result['detailInfo_function']=block

          targets={
              'CM00079359':('1310377','202511677368','000000000001'),
              'CM00079360':('1310377','202511677369','000000000001'),
          }
          for management_no,(code,bsid,dsid) in targets.items():
              text=soup.find(string=lambda x: x and management_no in x)
              rec={'found':bool(text),'management_no':management_no,'code':code,'bsid':bsid,'dsid':dsid}
              if text:
                  li=text.find_parent('li')
                  rec['text']=' '.join(li.stripped_strings)[:3000]
                  rec['list_html']=str(li)[:20000]
                  detail=li.find('a',onclick=re.compile(r'detailInfo'))
                  rec['detail_onclick']=detail.get('onclick') if detail else ''
                  rec['view_tag']=str(li.find(class_=re.compile(r'viewrecord')))[:500]
              dr=s.post(detail_url,data={'code':code,'bsid':bsid,'dsid':dsid,'gubun':'D'},headers={'Referer':url,'X-Requested-With':'XMLHttpRequest'},timeout=(8,25))
              dr.raise_for_status()
              detail_html=dr.text
              Path(f'probe/{management_no}_detail.html').write_text(detail_html,encoding='utf-8')
              dsoup=BeautifulSoup(detail_html,'html.parser')
              rec['detail_status']=dr.status_code
              rec['detail_text']=' '.join(dsoup.stripped_strings)[:5000]
              rec['detail_controls']=[{'tag':tag.name,'text':' '.join(tag.stripped_strings)[:200],**{k:str(v) for k,v in tag.attrs.items() if k in {'href','onclick','action','value','name','id','data-url','data-file','data-id'}}} for tag in dsoup.find_all(['a','form','input','button']) if tag.attrs][:300]
              rec['detail_urls']=sorted(set(re.findall(r'https?://[^\"\'<> ]+',detail_html)))
              result['records'][management_no]=rec

          Path('probe/probe.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Probe current IEPS reference page and attachment links
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          url='https://ieps.nier.go.kr/web/board/5/1898/'
          r=requests.get(url,timeout=(8,20),headers={'User-Agent':'Mozilla/5.0'})
          r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          controls=[]
          for tag in soup.find_all(['a','form','input','button']):
              attrs={k:str(v) for k,v in tag.attrs.items() if k in {'href','onclick','action','value','name','id','data-url','data-file','data-id','download'}}
              text=' '.join(tag.stripped_strings)[:300]
              hay=(text+' '+json.dumps(attrs,ensure_ascii=False)).lower()
              if any(x in hay for x in ('첨부','다운','download','file','pdf','hwp','zip')):
                  if 'href' in attrs: attrs['resolved_href']=urljoin(url,attrs['href'])
                  controls.append({'tag':tag.name,'text':text,**attrs})
          result={'url':url,'status':r.status_code,'bytes':len(r.content),'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'controls':controls, 'raw_paths':sorted(set(re.findall(r'[\"\']([^\"\']+\.(?:pdf|hwp|hwpx|zip)(?:\?[^\"\']*)?)[\"\']',r.text,re.I)))}
          Path('probe/ieps_page.html').write_text(r.text,encoding='utf-8')
          Path('probe/ieps.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: kbref-public-archive-probe
          path: probe/
          if-no-files-found: error
          retention-days: 7
