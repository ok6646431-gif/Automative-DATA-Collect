name: K-BREF public archive probe

on:
  push:
    branches:
      - 'run/control-plane'
    paths:
      - '.github/workflows/kbref-public-archive-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Crawl IEPS BAT board for organic K-BREF
        run: |
          python - <<'PY'
          import json,re,time
          from collections import deque
          from pathlib import Path
          from urllib.parse import urljoin,urlparse,urldefrag
          import requests
          from bs4 import BeautifulSoup

          start='https://ieps.nier.go.kr/web/board/5/'
          host='ieps.nier.go.kr'
          s=requests.Session()
          s.headers['User-Agent']='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          Path('probe').mkdir(exist_ok=True)
          q=deque([start])
          seen=set(); matches=[]; errors=[]; discovered=[]
          max_pages=180
          keywords=('유기화학산업','유기화학 산업')
          while q and len(seen)<max_pages:
              url=q.popleft()
              url=urldefrag(url)[0]
              if url in seen: continue
              seen.add(url)
              try:
                  r=s.get(url,timeout=(5,12),allow_redirects=True)
                  if r.status_code!=200:
                      errors.append({'url':url,'status':r.status_code}); continue
                  ctype=(r.headers.get('content-type') or '').lower()
                  if 'html' not in ctype and not r.text.lstrip().startswith('<'):
                      continue
                  soup=BeautifulSoup(r.text,'html.parser')
                  text=' '.join(soup.stripped_strings)
                  if any(k in text for k in keywords):
                      files=[]
                      for a in soup.find_all('a',href=True):
                          label=' '.join(a.stripped_strings)
                          href=urljoin(r.url,a['href'])
                          if 'readDownloadFile.do' in href or '.pdf' in label.lower() or '.pdf' in href.lower():
                              files.append({'label':label,'url':href})
                      matches.append({'url':r.url,'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'text':text[:5000], 'files':files})
                  for a in soup.find_all('a',href=True):
                      nxt=urldefrag(urljoin(r.url,a['href']))[0]
                      p=urlparse(nxt)
                      if p.scheme not in ('http','https') or p.netloc!=host: continue
                      # Stay on the BAT reference board only; include list/detail/query pages.
                      if '/web/board/5' not in p.path: continue
                      if nxt not in seen and nxt not in q:
                          q.append(nxt); discovered.append(nxt)
              except Exception as exc:
                  errors.append({'url':url,'error':f'{type(exc).__name__}: {exc}'})
          result={'start':start,'pages_checked':len(seen),'queue_remaining':len(q),'matches':matches,'errors':errors[:50],'sample_discovered':discovered[:100]}
          Path('probe/ieps_organic_search.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Verify any discovered organic PDF payloads
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          import requests
          data=json.loads(Path('probe/ieps_organic_search.json').read_text(encoding='utf-8'))
          urls=[]
          for match in data.get('matches',[]):
              for item in match.get('files',[]):
                  u=item.get('url','')
                  if u and u not in urls: urls.append(u)
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          out=[]
          for url in urls[:12]:
              try:
                  with s.get(url,stream=True,timeout=(8,60)) as r:
                      r.raise_for_status(); h=hashlib.sha256(); size=0; head=b''
                      for chunk in r.iter_content(1024*1024):
                          if not chunk: continue
                          if not head: head=chunk[:16]
                          size += len(chunk); h.update(chunk)
                      out.append({'url':url,'bytes':size,'sha256':h.hexdigest(),'is_pdf':head.startswith(b'%PDF-'),'head':head.decode('latin1',errors='replace')})
              except Exception as exc:
                  out.append({'url':url,'error':f'{type(exc).__name__}: {exc}'})
          Path('probe/ieps_organic_pdf_probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: kbref-public-archive-probe
          path: probe/
          if-no-files-found: error
          retention-days: 7
