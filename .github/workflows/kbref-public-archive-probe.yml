name: K-BREF public archive probe

on:
  push:
    branches:
      - 'run/control-plane'
    paths:
      - '.github/workflows/kbref-public-archive-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Probe National Archives publication records and detail JavaScript
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          base='https://theme.archives.go.kr'
          url=base+'/next/publishment/organSearch.do?page=519'
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          r=s.get(url,timeout=(8,25)); r.raise_for_status()
          Path('probe').mkdir(exist_ok=True)
          Path('probe/archive_page.html').write_text(r.text,encoding='utf-8')
          soup=BeautifulSoup(r.text,'html.parser')
          scripts=[urljoin(url,tag.get('src')) for tag in soup.find_all('script') if tag.get('src')]
          result={'source_url':url,'status_code':r.status_code,'scripts':scripts,'records':{}}

          for script_url in scripts:
              if 'publishment' not in script_url: continue
              js=s.get(script_url,timeout=(8,25)); js.raise_for_status()
              Path('probe/publishment.js').write_text(js.text,encoding='utf-8')
              match=re.search(r'function\s+detailInfo\s*\([^)]*\)\s*\{',js.text)
              if match:
                  start=match.start(); depth=0; end=None
                  for i,ch in enumerate(js.text[match.end()-1:],start=match.end()-1):
                      if ch=='{': depth+=1
                      elif ch=='}':
                          depth-=1
                          if depth==0:
                              end=i+1; break
                  block=js.text[start:end] if end else js.text[start:start+5000]
                  result['detailInfo_function']=block
                  result['detailInfo_paths']=sorted(set(re.findall(r'[\"\']([^\"\']*(?:detail|Detail|publishment)[^\"\']*)[\"\']',block)))

          for management_no in ('CM00079359','CM00079360'):
              text=soup.find(string=lambda x: x and management_no in x)
              rec={'found':bool(text),'management_no':management_no}
              if text:
                  li=text.find_parent('li')
                  rec['text']=' '.join(li.stripped_strings)[:3000]
                  rec['html']=str(li)[:20000]
                  checkbox=li.find('input',{'name':'idChk'})
                  rec['record_value']=checkbox.get('value') if checkbox else ''
                  detail=li.find('a',onclick=re.compile(r'detailInfo'))
                  rec['detail_onclick']=detail.get('onclick') if detail else ''
                  rec['view_tag']=str(li.find(class_=re.compile(r'viewrecord')))[:500]
              result['records'][management_no]=rec

          Path('probe/probe.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Probe current IEPS reference page
        continue-on-error: true
        run: |
          python - <<'PY'
          import requests
          url='https://ieps.nier.go.kr/web/board/5/1898/'
          r=requests.get(url,timeout=(8,20),headers={'User-Agent':'Mozilla/5.0'})
          print('IEPS',r.status_code,len(r.content),r.url)
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: kbref-public-archive-probe
          path: probe/
          if-no-files-found: error
          retention-days: 7
