name: Apply official attachment discovery

on:
  push:
    branches:
      - 'run/control-plane'
    paths:
      - 'tools/patch_official_attachment_discovery.py'
      - '.github/workflows/apply-official-attachment-discovery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-official-attachment-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Apply patch
        run: python tools/patch_official_attachment_discovery.py
      - name: Run targeted regressions
        run: >-
          python -m unittest
          tests.test_corporate_docs_collect
          tests.test_collection_completeness
          tests.test_learning_cards
          tests.test_scope_quality
          -v
      - name: Commit integrated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collectors/corporate_docs_collect.py tests/test_corporate_docs_collect.py requests/document_evidence.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Resolve verified official-page attachments"
          git push
