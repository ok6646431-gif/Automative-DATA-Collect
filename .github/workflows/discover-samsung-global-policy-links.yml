name: Discover Samsung global policy links

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/discover-samsung-global-policy-links.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pypdf
      - name: Probe official green procurement fallback candidates
        run: |
          python - <<'PY'
          import io, requests
          from pypdf import PdfReader

          candidates = [
            'https://www.samsung.com/sec/sustainability/policy-file/AYTGcZ56AS8AIyDc/Green_Procurement_Policy_new.pdf',
            'https://www.samsung.com/global/sustainability/policy-file/AYTGcZ56AS8AIyDc/Green_Procurement_Policy_new.pdf',
            'https://www.samsung.com/global/sustainability/policy-file/AYTGcZ56AS8AIyDc/Green%20Procurement%20Policy_KR.pdf',
            'https://images.samsung.com/kdp/aboutsamsung/overview/Green_Procurement_Policy_new.pdf',
            'https://images.samsung.com/kdp/aboutsamsung/sustainability/Green_Procurement_Policy_new.pdf',
            'https://images.samsung.com/kdp/aboutsamsung/overview/Green_Procurement_Policy_KR.pdf',
            'https://download.semiconductor.samsung.com/resources/others/Green_Procurement_Policy_new.pdf',
            'https://download.semiconductor.samsung.com/resources/others/Green_Procurement_Policy_KR.pdf',
            'https://download.semiconductor.samsung.com/resources/others/Green_Procurement_Policy.pdf',
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'})
          for url in candidates:
            try:
              r=s.get(url,timeout=(8,30),allow_redirects=True)
              print('\nURL',url); print('HTTP',r.status_code,'bytes',len(r.content),'ctype',r.headers.get('content-type'),'final',r.url)
              if r.status_code==200 and r.content.startswith(b'%PDF-'):
                try:
                  pdf=PdfReader(io.BytesIO(r.content)); text=' '.join((p.extract_text() or '') for p in pdf.pages[:3])
                  text=' '.join(text.split())
                  print('PDF_PAGES',len(pdf.pages),'TEXT',text[:1200])
                  print('GREEN_MATCH', any(k in text for k in ['녹색구매','녹색 구매','친환경상품','Green Procurement']))
                except Exception as e: print('PDF_PARSE_ERROR',type(e).__name__,e)
            except Exception as e: print('\nURL',url,'ERROR',type(e).__name__,e)
          PY
