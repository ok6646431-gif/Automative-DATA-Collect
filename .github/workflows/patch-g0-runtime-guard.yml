name: Patch G0 runtime guard

on:
  push:
    branches: [run/control-plane]
    paths:
      - 'requests/g0_runtime_guard_patch.token'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/control-plane
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply bounded runtime and checkpoint patch
        run: |
          python - <<'PY'
          from pathlib import Path

          staged = Path('orchestrator/g0_staged_official_recovery.py')
          text = staged.read_text(encoding='utf-8')
          old = 'MAX_CANDIDATE_PROBE_PAGES = 18\nMAX_CANDIDATES_PER_STAGE = 12'
          new = 'MAX_CANDIDATE_PROBE_PAGES = 10\nMAX_CANDIDATES_PER_STAGE = 6'
          if old not in text:
              raise SystemExit('staged recovery constants no longer match expected source')
          staged.write_text(text.replace(old, new, 1), encoding='utf-8')

          discovery = Path('orchestrator/zero_touch_discovery.py')
          text = discovery.read_text(encoding='utf-8')
          old = '''    out = Path(args.out_dir)\n    discovery, docs, audit = discover(company, start_year=args.start_year, max_pages=args.max_pages)\n    _write_json(out / "company_discovery.json", discovery)\n'''
          new = '''    out = Path(args.out_dir)\n    checkpoint = {\n        "schema_version": "1.0",\n        "company": company,\n        "status": "RUNNING",\n        "started_at": datetime.now(KST).isoformat(),\n        "runtime_parameters": {\n            "start_year": args.start_year,\n            "max_pages": args.max_pages,\n        },\n    }\n    _write_json(out / "Discovery_Runtime_Checkpoint.json", checkpoint)\n    try:\n        discovery, docs, audit = discover(company, start_year=args.start_year, max_pages=args.max_pages)\n    except Exception as exc:\n        checkpoint["status"] = "ERROR"\n        checkpoint["finished_at"] = datetime.now(KST).isoformat()\n        checkpoint["error"] = f"{type(exc).__name__}: {exc}"\n        _write_json(out / "Discovery_Runtime_Checkpoint.json", checkpoint)\n        raise\n    checkpoint["status"] = "COMPLETED"\n    checkpoint["finished_at"] = datetime.now(KST).isoformat()\n    checkpoint["gate_status"] = audit.get("gate_status")\n    checkpoint["http_attempt_count"] = len(audit.get("http_attempts", []))\n    _write_json(out / "Discovery_Runtime_Checkpoint.json", checkpoint)\n    _write_json(out / "company_discovery.json", discovery)\n'''
          if old not in text:
              raise SystemExit('zero-touch main block no longer matches expected source')
          discovery.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_zero_touch_runtime_checkpoint.py')
          test.write_text('''import json\nimport sys\nimport tempfile\nimport unittest\nfrom pathlib import Path\nfrom unittest.mock import patch\n\nfrom orchestrator import zero_touch_discovery as discovery\n\n\nclass RuntimeCheckpointTests(unittest.TestCase):\n    def test_checkpoint_survives_discovery_exception(self):\n        with tempfile.TemporaryDirectory() as tmp:\n            out = Path(tmp) / "generated"\n            argv = [\n                "zero_touch_discovery.py",\n                "--company-name", "Example Corp",\n                "--out-dir", str(out),\n                "--start-year", "2020",\n                "--max-pages", "60",\n            ]\n            with patch.object(sys, "argv", argv), patch.object(\n                discovery, "discover", side_effect=RuntimeError("synthetic failure")\n            ):\n                with self.assertRaises(RuntimeError):\n                    discovery.main()\n\n            checkpoint = json.loads(\n                (out / "Discovery_Runtime_Checkpoint.json").read_text(encoding="utf-8")\n            )\n            self.assertEqual(checkpoint["company"], "Example Corp")\n            self.assertEqual(checkpoint["status"], "ERROR")\n            self.assertEqual(checkpoint["runtime_parameters"]["max_pages"], 60)\n            self.assertIn("synthetic failure", checkpoint["error"])\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY

      - name: Run focused regressions
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 jsonschema
          python -m py_compile orchestrator/zero_touch_discovery.py orchestrator/g0_staged_official_recovery.py
          python -m unittest tests.test_g0_staged_official_recovery -v
          python -m unittest tests.test_zero_touch_runtime_checkpoint -v
          python -m unittest tests.test_zero_touch_discovery -v

      - name: Commit verified runtime guard
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add orchestrator/zero_touch_discovery.py orchestrator/g0_staged_official_recovery.py tests/test_zero_touch_runtime_checkpoint.py
          git diff --cached --check
          git commit -m 'Bound G0 discovery runtime and preserve checkpoints'
          git push origin HEAD:run/control-plane
