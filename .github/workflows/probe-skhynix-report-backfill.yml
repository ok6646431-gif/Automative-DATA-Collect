name: Probe SK hynix report backfill
on:
  pull_request:
    paths:
      - '.github/workflows/probe-skhynix-report-backfill.yml'
      - 'tools/probe_skhynix_report_backfill.py'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python tools/probe_skhynix_report_backfill.py
