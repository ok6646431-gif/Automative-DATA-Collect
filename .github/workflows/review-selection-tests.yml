name: Review selection unit tests

on:
  push:
    branches:
      - 'run/control-plane'
    paths:
      - 'orchestrator/requested_scope.py'
      - 'orchestrator/review_selection*.py'
      - 'orchestrator/review_selection*.json'
      - 'orchestrator/cross_layer*.py'
      - 'orchestrator/cross_layer*.json'
      - 'orchestrator/document_semantics.py'
      - 'orchestrator/review_report.py'
      - 'orchestrator/package_run.py'
      - 'orchestrator/archive*.py'
      - 'orchestrator/bat*.py'
      - 'orchestrator/bat*.json'
      - 'tests/test_requested_scope*.py'
      - 'tests/test_review_selection.py'
      - 'tests/test_zero_semantics.py'
      - 'tests/test_cross_layer_review.py'
      - 'tests/test_cross_layer_semantic_state.py'
      - 'tests/test_industry_reference_applicability.py'
      - 'tests/test_multi_site_evidence_boundary.py'
      - 'tests/test_archive_zip_dedup.py'
      - 'tests/test_document_semantics.py'
      - 'tests/test_review_report.py'
      - 'tests/test_package_validation.py'
      - 'tests/test_bat*.py'
      - '.github/workflows/review-selection-tests.yml'
  pull_request:
    paths:
      - 'orchestrator/requested_scope.py'
      - 'orchestrator/review_selection*.py'
      - 'orchestrator/review_selection*.json'
      - 'orchestrator/cross_layer*.py'
      - 'orchestrator/cross_layer*.json'
      - 'orchestrator/document_semantics.py'
      - 'orchestrator/review_report.py'
      - 'orchestrator/package_run.py'
      - 'orchestrator/archive*.py'
      - 'orchestrator/bat*.py'
      - 'orchestrator/bat*.json'
      - 'tests/test_requested_scope*.py'
      - 'tests/test_review_selection.py'
      - 'tests/test_zero_semantics.py'
      - 'tests/test_cross_layer_review.py'
      - 'tests/test_cross_layer_semantic_state.py'
      - 'tests/test_industry_reference_applicability.py'
      - 'tests/test_multi_site_evidence_boundary.py'
      - 'tests/test_archive_zip_dedup.py'
      - 'tests/test_document_semantics.py'
      - 'tests/test_review_report.py'
      - 'tests/test_package_validation.py'
      - 'tests/test_bat*.py'
      - '.github/workflows/review-selection-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check xlsxwriter
      - name: Run requested-scope, review-selection and package regression tests
        run: python -m unittest tests.test_requested_scope tests.test_requested_scope_subunits tests.test_requested_scope_rename_bridge tests.test_review_selection tests.test_zero_semantics tests.test_cross_layer_review tests.test_cross_layer_semantic_state tests.test_industry_reference_applicability tests.test_multi_site_evidence_boundary tests.test_archive_zip_dedup tests.test_document_semantics tests.test_review_report tests.test_package_validation tests.test_bat_resolver -v
