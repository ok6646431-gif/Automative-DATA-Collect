name: Review selection unit tests

on:
  push:
    branches:
      - 'run/control-plane'
    paths:
      - 'orchestrator/review_selection*.py'
      - 'orchestrator/review_selection*.json'
      - 'orchestrator/cross_layer*.py'
      - 'orchestrator/cross_layer*.json'
      - 'tests/test_review_selection.py'
      - 'tests/test_cross_layer_review.py'
      - '.github/workflows/review-selection-tests.yml'
  pull_request:
    paths:
      - 'orchestrator/review_selection*.py'
      - 'orchestrator/review_selection*.json'
      - 'orchestrator/cross_layer*.py'
      - 'orchestrator/cross_layer*.json'
      - 'tests/test_review_selection.py'
      - 'tests/test_cross_layer_review.py'
      - '.github/workflows/review-selection-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run review-selection regression tests
        run: python -m unittest tests.test_review_selection tests.test_cross_layer_review -v
