name: Probe KCC PDF text extraction

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/probe-kcc-pdf-text.yml'

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/control-plane

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install probe tools
        run: |
          python -m pip install --disable-pip-version-check pypdf pymupdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null

      - name: Download KCC Human Archive
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 35323339919
          name: enterprise-env-human-archive
          path: kcc
          github-token: ${{ github.token }}

      - name: Probe failed PDFs
        run: |
          python - <<'PY'
          import json, subprocess, tempfile, zipfile
          from pathlib import Path
          from pypdf import PdfReader
          import fitz

          zpath=Path('kcc/Human_Archive.zip')
          targets=[
              ('울산공장','2021'),
              ('안성공장','2022'),
          ]
          results=[]
          with zipfile.ZipFile(zpath) as z:
              for site,year in targets:
                  matches=[n for n in z.namelist() if n.endswith(f'/{site}/환경정보공개_{site}_{year}_전체내용정적재현본.pdf')]
                  if len(matches)!=1:
                      raise SystemExit(f'{site} {year}: matches={matches}')
                  data=z.read(matches[0])
                  tmp=Path(tempfile.gettempdir())/f'{site}_{year}.pdf'
                  tmp.write_bytes(data)

                  reader=PdfReader(str(tmp),strict=False)
                  pypdf_text='\n'.join((p.extract_text() or '') for p in reader.pages)

                  pop=subprocess.run(['pdftotext','-layout',str(tmp),'-'],stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=False)
                  pop_text=pop.stdout.decode('utf-8',errors='replace')

                  doc=fitz.open(str(tmp))
                  fitz_text='\n'.join(page.get_text('text') for page in doc)

                  result={
                      'site':site,'year':year,'pages':len(reader.pages),'bytes':len(data),
                      'pypdf_chars':len(pypdf_text.strip()),
                      'pdftotext_chars':len(pop_text.strip()),
                      'pdftotext_rc':pop.returncode,
                      'pymupdf_chars':len(fitz_text.strip()),
                      'pypdf_sample':pypdf_text[:300],
                      'pdftotext_sample':pop_text[:300],
                      'pymupdf_sample':fitz_text[:300],
                  }
                  results.append(result)
                  print('PROBE='+json.dumps(result,ensure_ascii=False))
          Path('KCC_PDF_Text_Probe.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: kcc-pdf-text-probe
          path: KCC_PDF_Text_Probe.json
          retention-days: 14

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name 'openai-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/probe-kcc-pdf-text.yml
          git commit -m 'Remove KCC PDF text probe workflow'
          git push origin HEAD:run/control-plane
