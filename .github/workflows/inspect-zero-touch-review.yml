name: Live-check generic recovery adapters

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/inspect-zero-touch-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Run KIND continuity regression tests
        run: |
          python -m py_compile orchestrator/g0_kind_disclosure_recovery.py orchestrator/zero_touch_runner.py
          python -m unittest tests.test_g0_kind_disclosure_recovery -v
