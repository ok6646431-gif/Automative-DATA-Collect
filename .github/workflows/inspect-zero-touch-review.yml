name: Inspect Hanwha Ocean official page shapes

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/inspect-zero-touch-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect first-party history and sustainability links
        run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 Chrome/151 Safari/537.36'
          for url in ['https://www.hanwhaocean.com/whoweare/history/','https://www.hanwhaocean.com/sustainability/ov/']:
              r=s.get(url,timeout=(8,25),allow_redirects=True)
              print('\n===== PAGE',url,'status',r.status_code,'final',r.url,'=====')
              soup=BeautifulSoup(r.text,'html.parser')
              text=' '.join(soup.stripped_strings)
              for term in ['대우조선','한화오션','2023','2022','2021','2020','지속가능','통합보고','보고서','브로슈어']:
                  pos=text.find(term)
                  if pos>=0:
                      print('CONTEXT',term, text[max(0,pos-500):pos+1200])
              print('--- RELEVANT LINKS ---')
              for a in soup.find_all('a',href=True):
                  label=' '.join(a.stripped_strings).strip()
                  target=urljoin(r.url,a['href'])
                  marker=(label+' '+target).casefold()
                  if any(x in marker for x in ['보고','report','sustain','esg','통합','broc','pdf','대우']):
                      print(repr(label),target)
          PY
