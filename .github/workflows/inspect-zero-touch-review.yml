name: Inspect Hanwha Ocean G0 locator audit

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/inspect-zero-touch-review.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download second-pass G0 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inspect/g0
          gh run download 33707196612 -n zero-touch-discovery-33707196612 -D inspect/g0
      - name: Print KRX and report-search attempts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path('inspect/g0/Discovery_Audit.json').read_text(encoding='utf-8'))
          attempts=audit.get('http_attempts') or []
          print('TOTAL_ATTEMPTS',len(attempts))
          for x in attempts:
              url=str(x.get('url') or x.get('final_url') or '')
              final=str(x.get('final_url') or '')
              joined=(url+' '+final).lower()
              if any(k in joined for k in ('kind.krx.co.kr','google.com/search','bing.com/search','duckduckgo.com','esg.hanwhaocean.com')):
                  print(json.dumps(x,ensure_ascii=False))
          PY
