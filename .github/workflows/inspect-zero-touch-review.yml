name: Inspect Hanwha Ocean G0 second pass

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/inspect-zero-touch-review.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download second-pass G0 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inspect/g0
          gh run download 33707196612 -n zero-touch-discovery-33707196612 -D inspect/g0
      - name: Print decisive G0 fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('inspect/g0')
          d=json.loads((root/'company_discovery.json').read_text(encoding='utf-8'))
          docs=json.loads((root/'document_evidence.json').read_text(encoding='utf-8'))
          audit=json.loads((root/'Discovery_Audit.json').read_text(encoding='utf-8'))
          print('GATE',audit.get('gate_status'))
          print('UNRESOLVED',json.dumps(d.get('unresolved_items') or [],ensure_ascii=False,indent=2))
          print('CURRENT',d.get('current_legal_name'),d.get('current_legal_name_active_period'))
          print('ENTITY_PERIOD',d.get('legal_entity_active_period'))
          print('HISTORICAL',json.dumps(d.get('historical_legal_names') or [],ensure_ascii=False,indent=2))
          print('RESTRUCTURING',json.dumps(d.get('corporate_restructuring_evidence') or [],ensure_ascii=False,indent=2))
          print('RENAME_STAGE',json.dumps((audit.get('stages') or {}).get('public_disclosure_rename') or {},ensure_ascii=False,indent=2))
          print('SCOPE',json.dumps(d.get('requested_scope') or {},ensure_ascii=False,indent=2))
          print('SITES',json.dumps(d.get('domestic_site_candidates') or [],ensure_ascii=False,indent=2))
          print('DOC_STATUS',docs.get('discovery_status'))
          for x in sorted(docs.get('documents') or [],key=lambda z:(str(z.get('document_type')),int(z.get('report_year') or 0))):
              print('DOC',json.dumps({k:x.get(k) for k in ('document_id','document_type','title','report_year','source_url','source_locator','expected_extension','verification_status')},ensure_ascii=False))
          print('GAPS',json.dumps(docs.get('gaps') or [],ensure_ascii=False,indent=2))
          print('STRICT_STAGE',json.dumps((audit.get('stages') or {}).get('strict_report_enrichment') or {},ensure_ascii=False,indent=2))
          PY
