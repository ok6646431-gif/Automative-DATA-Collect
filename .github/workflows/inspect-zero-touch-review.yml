name: Live-check generic recovery adapters

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/inspect-zero-touch-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Probe KIND docNo body resolver
        run: |
          python - <<'PY'
          import re
          from bs4 import BeautifulSoup
          from orchestrator import zero_touch_discovery as base
          from orchestrator.g0_rename_chronology_recovery import _decode_response_text, parse_official_name_chain

          http=base.Http()
          current='한화오션(주)'
          acpt='20230814001207'
          wrapper='https://kind.krx.co.kr/common/disclsviewer.do?method=search&acptno='+acpt
          x=http.get(wrapper)
          raw=_decode_response_text(x,current) if x else ''
          soup=BeautifulSoup(raw,'html.parser')
          scripts='\n'.join((s.string or s.get_text() or '') for s in soup.find_all('script'))

          for needle in ('function search', 'docLocPath', 'docpathfrm', 'JLDDST60200_i2.jsp', 'ajaxSubmit'):
              print('=== NEEDLE',needle,'===')
              start=0
              while True:
                  idx=scripts.find(needle,start)
                  if idx < 0: break
                  print(repr(scripts[max(0,idx-1800):idx+5200]))
                  start=idx+len(needle)

          docno='20230814003763'
          candidates=[
              ('GET','https://kind.krx.co.kr/common/disclsviewer.do?method=search&docNo='+docno,{}),
              ('GET','https://kind.krx.co.kr/common/disclsviewer.do?method=search&acptno='+acpt+'&docNo='+docno,{}),
              ('POST','https://kind.krx.co.kr/common/disclsviewer.do',{'method':'search','acptNo':acpt,'docNo':docno}),
              ('POST','https://kind.krx.co.kr/common/disclsviewer.do',{'method':'searchDoc','acptNo':acpt,'docNo':docno}),
              ('POST','https://kind.krx.co.kr/common/disclsviewer.do',{'method':'searchDocPath','acptNo':acpt,'docNo':docno}),
          ]
          for method,url,data in candidates:
              r=http.get(url,headers={'Referer':wrapper}) if method=='GET' else http.post(url,data=data,headers={'Referer':wrapper,'X-Requested-With':'XMLHttpRequest'})
              print('TRY',method,url,data,'STATUS',getattr(r,'status_code',None),'FINAL',r.url if r else None)
              if not r or r.status_code>=400: continue
              fixed=_decode_response_text(r,current)
              text=' '.join(BeautifulSoup(fixed,'html.parser').stripped_strings)
              print('RESULT','LEN',len(text),'CURRENT','한화오션' in text,'OLD','대우조선해양' in text,'CHANGE','상호' in text,repr(text[:1600]))
              chain=parse_official_name_chain(text,current)
              print('CHAIN',chain)
              for m in re.finditer(r'[^\n<>]{0,400}(?:docpath|docLocPath|external/[^\s\"\']+)[^\n<>]{0,700}',fixed,re.I):
                  print('PATH_HIT',repr(m.group(0)[:1300]))
          PY
