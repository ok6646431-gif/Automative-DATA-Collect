name: Inspect zero-touch final scope

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/inspect-zero-touch-review.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download final metadata and application package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inspect/meta inspect/app
          gh run download 33650544745 -n enterprise-env-metadata -D inspect/meta
          gh run download 33650544745 -n enterprise-env-application-materials -D inspect/app
      - name: Inspect requested scope and scan user package
        run: |
          python - <<'PY'
          import csv, json, zipfile
          from pathlib import Path

          print('===== SCOPE METADATA =====')
          wanted={
              'Site_Master.csv','Source_Identity.csv','Analysis_Scope.csv',
              'Requested_Scope.json','REVIEW_REQUIRED.json','Collection_Completeness.json'
          }
          for p in sorted(Path('inspect/meta').rglob('*')):
              if p.is_file() and p.name in wanted:
                  print('\n---',p.name,'---')
                  try:
                      print(p.read_text(encoding='utf-8-sig')[:30000])
                  except Exception as e:
                      print('READ_ERROR',e)

          outer_files=sorted(Path('inspect/app').glob('*'))
          print('\n===== APPLICATION ARTIFACT FILES =====')
          for p in outer_files:
              print(p, p.stat().st_size)

          needles=['보원2공장','CP000000000000004001','대불1공장','대불3공장']
          hits=[]
          inner_zip=next((p for p in outer_files if p.suffix.lower()=='.zip'),None)
          if not inner_zip:
              raise SystemExit('NO_APPLICATION_ZIP')

          with zipfile.ZipFile(inner_zip) as z:
              bad=z.testzip()
              print('ZIP_TEST',bad or 'PASS')
              names=z.namelist()
              print('ZIP_ENTRIES',len(names))
              for n in names:
                  for needle in needles:
                      if needle in n:
                          hits.append({'where':'filename','needle':needle,'entry':n})
                  low=n.lower()
                  if low.endswith(('.csv','.json','.txt','.md','.html','.xml')):
                      try:
                          data=z.read(n)
                          text=data.decode('utf-8-sig',errors='ignore')
                      except Exception:
                          continue
                      for needle in needles:
                          if needle in text:
                              hits.append({'where':'content','needle':needle,'entry':n})
              print('SCOPE_LEAK_HITS',json.dumps(hits,ensure_ascii=False,indent=2))
              print('SCOPE_LEAK_COUNT',len(hits))
              if hits:
                  raise SystemExit('SCOPE_LEAK_DETECTED')
          PY
