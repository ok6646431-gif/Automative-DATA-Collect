name: Live-check generic recovery adapters

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/inspect-zero-touch-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect KIND document selector contract
        run: |
          python - <<'PY'
          import re
          from bs4 import BeautifulSoup
          from orchestrator import zero_touch_discovery as base
          from orchestrator.g0_rename_chronology_recovery import _decode_response_text

          http=base.Http()
          current='한화오션(주)'
          referer='https://kind.krx.co.kr/disclosure/searchdisclosurebycorp.do?method=searchDisclosureByCorpMain'
          for acpt in ('20230608000085','20230814001207'):
              url='https://kind.krx.co.kr/common/disclsviewer.do?method=search&acptno='+acpt
              x=http.get(url,headers={'Referer':referer})
              print('VIEWER',acpt,getattr(x,'status_code',None),x.url if x else None)
              if not x or x.status_code >= 400:
                  continue
              raw=_decode_response_text(x,current)
              soup=BeautifulSoup(raw,'html.parser')
              for select_id in ('mainDoc','attachedDoc','oldDoc'):
                  sel=soup.find('select',id=select_id)
                  print('SELECT',acpt,select_id,dict(sel.attrs) if sel else None)
                  if sel:
                      for opt in sel.find_all('option'):
                          print('OPTION',acpt,select_id,dict(opt.attrs),repr(' '.join(opt.stripped_strings)))
              scripts='\n'.join((s.string or s.get_text() or '') for s in soup.find_all('script'))
              for fname in ('search','fnChangeDoc','fnChangeAttach','fnChangeOldDoc'):
                  pat=r'function\s+'+re.escape(fname)+r'\s*\([^)]*\)\s*\{.*?\n\}'
                  for m in re.finditer(pat,scripts,re.I|re.S):
                      print('FUNC',acpt,fname,repr(m.group(0)[:9000]))
              for m in re.finditer(r'[^\n;]{0,800}(?:disclsviewer\.do|docViewFrm|docpathfrm|docNo)[^\n;]{0,2200}',scripts,re.I):
                  print('SCRIPT_HIT',acpt,repr(m.group(0)[:3000]))
          PY
