name: Live-check generic recovery adapters

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/inspect-zero-touch-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect KIND company disclosure search contract
        run: |
          python - <<'PY'
          import re
          from bs4 import BeautifulSoup
          from orchestrator import zero_touch_discovery as base
          from orchestrator.g0_rename_chronology_recovery import _decode_response_text

          http=base.Http()
          url='https://kind.krx.co.kr/disclosureSimpleSearch.do?method=disclosureSimpleSearchMain&repIsuSrtCd=A042660'
          r=http.get(url)
          print('STATUS',getattr(r,'status_code',None),r.url if r else None)
          if r and r.status_code<400:
              decoded=_decode_response_text(r,'한화오션(주)')
              soup=BeautifulSoup(decoded,'html.parser')
              text=' '.join(soup.stripped_strings)
              print('TEXT',len(text),'HAS_CURRENT','한화오션' in text,'BUSINESS_REPORT','사업보고서' in text)
              for form in soup.find_all('form'):
                  blob=' '.join(f'{k}={v}' for k,v in form.attrs.items())
                  print('FORM',blob)
                  for inp in form.find_all(['input','select'])[:80]:
                      print('FIELD',inp.name,dict(inp.attrs))
              hits=set()
              for tag in soup.find_all(['script','a','button']):
                  blob=(tag.string or tag.get_text() or '')+' '+ ' '.join(f'{k}={v}' for k,v in tag.attrs.items())
                  if any(x in blob for x in ('searchDisclosure','SimpleSearch','ajax','disclosure','repIsuSrtCd','searchCorpName','method=')):
                      for m in re.finditer(r'[^\n;]{0,180}(?:searchDisclosure|SimpleSearch|ajax|disclosure|repIsuSrtCd|method=)[^\n;]{0,260}',blob,re.I):
                          hits.add(m.group(0).strip())
              for hit in sorted(hits)[:120]: print('HIT',repr(hit))
          PY
