name: Inspect ESG fileDownload JavaScript contract

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/inspect-zero-touch-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Probe fileDownload JavaScript and form contract
        run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151 Safari/537.36','Accept-Language':'ko-KR,ko;q=0.9,en;q=0.8'})
          root='https://esg.hanwhaocean.com/dl/rep/'
          r=s.get(root,timeout=(10,40)); r.encoding=r.apparent_encoding or r.encoding
          soup=BeautifulSoup(r.text,'html.parser')
          print('PAGE',r.status_code,r.url,len(r.content))
          scripts=[urljoin(r.url,x['src']) for x in soup.find_all('script',src=True)]
          for url in scripts:
              try:
                  js=s.get(url,timeout=(8,25))
              except Exception as e:
                  print('JSERR',url,type(e).__name__,e); continue
              text=js.text
              if re.search(r'fileDownload|downloadFrm|filePth|orginNm',text,re.I):
                  print('\n===== JS',url,'status',js.status_code,'bytes',len(js.content),'=====')
                  for m in re.finditer(r'fileDownload|downloadFrm|filePth|orginNm',text,re.I):
                      print(re.sub(r'\s+',' ',text[max(0,m.start()-800):m.start()+1800])[:2600])
                      break
          # print inline scripts too
          for sc in soup.find_all('script'):
              text=sc.string or sc.get_text() or ''
              if re.search(r'fileDownload|downloadFrm|filePth|orginNm',text,re.I):
                  print('\n===== INLINE =====')
                  for m in re.finditer(r'fileDownload|downloadFrm|filePth|orginNm',text,re.I):
                      print(re.sub(r'\s+',' ',text[max(0,m.start()-800):m.start()+1800])[:2600])
                      break
          PY
