name: Re-evaluate Hanwha Ocean metadata with current scope rules

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/inspect-zero-touch-review.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download corrected-name Hanwha Ocean metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf inspect && mkdir -p inspect
          gh run download 33718125027 -n enterprise-env-metadata -D inspect
      - name: Re-evaluate old package with current generic rules
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          from orchestrator.requested_scope import resolve_requested_scope, apply_requested_scope
          from orchestrator.collection_completeness import requested_scope_binding_rows

          roots=[p.parent for p in Path('inspect').rglob('Requested_Scope.json')]
          if not roots:
              raise SystemExit('Requested_Scope.json not found')
          root=roots[0]
          print('PACKAGE_ROOT',root)

          old=json.loads((root/'Requested_Scope.json').read_text(encoding='utf-8-sig'))
          print('OLD_TARGET_IDS',json.dumps(old.get('target_source_ids'),ensure_ascii=False))
          with (root/'Collection_Completeness.csv').open(encoding='utf-8-sig',newline='') as f:
              old_public=list(csv.DictReader(f))
          old_guard=requested_scope_binding_rows(root,old_public)
          print('OLD_FALSE_COMPLETE_GUARD',json.dumps(old_guard,ensure_ascii=False,indent=2))
          assert {r['source'] for r in old_guard} >= {'ENVINFO','PRTR','CHEM_STATS'}, old_guard

          scope=resolve_requested_scope(root)
          ids={k:sorted(v) for k,v in scope['target_source_ids'].items()}
          print('NEW_CANONICAL',sorted(scope['target_canonical_site_ids']))
          print('NEW_TARGET_IDS',json.dumps(ids,ensure_ascii=False,indent=2))
          print('NEW_EXCLUSIONS',json.dumps(scope['excluded_source_ids'],ensure_ascii=False,indent=2))
          assert '414' in ids['PRTR'], ids
          assert 'ACW978N' in ids['CHEM_STATS'], ids
          assert '00000000000000185726' in ids['ENVINFO'], ids
          assert 'CP000000000000003970' not in ids['ENVINFO'], ids
          assert 'CT000000000000002997' not in ids['ENVINFO'], ids
          assert 'ADN807N' not in ids['CHEM_STATS'], ids

          applied=apply_requested_scope(root)
          print('APPLIED_SCOPE',json.dumps({k:applied.get(k) for k in ['target_canonical_site_ids','target_source_ids','analysis_rows_before','analysis_rows_after']},ensure_ascii=False,indent=2))
          new_guard=requested_scope_binding_rows(root,old_public)
          print('NEW_GUARD',json.dumps(new_guard,ensure_ascii=False,indent=2))
          assert not new_guard, new_guard
          print('HANWHA_SCOPE_REEVALUATION_PASS')
          PY
