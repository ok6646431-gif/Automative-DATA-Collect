name: Patch fail-closed scope completeness guard

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/inspect-zero-touch-review.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch collection completeness guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('orchestrator/collection_completeness.py')
          s=p.read_text(encoding='utf-8')

          old='''    "DOCUMENT_DISCOVERY_PARTIAL", "DOCUMENT_EVIDENCE_MISSING",\n}\n'''
          new='''    "DOCUMENT_DISCOVERY_PARTIAL", "DOCUMENT_EVIDENCE_MISSING",\n    "REQUESTED_SCOPE_SOURCE_BINDING_UNRESOLVED",\n}\n'''
          if new not in s:
              if old not in s: raise SystemExit('incomplete-state marker missing')
              s=s.replace(old,new,1)

          marker='''def audit(package_root, profile_path, request_path=None, evidence_path=None):\n'''
          helper='''def requested_scope_binding_rows(package_root, public_audit_rows):\n    """Fail closed when company-wide raw data cannot be bound to a requested site.\n\n    A SITE_SET query is collected company-wide on purpose. If a core source returned\n    substantive data but Requested_Scope contains no target source ID for that source,\n    we have not proved that the requested site has no data; we have only failed to bind\n    the raw identities. Such a package must never be labelled COMPLETE.\n    """\n    package = Path(package_root)\n    scope = read_json(package / "Requested_Scope.json", {}) or {}\n    if str(scope.get("mode") or "").upper() != "SITE_SET":\n        return []\n    target = scope.get("target_source_ids") or {}\n    core = {"ENVINFO", "PRTR", "CHEM_STATS", "CLEANSYS_AIR", "SOOSIRO_WATER"}\n    data_sources = {\n        str(x.get("source") or "")\n        for x in public_audit_rows\n        if str(x.get("source") or "") in core and x.get("completeness_state") == "DATA_PRESENT"\n    }\n    out = []\n    for source in sorted(data_sources):\n        bound = [str(x) for x in (target.get(source) or []) if str(x).strip()]\n        if bound:\n            continue\n        out.append(row(\n            source, "SCOPE_BINDING", scope.get("label") or "SITE_SET",\n            "REQUESTED_SCOPE_SOURCE_BINDING_UNRESOLVED",\n            query_state="COMPLETE", data=True,\n            evidence="raw_source_data_present=Y; requested_target_source_ids=0; mode=SITE_SET",\n            note="원천 수집에는 공개자료가 있으나 요청 사업장에 연결된 source ID가 없어 자료 없음으로 판정할 수 없음",\n        ))\n    return out\n\n\n'''
          if helper.strip() not in s:
              if marker not in s: raise SystemExit('audit marker missing')
              s=s.replace(marker,helper+marker,1)

          old='''    evidence = read_json(evidence_path, {}) if evidence_path and Path(evidence_path).exists() else {}\n    rows = public_rows(output, request) + document_rows(package, profile, evidence or {})\n    incomplete = [x for x in rows if x["completeness_state"] in INCOMPLETE_STATES]\n'''
          new='''    evidence = read_json(evidence_path, {}) if evidence_path and Path(evidence_path).exists() else {}\n    public = public_rows(output, request)\n    rows = public + document_rows(package, profile, evidence or {})\n    rows += requested_scope_binding_rows(package, public)\n    incomplete = [x for x in rows if x["completeness_state"] in INCOMPLETE_STATES]\n'''
          if new not in s:
              if old not in s: raise SystemExit('audit rows marker missing')
              s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Run completeness regressions
        run: |
          python -m py_compile orchestrator/collection_completeness.py
          python -m unittest tests.test_collection_completeness tests.test_requested_scope_completeness_guard -v
      - name: Commit fail-closed completeness guard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orchestrator/collection_completeness.py tests/test_requested_scope_completeness_guard.py
          git diff --cached --check
          git commit -m 'Block complete packages with unbound requested-site data'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
