name: Inspect Hanwha Ocean zero-touch G0

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/inspect-zero-touch-review.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Hanwha Ocean G0 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inspect/g0
          gh run download 33652842761 -n zero-touch-discovery-33652842761 -D inspect/g0
      - name: Print unresolved, site, rename and document coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('inspect/g0')
          audit=json.loads((root/'Discovery_Audit.json').read_text(encoding='utf-8'))
          discovery=json.loads((root/'company_discovery.json').read_text(encoding='utf-8'))
          docs=json.loads((root/'document_evidence.json').read_text(encoding='utf-8'))
          print('===== GATE / UNRESOLVED =====')
          print('gate_status=',audit.get('gate_status'))
          print(json.dumps(audit.get('unresolved') or [],ensure_ascii=False,indent=2))
          print('===== LEGAL IDENTITY =====')
          print(json.dumps(((audit.get('stages') or {}).get('legal_identity') or {}),ensure_ascii=False,indent=2))
          print('===== OFFICIAL SITE =====')
          print(json.dumps(((audit.get('stages') or {}).get('official_site') or {}),ensure_ascii=False,indent=2))
          print('===== SITE SCOPE =====')
          print(json.dumps(((audit.get('stages') or {}).get('site_scope') or {}),ensure_ascii=False,indent=2))
          print('===== RENAME =====')
          print(json.dumps(((audit.get('stages') or {}).get('name_history') or {}),ensure_ascii=False,indent=2))
          print('company_aliases=',json.dumps(discovery.get('company_aliases') or [],ensure_ascii=False,indent=2))
          print('restructuring=',json.dumps(discovery.get('corporate_restructuring_evidence') or [],ensure_ascii=False,indent=2))
          print('legal_entity_active_period=',json.dumps(discovery.get('legal_entity_active_period'),ensure_ascii=False))
          print('===== DOCUMENTS =====')
          for d in docs.get('documents',[]):
              print(json.dumps({k:d.get(k) for k in ('document_id','document_type','title','report_year','source_url','source_locator','expected_extension','verification_status','importance')},ensure_ascii=False))
          print('===== DOCUMENT GAPS =====')
          print(json.dumps(docs.get('gaps') or [],ensure_ascii=False,indent=2))
          print('discovery_status=',docs.get('discovery_status'))
          PY
