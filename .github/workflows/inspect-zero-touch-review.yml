name: Live-check generic recovery adapters

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/inspect-zero-touch-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify historical alias scheduling contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from orchestrator.g0_public_disclosure_enrichment import apply_rename
          from orchestrator.company_profile_builder import compile_discovery
          from orchestrator.request_builder import build

          d=json.loads(Path('requests/company_discovery.json').read_text(encoding='utf-8'))
          d['historical_legal_names']=[]
          d['corporate_restructuring_evidence']=[]
          d['unresolved_items']=[]
          apply_rename(d,{'stages':{}},{
            'date':'2023-05-23',
            'predecessor':'대우조선해양(주)',
            'successor':'한화오션(주)',
            'source_locator':'https://kind.krx.co.kr/external/2023/08/14/001207/20230814003763/11012.htm'
          })
          profile,summary=compile_discovery(d)
          req=build(profile)
          terms=req['sources']['ENVINFO']['search_terms_by_year']
          print(json.dumps({'current_period':d['current_legal_name_active_period'],'historical':d['historical_legal_names'],'terms':terms},ensure_ascii=False,indent=2))
          for year in ('2020','2021','2022'):
              vals=terms.get(year) or terms.get(int(year)) or []
              assert any('대우조선해양' in x for x in vals), (year,vals)
              assert not any('한화오션' in x for x in vals), (year,vals)
          vals=terms.get('2023') or terms.get(2023) or []
          assert any('대우조선해양' in x for x in vals), vals
          assert any('한화오션' in x for x in vals), vals
          print('ALIAS_SCHEDULING_PASS')
          PY
