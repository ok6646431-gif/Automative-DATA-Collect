name: Live-check generic recovery adapters

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/inspect-zero-touch-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Resolve KIND viewer endpoint for periodic report
        run: |
          python - <<'PY'
          import re
          from bs4 import BeautifulSoup
          from urllib.parse import urlencode
          from orchestrator import zero_touch_discovery as base
          from orchestrator.g0_rename_chronology_recovery import _decode_response_text, parse_official_name_chain

          http=base.Http()
          main='https://kind.krx.co.kr/disclosure/searchdisclosurebycorp.do?method=searchDisclosureByCorpMain'
          r=http.get(main)
          decoded=_decode_response_text(r,'한화오션(주)') if r else ''
          soup=BeautifulSoup(decoded,'html.parser')
          scripts='\n'.join((s.string or s.get_text() or '') for s in soup.find_all('script'))
          for m in re.finditer(r'function\s+openDisclsViewer\s*\([^)]*\)\s*\{.{0,8000}?\}',scripts,re.I|re.S):
              print('VIEWER_FUNC',repr(m.group(0)[:9000]))
          for m in re.finditer(r'[^\n;]{0,500}openDisclsViewer[^\n;]{0,1200}',scripts,re.I):
              print('VIEWER_HIT',repr(m.group(0)))

          acpt='20230814001207'
          candidates=[
              'https://kind.krx.co.kr/common/disclsviewer.do?method=search&acptno='+acpt,
              'https://kind.krx.co.kr/common/disclsviewer.do?method=search&acptNo='+acpt,
              'https://kind.krx.co.kr/common/disclsviewer.do?method=search&acptno='+acpt+'&docno=&viewerhost=&viewerport=',
              'https://kind.krx.co.kr/common/disclsviewer.do?acptno='+acpt,
              'https://kind.krx.co.kr/external/'+acpt,
          ]
          for url in candidates:
              x=http.get(url,headers={'Referer':main})
              if not x:
                  print('TRY',url,'NO_RESPONSE'); continue
              fixed=_decode_response_text(x,'한화오션(주)')
              text=' '.join(BeautifulSoup(fixed,'html.parser').stripped_strings)
              print('TRY',url,'STATUS',x.status_code,'FINAL',x.url,'LEN',len(text),'CURRENT','한화오션' in text,'OLD','대우조선해양' in text,'CHANGE','상호 변경' in text)
              print('HEAD',repr(text[:1800]))
              chain=parse_official_name_chain(text,'한화오션(주)')
              print('CHAIN',chain)
              if chain:
                  break
          PY
