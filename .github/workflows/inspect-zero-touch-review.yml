name: Live-check generic recovery adapters

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/inspect-zero-touch-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Trace KIND viewer search implementation
        run: |
          python - <<'PY'
          import re
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          from orchestrator import zero_touch_discovery as base
          from orchestrator.g0_rename_chronology_recovery import _decode_response_text

          http=base.Http()
          wrapper='https://kind.krx.co.kr/common/disclsviewer.do?method=search&acptno=20230814001207'
          x=http.get(wrapper)
          raw=_decode_response_text(x,'한화오션(주)') if x else ''
          soup=BeautifulSoup(raw,'html.parser')
          for s in soup.find_all('script'):
              src=str(s.get('src') or '').strip()
              if not src: continue
              target=urljoin(wrapper,src)
              print('SCRIPT_SRC',target)
              r=http.get(target,headers={'Referer':wrapper})
              if not r or r.status_code>=400: continue
              txt=_decode_response_text(r)
              if any(n in txt for n in ('function search','search = function','setPath(','docLocPath')):
                  print('MATCH_SCRIPT',target,'LEN',len(txt))
                  for needle in ('function search','search = function','setPath(','docLocPath','docNo'):
                      pos=0
                      while True:
                          i=txt.find(needle,pos)
                          if i<0: break
                          print('CONTEXT',needle,repr(txt[max(0,i-1600):i+5200]))
                          pos=i+len(needle)
          PY
