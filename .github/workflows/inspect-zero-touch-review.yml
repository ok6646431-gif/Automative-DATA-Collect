name: Live-check generic recovery adapters

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/inspect-zero-touch-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect official rename evidence paths
        run: |
          python - <<'PY'
          import re
          from bs4 import BeautifulSoup
          from orchestrator import zero_touch_discovery as base
          from orchestrator.g0_rename_chronology_recovery import _decode_response_text, parse_official_name_chain

          http=base.Http()
          current='한화오션(주)'

          history='https://www.hanwhaocean.com/whoweare/history/'
          r=http.get(history)
          print('HISTORY_STATUS',getattr(r,'status_code',None),r.url if r else None)
          if r and r.status_code < 400:
              raw=_decode_response_text(r,current)
              text=' '.join(BeautifulSoup(raw,'html.parser').stripped_strings)
              print('HISTORY_LEN',len(text),'OLD','대우조선해양' in text,'CURRENT','한화오션' in text)
              for token in ('대우조선해양','한화오션','2000','2023'):
                  for m in list(re.finditer(re.escape(token),text))[:8]:
                      print('HISTORY_CONTEXT',token,repr(text[max(0,m.start()-350):m.end()+550]))
              print('HISTORY_CHAIN',parse_official_name_chain(text,current))

          main='https://kind.krx.co.kr/disclosure/searchdisclosurebycorp.do?method=searchDisclosureByCorpMain'
          for acpt in ('20230608000085','20230814001207'):
              url='https://kind.krx.co.kr/common/disclsviewer.do?method=search&acptno='+acpt
              x=http.get(url,headers={'Referer':main})
              print('VIEWER',acpt,getattr(x,'status_code',None),x.url if x else None)
              if not x or x.status_code >= 400:
                  continue
              raw=_decode_response_text(x,current)
              soup=BeautifulSoup(raw,'html.parser')
              text=' '.join(soup.stripped_strings)
              print('VIEWER_TEXT',acpt,repr(text[:1200]))
              for tag in soup.find_all(['iframe','frame','object','embed','form','input','select','option','a']):
                  blob=' '.join(tag.stripped_strings)+' '+ ' '.join(f'{k}={v}' for k,v in tag.attrs.items())
                  if any(k in blob.casefold() for k in ('docno','viewer','acpt','iframe','frame','본문','본 문','document')):
                      print('VIEWER_TAG',acpt,tag.name,repr(blob[:2500]))
              scripts='\n'.join((s.string or s.get_text() or '') for s in soup.find_all('script'))
              for m in re.finditer(r'[^\n;]{0,500}(?:docno|viewerhost|viewerport|acptno|iframe|frame)[^\n;]{0,1500}',scripts,re.I):
                  print('VIEWER_SCRIPT',acpt,repr(m.group(0)[:2200]))
          PY
