name: Live-check generic recovery adapters

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/inspect-zero-touch-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect KIND company-search submit contract
        run: |
          python - <<'PY'
          import re
          from bs4 import BeautifulSoup
          from orchestrator import zero_touch_discovery as base
          from orchestrator.g0_rename_chronology_recovery import _decode_response_text

          http=base.Http()
          main='https://kind.krx.co.kr/disclosure/searchdisclosurebycorp.do?method=searchDisclosureByCorpMain'
          r=http.get(main)
          print('MAIN',getattr(r,'status_code',None),r.url if r else None)
          if not r or r.status_code>=400: raise SystemExit(0)
          decoded=_decode_response_text(r,'한화오션(주)')
          soup=BeautifulSoup(decoded,'html.parser')
          scripts='\n'.join((s.string or s.get_text() or '') for s in soup.find_all('script'))
          for name in ('fnSearch','searchDisclosure','searchDisclosureByCorp','fnSearchCorp','fnSearchDiscls','searchForm'):
              for m in re.finditer(r'function\s+'+re.escape(name)+r'\s*\([^)]*\)\s*\{.{0,6000}?\}',scripts,re.I|re.S):
                  print('FUNC',name,repr(m.group(0)[:7000]))
          for m in re.finditer(r'[^\n;]{0,300}(?:searchDisclosureByCorp|searchForm|ajaxSubmit|method\s*=|searchResult|searchDiscls)[^\n;]{0,800}',scripts,re.I):
              print('SCRIPT_HIT',repr(m.group(0)))

          form=soup.find('form',id='searchForm') or soup.find('form',attrs={'name':'searchForm'})
          print('FORM',dict(form.attrs) if form else None)
          payload={}
          if form:
              for tag in form.find_all(['input','select']):
                  name=tag.get('name')
                  if not name: continue
                  if tag.name=='select':
                      opt=tag.find('option',selected=True) or tag.find('option')
                      payload[name]=opt.get('value','') if opt else ''
                  else:
                      typ=str(tag.get('type') or '').lower()
                      if typ in {'checkbox','radio'} and not tag.has_attr('checked'): continue
                      payload[name]=tag.get('value','')
          payload.update({
              'repIsuSrtCd':'A042660',
              'searchCorpName':'한화오션',
              'fromDate':'20230101',
              'toDate':'20231231',
              'currentPageSize':'100',
              'pageIndex':'1',
              'lastReport':'T',
          })
          print('BASE_PAYLOAD',payload)

          candidates=[
              'https://kind.krx.co.kr/disclosure/searchdisclosurebycorp.do?method=searchDisclosureByCorpList',
              'https://kind.krx.co.kr/disclosure/searchdisclosurebycorp.do?method=searchDisclosureByCorpResult',
              'https://kind.krx.co.kr/disclosure/searchdisclosurebycorp.do?method=searchDisclosureByCorp',
              'https://kind.krx.co.kr/disclosure/searchdisclosurebycorp.do?method=searchDisclosureByCorpMain',
          ]
          for url in candidates:
              p=dict(payload)
              x=http.post(url,data=p,headers={'Referer':main,'X-Requested-With':'XMLHttpRequest'})
              if not x:
                  print('TRY',url,'NO_RESPONSE'); continue
              text=' '.join(BeautifulSoup(_decode_response_text(x,'한화오션(주)'),'html.parser').stripped_strings)
              print('TRY',url,x.status_code,x.url,'LEN',len(text),'CURRENT','한화오션' in text,'BIZ','사업보고서' in text,'Q','분기보고서' in text)
              if len(text)>0: print('TRY_HEAD',repr(text[:4000]))
              raw=_decode_response_text(x,'한화오션(주)')
              nums=sorted(set(re.findall(r'20\d{12}',raw)))
              print('NUMS',nums[:40])
              for m in re.finditer(r'openDisclsViewer\s*\(([^)]{0,500})\)',raw):
                  print('VIEWER',repr(m.group(0)))
          PY
