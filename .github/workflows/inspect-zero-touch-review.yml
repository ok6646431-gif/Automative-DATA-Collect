name: Live-check generic recovery adapters

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/inspect-zero-touch-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Verify generic official rename locator and report navigation
        run: |
          python - <<'PY'
          import json
          from bs4 import BeautifulSoup
          from orchestrator import zero_touch_discovery as base
          from orchestrator.g0_rename_chronology_recovery import (
              _decode_response_text, _search_official_disclosures, parse_official_name_chain,
          )
          from orchestrator.g0_scripted_report_navigation import extract_report_navigation_targets
          from orchestrator.g0_scripted_report_enrichment import candidates_from_scripted_page

          http=base.Http()
          current='한화오션(주)'
          located=_search_official_disclosures(http,'한화오션')
          print('LOCATED_COUNT',len(located))
          for url in located: print('LOCATED',url)
          parsed=[]
          for url in located[:20]:
              r=http.get(url)
              if not r or r.status_code>=400: continue
              text=' '.join(BeautifulSoup(_decode_response_text(r,current),'html.parser').stripped_strings)
              chain=parse_official_name_chain(text,current)
              if chain:
                  parsed.append((r.url,chain))
          print('LOCATED_PARSED',json.dumps(parsed,ensure_ascii=False))

          root='https://esg.hanwhaocean.com/'
          r=http.get(root)
          if r and r.status_code<400:
              r.encoding=r.apparent_encoding or r.encoding
              targets=extract_report_navigation_targets(r.url,r.text)
              print('REPORT_NAV_TARGETS',json.dumps(targets,ensure_ascii=False))
              years=[]
              for target in targets[:20]:
                  x=http.get(target)
                  if not x or x.status_code>=400: continue
                  x.encoding=x.apparent_encoding or x.encoding
                  found=candidates_from_scripted_page(http,x.url,x.text,2020,2026)
                  years.extend(int(c['year']) for c in found)
              print('REPORT_NAV_YEARS',sorted(set(years)))
          PY
