name: Live-check generic recovery adapters

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/inspect-zero-touch-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Verify current chronology decoder on live KRX and DART
        run: |
          python - <<'PY'
          import json
          from bs4 import BeautifulSoup
          from orchestrator import zero_touch_discovery as base
          from orchestrator.g0_rename_chronology_recovery import (
              _decode_response_text, _follow_dart_report_links, parse_official_name_chain,
          )

          http=base.Http()
          current='한화오션(주)'
          krx='https://kind.krx.co.kr/external/2023/08/23/000283/20230823000965/10001.htm'
          kr=http.get(krx)
          print('KRX_ENCODING',getattr(kr,'encoding',None),getattr(kr,'apparent_encoding',None),kr.headers.get('content-type') if kr else None)
          if kr and kr.status_code < 400:
              decoded=_decode_response_text(kr,current)
              text=' '.join(BeautifulSoup(decoded,'html.parser').stripped_strings)
              print('KRX_DECODED', '한화오션' in text, '대우조선해양' in text, len(text))
              print('KRX_CHAIN',json.dumps(parse_official_name_chain(text,current),ensure_ascii=False))

          for code in ('A001','A002','A003'):
              url=f'https://dart.fss.or.kr/navi/searchNavi.do?naviCode={code}&naviCrpCik=00111704&naviCrpNm=%ED%95%9C%ED%99%94%EC%98%A4%EC%85%98'
              r=http.get(url)
              print('DART_NAVI',code,getattr(r,'status_code',None),r.url if r else None)
              if not r or r.status_code>=400:
                  continue
              decoded=_decode_response_text(r,current)
              text=' '.join(BeautifulSoup(decoded,'html.parser').stripped_strings)
              links=_follow_dart_report_links(r.url,decoded)
              print('DART_TEXT',code,len(text),'HAS_CURRENT','한화오션' in text,'LINK_COUNT',len(links))
              for link in links[:15]: print('DART_REPORT_LINK',code,link)
          PY
