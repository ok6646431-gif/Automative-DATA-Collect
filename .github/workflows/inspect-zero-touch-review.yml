name: Inspect official ESG report download structure

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/inspect-zero-touch-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Probe official report page download contract
        run: |
          python - <<'PY'
          import re, requests, json
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151 Safari/537.36','Accept-Language':'ko-KR,ko;q=0.9,en;q=0.8'})
          urls=[
            'https://esg.hanwhaocean.com/dl/rep/',
            'https://www.hanwhaocean.com/sustainability/ov/',
          ]
          for url in urls:
              print('\n===== PAGE',url,'=====')
              try:
                  r=s.get(url,timeout=(10,40),allow_redirects=True)
              except Exception as e:
                  print('ERROR',type(e).__name__,e); continue
              print('status',r.status_code,'final',r.url,'ctype',r.headers.get('content-type'),'bytes',len(r.content))
              r.encoding=r.apparent_encoding or r.encoding
              soup=BeautifulSoup(r.text,'html.parser')
              text=' '.join(soup.stripped_strings)
              print('TEXT',text[:2500])
              for tag in soup.find_all(['a','button','form','iframe','embed','object','input']):
                  attrs={k:str(v) for k,v in tag.attrs.items() if k in {'href','src','data','action','onclick','value','name','id','class'}}
                  label=' '.join(tag.stripped_strings).strip()
                  payload=(label+' '+json.dumps(attrs,ensure_ascii=False)).lower()
                  if any(k in payload for k in ('pdf','download','file','보고서','report','첨부','rep')):
                      print('NODE',tag.name,repr(label),json.dumps(attrs,ensure_ascii=False))
              for pat in [r'[^\"\'<>\s]{0,250}\.pdf[^\"\'<>\s]{0,250}',r'.{0,250}(?:download|file|attach|pdf|보고서).{0,800}']:
                  for m in re.findall(pat,r.text,re.I|re.S)[:40]:
                      print('RAW',re.sub(r'\s+',' ',m)[:1400])
          PY
