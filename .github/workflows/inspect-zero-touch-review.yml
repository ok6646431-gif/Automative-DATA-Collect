name: Inspect Hanwha Ocean requested-scope binding

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/inspect-zero-touch-review.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download corrected Hanwha Ocean metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf inspect && mkdir -p inspect
          gh run download 33718125027 -n enterprise-env-metadata -D inspect
      - name: Print site identity and requested-scope evidence
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path('inspect')

          def files(name):
              return sorted(root.rglob(name))
          def print_json(name):
              for p in files(name):
                  print(f'\n===== {p} =====')
                  try: print(json.dumps(json.loads(p.read_text(encoding='utf-8-sig')),ensure_ascii=False,indent=2))
                  except Exception as e: print('ERR',e)
          def print_csv(name, limit=200):
              for p in files(name):
                  print(f'\n===== {p} =====')
                  with p.open(encoding='utf-8-sig',newline='') as f:
                      rows=list(csv.DictReader(f))
                  print('ROWS',len(rows),'FIELDS',list(rows[0]) if rows else [])
                  for r in rows[:limit]: print(json.dumps(r,ensure_ascii=False))

          for n in ['Requested_Scope.json','Archive_Manifest.json','Collection_Completeness.json','Package_Validation.json']:
              print_json(n)
          for n in ['Site_Master.csv','Source_Identity.csv','Analysis_Ready_Index.csv','Validation_Queue.csv']:
              print_csv(n)
          for source in ['ENVINFO','PRTR','CHEM_STATS']:
              for p in sorted((root/'output'/source).glob('*.csv')) if (root/'output'/source).exists() else []:
                  if p.name in {'discovery.csv','candidates.csv','fact_candidates.csv'}:
                      print_csv(p.name, 100)
          print('\n===== MATCHING GEOJE / HANWHA / DSME TEXT =====')
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.csv','.json','.jsonl','.txt'}: continue
              try: text=p.read_text(encoding='utf-8-sig',errors='replace')
              except Exception: continue
              lines=[x for x in text.splitlines() if any(k in x for k in ['거제','Geoje','대우조선','한화오션'])]
              if lines:
                  print('\n--',p,'--')
                  for line in lines[:120]: print(line[:4000])
          PY
