name: Inspect zero-touch final scope

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/inspect-zero-touch-review.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download final application package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inspect/app
          gh run download 33650544745 -n enterprise-env-application-materials -D inspect/app
      - name: Distinguish audit references from actual scope leakage
        run: |
          python - <<'PY'
          import csv, io, json, zipfile
          from pathlib import Path

          outer=sorted(Path('inspect/app').glob('*'))
          inner=next((p for p in outer if p.suffix.lower()=='.zip'),None)
          if not inner:
              raise SystemExit('NO_APPLICATION_ZIP')

          needles=['보원2공장','CP000000000000004001','대불1공장','대불3공장']
          audit_marker='/00_자료목록/원본검증목록/'
          audit_hits=[]
          real_hits=[]

          with zipfile.ZipFile(inner) as z:
              print('ZIP_TEST',z.testzip() or 'PASS')
              print('ZIP_ENTRIES',len(z.namelist()))
              for n in z.namelist():
                  is_audit=audit_marker in ('/'+n)
                  for needle in needles:
                      if needle in n:
                          (audit_hits if is_audit else real_hits).append({
                              'where':'filename','needle':needle,'entry':n
                          })
                  if not n.lower().endswith(('.csv','.json','.txt','.md','.html','.xml')):
                      continue
                  try:
                      text=z.read(n).decode('utf-8-sig',errors='ignore')
                  except Exception:
                      continue
                  for needle in needles:
                      if needle not in text:
                          continue
                      target=audit_hits if is_audit else real_hits
                      lines=text.splitlines()
                      matching=[line[:1800] for line in lines if needle in line][:8]
                      target.append({
                          'where':'content','needle':needle,'entry':n,
                          'matching_lines':matching
                      })

              print('===== AUDIT_ONLY_REFERENCES =====')
              print(json.dumps(audit_hits,ensure_ascii=False,indent=2))
              print('AUDIT_ONLY_COUNT',len(audit_hits))
              print('===== ACTUAL_USER_AREA_HITS =====')
              print(json.dumps(real_hits,ensure_ascii=False,indent=2))
              print('ACTUAL_USER_AREA_HIT_COUNT',len(real_hits))

              # Additional structural proof: application source folders must contain
              # exactly the scoped ENVINFO record count and no off-scope folder name.
              env_entries=[n for n in z.namelist() if '/01_ENVINFO/' in ('/'+n)]
              print('ENVINFO_ENTRY_COUNT',len(env_entries))
              offscope_names=[n for n in env_entries if any(x in n for x in needles)]
              print('ENVINFO_OFFSCOPE_FILENAMES',json.dumps(offscope_names,ensure_ascii=False,indent=2))

              if real_hits or offscope_names:
                  raise SystemExit('ACTUAL_SCOPE_LEAK_DETECTED')
          PY
