name: Validate site-level BAT resolution on Kumho

on:
  push:
    branches:
      - run/control-plane
    paths:
      - 'orchestrator/bat_master_catalog.json'
      - 'orchestrator/bat_resolver.py'
      - 'orchestrator/bat_collector.py'
      - 'orchestrator/bat_stage.py'
      - 'orchestrator/bat_archive.py'
      - 'orchestrator/package_run.py'
      - 'orchestrator/archive_stage.py'
      - 'tests/test_bat_resolver.py'
      - 'tests/test_bat_revision_collection.py'
      - '.github/workflows/validate-bat-resolution.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 xlsxwriter
      - name: Run BAT regressions
        run: python -m unittest tests.test_bat_resolver tests.test_bat_revision_collection -v
      - name: Bootstrap current Kumho Discovery
        run: >-
          python orchestrator/bootstrap_inputs.py
          --profile-out requests/runtime/company_profile.generated.json
          --request-out requests/current.generated.json
          --summary-out requests/runtime/Company_Discovery_Summary.json
      - name: Download retained stable artifacts
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33735414258
          github-token: ${{ github.token }}
          pattern: stable-*
          path: collected/stable
          merge-multiple: true
      - name: Download retained ICIS artifact
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33735414258
          github-token: ${{ github.token }}
          pattern: icis-attempt-*
          path: collected/icis
          merge-multiple: false
      - name: Assemble with BAT stage
        run: >-
          python orchestrator/package_run.py
          --stable collected/stable
          --icis collected/icis
          --profile requests/runtime/company_profile.generated.json
          --out assembled
      - name: Verify BAT resolution and fail-closed collection
        run: |
          python - <<'PY'
          import csv,json
          with open('assembled/BAT_Applicability_Candidates.csv',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          rubber=[r for r in rows if r['catalog_id']=='KBREF_RUBBER_PRODUCTS_PENDING_2029']
          boiler=[r for r in rows if r['catalog_id']=='KBREF_COMMON_BOILER_2021']
          electric=[r for r in rows if r.get('catalog_family')=='KBREF_FAMILY_ELECTRIC_STEAM']
          expected_rubber={'금호타이어 광주공장','금호타이어 곡성공장','금호타이어 평택공장'}
          expected_boiler={'금호타이어 광주공장','금호타이어 곡성공장'}
          actual_rubber={r['site_name'] for r in rubber}
          actual_boiler={r['site_name'] for r in boiler}
          if actual_rubber != expected_rubber:
              raise SystemExit(f'Rubber candidates changed unexpectedly: expected={sorted(expected_rubber)} actual={sorted(actual_rubber)}')
          if any(r['candidate_role']!='PRIMARY' or r['candidate_state']!='FUTURE_PRIMARY_CANDIDATE' or r['applicability_state']!='STRONG_CANDIDATE' for r in rubber):
              raise SystemExit(f'Rubber industry candidates must remain strong future PRIMARY candidates: {rubber}')
          if any(r['collection_action']!='WAIT_FOR_PUBLICATION' for r in rubber):
              raise SystemExit('Unpublished rubber BAT must remain WAIT_FOR_PUBLICATION')
          if actual_boiler != expected_boiler:
              raise SystemExit(f'Boiler candidates changed unexpectedly: expected={sorted(expected_boiler)} actual={sorted(actual_boiler)}')
          if any(r['candidate_role']!='COMMON_UTILITY' or r['applicability_state']!='SUPPORTING_CANDIDATE' or r['collection_action']!='REVIEW_BEFORE_COLLECTION' for r in boiler):
              raise SystemExit(f'Single-channel boiler evidence must remain supporting review-before-collection: {boiler}')
          if any(r.get('evidence_channels')!='Management_Action_Ledger' for r in boiler):
              raise SystemExit(f'Boiler confidence must count only the actual matching evidence channel: {boiler}')
          if electric:
              raise SystemExit(f'Generic tire-factory process evidence must not resolve the electric/steam industry BAT: {electric}')
          allowed_families={'KBREF_FAMILY_RUBBER_PRODUCTS','KBREF_FAMILY_COMMON_BOILER'}
          unexpected=[r for r in rows if r.get('catalog_family') not in allowed_families]
          if unexpected:
              raise SystemExit(f'Unrelated BAT families resolved on Kumho: {unexpected}')
          if len(rows)!=5:
              raise SystemExit(f'Expected exactly five evidence-backed Kumho BAT candidates, got {len(rows)}: {rows}')
          status=json.load(open('assembled/output/BAT_REFERENCES/status.json',encoding='utf-8'))
          summary=json.load(open('assembled/BAT_Summary.json',encoding='utf-8'))
          if int(status.get('current_failed') or 0)!=0:
              raise SystemExit(f'BAT collector recorded a current-reference failure: {status}')
          if int(status.get('current_downloaded') or 0)!=0 or int(status.get('downloaded') or 0)!=0:
              raise SystemExit(f'Weak/pending Kumho candidates must not be auto-downloaded: {status}')
          if status.get('status')!='NO_PUBLISHED_MATCH':
              raise SystemExit(f'No published candidate cleared the collection gate; status must reflect that: {status}')
          with open('assembled/output/BAT_REFERENCES/document_index.csv',encoding='utf-8-sig',newline='') as f:
              docs=list(csv.DictReader(f))
          if any(r.get('revision_status')=='SUPERSEDED_ARCHIVE_ONLY' and r.get('preferred_for_matching')!='false' for r in docs):
              raise SystemExit('Superseded archive documents must never be preferred for matching')
          print(json.dumps({
              'BAT_VALIDATION':'PASS',
              'candidate_count':len(rows),
              'rubber_sites':sorted(actual_rubber),
              'boiler_sites':sorted(actual_boiler),
              'electric_steam_candidate_count':len(electric),
              'unexpected_family_count':len(unexpected),
              'candidates':[{k:r[k] for k in ['site_name','catalog_id','catalog_family','revision_generation','candidate_role','candidate_state','applicability_state','collection_action','evidence_channels','evidence_basis']} for r in rows],
              'collection_status':status,
              'document_revisions':[{k:r.get(k,'') for k in ['catalog_id','catalog_family','revision_generation','publication_year','revision_status','preferred_for_matching','collection_status','stored_path']} for r in docs],
              'bat_summary':summary,
          },ensure_ascii=False,indent=2))
          PY
      - name: Byte-verify official common boiler BAT source
        run: |
          python - <<'PY'
          import hashlib,json,requests
          from pathlib import Path
          catalog=json.loads(Path('orchestrator/bat_master_catalog.json').read_text(encoding='utf-8'))
          entry=next(e for e in catalog['entries'] if e['catalog_id']=='KBREF_COMMON_BOILER_2021')
          url=entry.get('official_pdf_url') or ''
          expected=entry.get('official_pdf_sha256') or ''
          if not url or not expected:
              raise SystemExit('Common boiler catalog entry lacks verified official PDF URL/SHA')
          r=requests.get(url,timeout=120)
          r.raise_for_status()
          body=r.content
          actual=hashlib.sha256(body).hexdigest()
          if not body.startswith(b'%PDF'):
              raise SystemExit(f'Official boiler endpoint did not return PDF bytes: {body[:16]!r}')
          if actual!=expected:
              raise SystemExit(f'Official boiler PDF SHA changed: expected={expected} actual={actual} bytes={len(body)}')
          print(json.dumps({'OFFICIAL_BOILER_PDF':'PASS','bytes':len(body),'sha256':actual,'url':url},ensure_ascii=False))
          PY
      - name: Upload BAT validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kumho-bat-validation
          path: |
            assembled/BAT_Applicability_Candidates.csv
            assembled/BAT_Collection_Plan.json
            assembled/BAT_Industry_Reference_Applicability.json
            assembled/BAT_Summary.json
            assembled/output/BAT_REFERENCES
          retention-days: 14
          if-no-files-found: warn
