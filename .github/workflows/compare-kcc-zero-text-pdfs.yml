name: Compare KCC zero-text ENV-INFO PDFs

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/compare-kcc-zero-text-pdfs.yml'

permissions:
  contents: write
  actions: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/control-plane
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check pypdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null

      - name: Download KCC final package
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 35323339919
          name: enterprise-env-final
          path: final
          github-token: ${{ github.token }}

      - name: Extract target PDFs and compare text engines
        run: |
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          z=Path('final/Human_Archive.zip')
          out=Path('diag'); out.mkdir()
          targets=[
            ('울산공장','2021','fail_ulsan_2021.pdf'),
            ('안성공장','2022','fail_anseong_2022.pdf'),
            ('울산공장','2022','good_ulsan_2022.pdf'),
            ('안성공장','2021','good_anseong_2021.pdf'),
          ]
          found={}
          with zipfile.ZipFile(z) as f:
            names=f.namelist()
            for site,year,dst in targets:
              matches=[n for n in names if f'/03_환경정보공개시스템/{site}/' in n and f'_{year}_전체내용정적재현본.pdf' in n]
              if matches:
                Path(out/dst).write_bytes(f.read(matches[0]))
                found[dst]=matches[0]
          Path('diag/found.json').write_text(json.dumps(found,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(found,ensure_ascii=False,indent=2))
          PY
          for f in diag/*.pdf; do
            echo "===== $f ====="
            pdfinfo "$f" | sed -n '1,30p' || true
            echo "--- fonts ---"
            pdffonts "$f" || true
            echo "--- pdftotext chars ---"
            pdftotext -layout "$f" - | wc -c || true
          done
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader
          rows={}
          for p in Path('diag').glob('*.pdf'):
              r=PdfReader(str(p))
              page_text=[]
              errors=[]
              for i,page in enumerate(r.pages):
                  try:
                      t=page.extract_text() or ''
                  except Exception as e:
                      t=''; errors.append(f'{i+1}:{type(e).__name__}:{e}')
                  page_text.append(t)
              rows[p.name]={
                  'bytes':p.stat().st_size,
                  'pages':len(r.pages),
                  'pypdf_chars':sum(map(len,page_text)),
                  'page_chars':[len(x) for x in page_text],
                  'errors':errors,
                  'metadata':{str(k):str(v) for k,v in (r.metadata or {}).items()},
              }
          Path('diag/pypdf_compare.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: kcc-zero-text-pdf-diagnostic
          path: diag/
          retention-days: 14
          compression-level: 0

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name 'openai-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/compare-kcc-zero-text-pdfs.yml
          git commit -m 'Remove KCC zero-text PDF diagnostic workflow'
          git push origin HEAD:run/control-plane
