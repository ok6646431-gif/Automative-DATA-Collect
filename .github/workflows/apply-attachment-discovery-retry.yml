name: Apply attachment discovery retry

on:
  push:
    branches: ['run/control-plane']
    paths:
      - 'tools/patch_attachment_discovery_retry.py'
      - '.github/workflows/apply-attachment-discovery-retry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Apply patch
        run: python tools/patch_attachment_discovery_retry.py
      - name: Run targeted regressions
        run: python -m unittest tests.test_corporate_docs_collect tests.test_collection_completeness -v
      - name: Commit integrated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collectors/corporate_docs_collect.py tests/test_corporate_docs_collect.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Retry verified attachment landing pages"
          git push
