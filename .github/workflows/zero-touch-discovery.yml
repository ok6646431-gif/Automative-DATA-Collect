name: Zero-touch company Discovery G0

on:
  workflow_dispatch:
    inputs:
      company_name:
        description: 'Company name only; optional when requests/zero_touch_request.json exists'
        required: false
        type: string
  push:
    branches:
      - run/control-plane
    paths:
      - 'requests/zero_touch_request.json'
      - 'requests/document_evidence.schema.json'
      - 'requests/verified_document_routes.json'
      - 'orchestrator/zero_touch_discovery.py'
      - 'orchestrator/dart_public_resolver.py'
      - 'orchestrator/document_route_merge.py'
      - 'orchestrator/document_route_registry.py'
      - 'orchestrator/document_language_preference.py'
      - 'orchestrator/g0_authority_site_recovery.py'
      - 'orchestrator/g0_data_attr_report_recovery.py'
      - 'orchestrator/g0_document_recovery_runner.py'
      - 'orchestrator/g0_domestic_site_catalog.py'
      - 'orchestrator/g0_domestic_site_catalog_enrichment.py'
      - 'orchestrator/g0_entity_continuity_policy.py'
      - 'orchestrator/g0_entity_window_normalization.py'
      - 'orchestrator/g0_evidence_enrichment.py'
      - 'orchestrator/g0_generic_js_report_recovery.py'
      - 'orchestrator/g0_js_form_report_recovery.py'
      - 'orchestrator/g0_kind_disclosure_recovery.py'
      - 'orchestrator/g0_kind_sustainability_recovery.py'
      - 'orchestrator/g0_live_adapters.py'
      - 'orchestrator/g0_official_site_recovery.py'
      - 'orchestrator/g0_plain_href_report_recovery.py'
      - 'orchestrator/g0_promotion_policy.py'
      - 'orchestrator/g0_site_verification_policy.py'
      - 'orchestrator/g0_public_source_fallback.py'
      - 'orchestrator/public_source_human_delivery.py'
      - 'orchestrator/public_site_crosscheck.py'
      - 'tests/test_public_site_crosscheck.py'
      - 'orchestrator/g0_public_disclosure_enrichment.py'
      - 'orchestrator/g0_rename_chronology_recovery.py'
      - 'orchestrator/g0_report_catalog_policy.py'
      - 'orchestrator/g0_report_enrichment.py'
      - 'orchestrator/g0_report_entity_policy.py'
      - 'orchestrator/g0_report_finalizer.py'
      - 'orchestrator/g0_scripted_report_enrichment.py'
      - 'orchestrator/g0_scripted_report_navigation.py'
      - 'orchestrator/g0_staged_official_recovery.py'
      - 'orchestrator/g0_thin_shell_recovery.py'
      - 'orchestrator/zero_touch_runner.py'
      - 'tests/test_document_evidence_schema.py'
      - 'tests/test_document_route_merge.py'
      - 'tests/test_document_route_registry.py'
      - 'tests/test_document_language_preference.py'
      - 'tests/test_zero_touch_discovery.py'
      - 'tests/test_dart_public_resolver.py'
      - 'tests/test_g0_document_recovery_runner.py'
      - 'tests/test_g0_domestic_site_catalog.py'
      - 'tests/test_g0_evidence_enrichment.py'
      - 'tests/test_g0_generic_js_local_year.py'
      - 'tests/test_g0_js_form_report_recovery.py'
      - 'tests/test_g0_kind_disclosure_recovery.py'
      - 'tests/test_g0_kind_sustainability_recovery.py'
      - 'tests/test_g0_live_adapters.py'
      - 'tests/test_g0_official_site_recovery.py'
      - 'tests/test_g0_plain_href_report_recovery.py'
      - 'tests/test_g0_promotion_policy.py'
      - 'tests/test_g0_site_verification_policy.py'
      - 'tests/test_g0_public_disclosure_enrichment.py'
      - 'tests/test_g0_rename_chronology_recovery.py'
      - 'tests/test_g0_report_enrichment.py'
      - 'tests/test_g0_report_entity_alignment.py'
      - 'tests/test_g0_report_finalizer.py'
      - 'tests/test_g0_scripted_report_enrichment.py'
      - 'tests/test_g0_scripted_report_navigation.py'
      - 'tests/test_g0_staged_official_recovery.py'
      - '.github/workflows/zero-touch-discovery.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: zero-touch-discovery-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    outputs:
      gate: ${{ steps.gate.outputs.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Discovery dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 jsonschema

      - name: Run G0 unit and contract regressions
        run: |
          python -m py_compile orchestrator/zero_touch_discovery.py orchestrator/dart_public_resolver.py orchestrator/document_route_merge.py orchestrator/document_route_registry.py orchestrator/g0_authority_site_recovery.py orchestrator/g0_data_attr_report_recovery.py orchestrator/g0_document_recovery_runner.py orchestrator/g0_domestic_site_catalog.py orchestrator/g0_domestic_site_catalog_enrichment.py orchestrator/g0_entity_continuity_policy.py orchestrator/g0_entity_window_normalization.py orchestrator/g0_evidence_enrichment.py orchestrator/g0_generic_js_report_recovery.py orchestrator/g0_js_form_report_recovery.py orchestrator/g0_kind_disclosure_recovery.py orchestrator/g0_kind_sustainability_recovery.py orchestrator/g0_live_adapters.py orchestrator/g0_official_site_recovery.py orchestrator/g0_plain_href_report_recovery.py orchestrator/g0_promotion_policy.py orchestrator/g0_site_verification_policy.py orchestrator/g0_public_disclosure_enrichment.py orchestrator/g0_rename_chronology_recovery.py orchestrator/g0_report_catalog_policy.py orchestrator/g0_report_enrichment.py orchestrator/g0_report_entity_policy.py orchestrator/g0_report_finalizer.py orchestrator/g0_scripted_report_enrichment.py orchestrator/g0_scripted_report_navigation.py orchestrator/g0_staged_official_recovery.py orchestrator/g0_thin_shell_recovery.py orchestrator/zero_touch_runner.py
          python -m unittest tests.test_document_evidence_schema -v
          python -m unittest tests.test_document_route_merge tests.test_document_route_registry -v
          python -m unittest tests.test_zero_touch_discovery -v
          python -m unittest tests.test_dart_public_resolver -v
          python -m unittest tests.test_g0_document_recovery_runner -v
          python -m unittest tests.test_g0_domestic_site_catalog -v
          python -m unittest tests.test_g0_evidence_enrichment -v
          python -m unittest tests.test_g0_generic_js_local_year -v
          python -m unittest tests.test_g0_js_form_report_recovery -v
          python -m unittest tests.test_g0_kind_disclosure_recovery -v
          python -m unittest tests.test_g0_kind_sustainability_recovery -v
          python -m unittest tests.test_g0_live_adapters -v
          python -m unittest tests.test_g0_official_site_recovery -v
          python -m unittest tests.test_g0_plain_href_report_recovery -v
          python -m unittest tests.test_g0_promotion_policy tests.test_g0_site_verification_policy -v
          python -m unittest tests.test_g0_public_disclosure_enrichment -v
          python -m unittest tests.test_g0_rename_chronology_recovery -v
          python -m unittest tests.test_g0_report_enrichment -v
          python -m unittest tests.test_g0_report_entity_alignment -v
          python -m unittest tests.test_document_language_preference tests.test_g0_report_finalizer -v
          python -m unittest tests.test_g0_scripted_report_enrichment -v
          python -m unittest tests.test_g0_scripted_report_navigation -v
          python -m unittest tests.test_g0_staged_official_recovery -v
          python -m unittest tests.test_company_profile_builder tests.test_bootstrap_inputs tests.test_request_builder tests.test_rename_continuity_contract -v

      - name: Determine whether live Discovery was requested
        id: request
        env:
          DISPATCH_COMPANY: ${{ inputs.company_name }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          name=(os.environ.get('DISPATCH_COMPANY') or '').strip()
          if not name and Path('requests/zero_touch_request.json').exists():
              try:
                  name=str(json.loads(Path('requests/zero_touch_request.json').read_text(encoding='utf-8')).get('company_name') or '').strip()
              except Exception:
                  name=''
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('run_live=' + ('true' if name else 'false') + '\n')
              f.write('company_name=' + name.replace('\n',' ') + '\n')
          print(json.dumps({'run_live': bool(name), 'company_name': name}, ensure_ascii=False))
          PY

      - name: Run fail-closed live Discovery
        id: live
        if: steps.request.outputs.run_live == 'true'
        continue-on-error: true
        env:
          COMPANY_NAME: ${{ steps.request.outputs.company_name }}
        run: >-
          python orchestrator/zero_touch_runner.py
          --company-name "$COMPANY_NAME"
          --out-dir generated-discovery
          --start-year 2020
          --max-pages 90

      - name: Run fresh-process annual document recovery
        if: >-
          steps.request.outputs.run_live == 'true' && always() &&
          hashFiles('generated-discovery/company_discovery.json') != '' &&
          hashFiles('generated-discovery/document_evidence.json') != '' &&
          hashFiles('generated-discovery/Discovery_Audit.json') != ''
        run: >-
          python orchestrator/g0_document_recovery_runner.py
          --out-dir generated-discovery
          --budget-seconds 150

      - name: Normalize generated event evidence contract
        if: steps.request.outputs.run_live == 'true' && always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('generated-discovery/event_evidence.json')
          if p.exists():
              x=json.loads(p.read_text(encoding='utf-8'))
              x.setdefault('gaps',[])
              p.write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Inspect gate and validate generated contracts
        id: gate
        if: steps.request.outputs.run_live == 'true' && always()
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          required=[
              Path('generated-discovery/company_discovery.json'),
              Path('generated-discovery/document_evidence.json'),
              Path('generated-discovery/event_evidence.json'),
              Path('generated-discovery/Discovery_Audit.json'),
          ]
          missing=[str(p) for p in required if not p.exists()]
          if missing:
              print('missing generated files:',missing,file=sys.stderr)
              gate='ERROR'
          else:
              audit=json.loads(required[-1].read_text(encoding='utf-8'))
              gate=str(audit.get('gate_status') or 'ERROR')
              if gate=='PASS':
                  from orchestrator.company_profile_builder import compile_discovery
                  from orchestrator.request_builder import build
                  d=json.loads(required[0].read_text(encoding='utf-8'))
                  profile, summary=compile_discovery(d)
                  request=build(profile)
                  if summary.get('review_required_count'):
                      gate='REVIEW_REQUIRED'
                  else:
                      print(json.dumps({
                          'request_id': request.get('request_id'),
                          'envinfo_terms_by_year': request.get('sources',{}).get('ENVINFO',{}).get('search_terms_by_year'),
                          'site_addresses': request.get('sources',{}).get('CLEANSYS_AIR',{}).get('site_addresses'),
                      },ensure_ascii=False))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f'gate={gate}\n')
          print(json.dumps({'gate':gate},ensure_ascii=False))
          PY

      - name: Validate JSON schemas before promotion
        if: steps.request.outputs.run_live == 'true' && steps.gate.outputs.gate == 'PASS'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          pairs=[
            ('requests/company_discovery.schema.json','generated-discovery/company_discovery.json'),
            ('requests/document_evidence.schema.json','generated-discovery/document_evidence.json'),
            ('requests/event_evidence.schema.json','generated-discovery/event_evidence.json'),
          ]
          for schema_path,data_path in pairs:
              schema=json.loads(Path(schema_path).read_text(encoding='utf-8'))
              data=json.loads(Path(data_path).read_text(encoding='utf-8'))
              jsonschema.Draft202012Validator(schema).validate(data)
              print('PASS',data_path)
          PY

      - name: Upload Discovery audit and candidate outputs
        if: steps.request.outputs.run_live == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-touch-discovery-${{ github.run_id }}
          path: generated-discovery/
          if-no-files-found: warn
          retention-days: 14

      - name: Promote verified Discovery to current control-plane inputs
        if: steps.request.outputs.run_live == 'true' && steps.gate.outputs.gate == 'PASS'
        env:
          COMPANY_NAME: ${{ steps.request.outputs.company_name }}
        run: |
          promo_dir="$(mktemp -d)"
          cp generated-discovery/company_discovery.json "$promo_dir/company_discovery.json"
          cp generated-discovery/document_evidence.json "$promo_dir/document_evidence.json"
          cp generated-discovery/event_evidence.json "$promo_dir/event_evidence.json"

          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          mkdir -p requests
          cp "$promo_dir/company_discovery.json" requests/company_discovery.json
          cp "$promo_dir/document_evidence.json" requests/document_evidence.json
          cp "$promo_dir/event_evidence.json" requests/event_evidence.json

          # Persist verified routes by DART legal-entity key so switching companies does
          # not erase previously accepted delivery routes. The updater fails closed when
          # a unique strongly verified DART key is unavailable.
          python orchestrator/document_route_registry.py update \
            --registry requests/verified_document_routes.json \
            --company requests/company_discovery.json \
            --documents requests/document_evidence.json

          python - <<'PY'
          import datetime, json
          from pathlib import Path
          d=json.loads(Path('requests/company_discovery.json').read_text(encoding='utf-8'))
          Path('requests/run_token.txt').write_text('zero-touch:' + d['request_id'] + ':' + datetime.datetime.now(datetime.timezone.utc).isoformat() + '\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requests/company_discovery.json requests/document_evidence.json requests/event_evidence.json requests/verified_document_routes.json requests/run_token.txt
          if git diff --cached --quiet; then
            echo 'No current-input changes to commit.'
          else
            git commit -m "Promote zero-touch Discovery for ${COMPANY_NAME}"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Record common collection-only trigger
        if: success() && steps.request.outputs.run_live == 'true' && steps.gate.outputs.gate == 'PASS'
        run: |
          echo "Verified Discovery promotion updates requests/run_token.txt."
          echo "That push triggers the common collect.yml collection_only job."
          echo "No redundant workflow_dispatch is emitted."


      - name: Stop on unresolved Discovery
        if: steps.request.outputs.run_live == 'true' && steps.gate.outputs.gate != 'PASS'
        run: |
          echo "Zero-touch Discovery was not promoted: gate=${{ steps.gate.outputs.gate }}" >&2
          echo 'Review the zero-touch-discovery artifact. No current control-plane inputs were overwritten.' >&2
          exit 2

  # A G0 report/site review is not evidence that official public registries
  # are unreachable. Recover each public source independently for the DART-
  # verified legal entity. Leave the original G0 run failed, and never promote
  # weak site names or modify the current control-plane company request.
  public_fallback_preflight:
    name: Verify legal-only fallback from G0 audit
    needs: discover
    # On a failed G0 job GitHub may not expose job-level step outputs.
    # Do not use needs.discover.outputs.gate: read the artifact itself.
    if: ${{ always() && needs.discover.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download this run's G0 evidence
        uses: actions/download-artifact@v4
        with:
          name: zero-touch-discovery-${{ github.run_id }}
          path: g0-evidence
      - name: Verify independently sourced legal identity and safe review types
        run: >-
          python -m orchestrator.g0_public_source_fallback
          --discovery-dir g0-evidence
          --out-dir public-fallback
      - name: Preserve source-only identity and search request
        uses: actions/upload-artifact@v4
        with:
          name: verified-public-fallback-request-${{ github.run_id }}
          path: public-fallback/
          if-no-files-found: error
          retention-days: 21

  public_source_fallback:
    name: G0 public fallback ${{ matrix.source }}
    needs: [discover, public_fallback_preflight]
    if: ${{ always() && needs.public_fallback_preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        source: [ENVINFO, PRTR, CHEM_STATS, CLEANSYS_AIR, SOOSIRO_WATER]
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source collector dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 xlsxwriter
      - name: Read preflight-verified legal source request
        uses: actions/download-artifact@v4
        with:
          name: verified-public-fallback-request-${{ github.run_id }}
          path: public-fallback
      - name: Confirm independent request and identity proof survived artifact transfer
        run: |
          test -s public-fallback/request.json
          test -s public-fallback/profile.json
          test -s public-fallback/identity_evidence.json
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path('public-fallback/identity_evidence.json').read_text(encoding='utf-8'))
          assert evidence['status'] == 'COMPANY_VERIFIED_PUBLIC_DISCOVERY_ONLY'
          assert evidence['source_g0_gate'] == 'REVIEW_REQUIRED'
          assert evidence['request_id'] == json.loads(
              Path('public-fallback/request.json').read_text(encoding='utf-8')
          )['request_id']
          PY
      - name: Collect the selected public source independently
        id: collect
        continue-on-error: true
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          case "$SOURCE" in
            ENVINFO) python collectors/envinfo_collect.py public-fallback/request.json ;;
            PRTR) python collectors/prtr_collect.py public-fallback/request.json ;;
            CHEM_STATS) python collectors/chem_stats_collect.py public-fallback/request.json ;;
            CLEANSYS_AIR) python collectors/cleansys_collect.py public-fallback/request.json ;;
            SOOSIRO_WATER) python collectors/soosiro_collect.py public-fallback/request.json ;;
            *) echo "Unexpected source" >&2; exit 98 ;;
          esac
      - name: Recover ENVINFO attachments
        id: attachments
        if: matrix.source == 'ENVINFO' && steps.collect.outcome == 'success'
        continue-on-error: true
        run: python collectors/envinfo_attachment_recovery.py --out output/ENVINFO --repo-root .
      - name: Evaluate this source with real collection evidence
        if: always()
        env:
          SOURCE: ${{ matrix.source }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          ATTACHMENT_OUTCOME: ${{ steps.attachments.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          from orchestrator.collection_acceptance import evaluate
          source = os.environ['SOURCE']
          root = Path('public-fallback')
          request_path = root / 'request.json'
          if request_path.exists():
              request = json.loads(request_path.read_text(encoding='utf-8'))
              request['sources'] = {source: request['sources'][source]}
              scoped = root / 'scoped_request.json'
              scoped.write_text(json.dumps(request, ensure_ascii=False, indent=2), encoding='utf-8')
              try:
                  verdict = evaluate('output', scoped, require_all_sources=False)
              except Exception as exc:
                  verdict = {'status': 'REVIEW_REQUIRED', 'blocking_issues': [{
                      'source': source, 'issue_type': 'ACCEPTANCE_EXCEPTION',
                      'severity': 'BLOCKING', 'detail': f'{type(exc).__name__}: {exc}'}]}
          else:
              verdict = {'status': 'REVIEW_REQUIRED', 'blocking_issues': [{
                  'source': source, 'issue_type': 'FALLBACK_REQUEST_FAILED',
                  'severity': 'BLOCKING', 'detail': 'source-only request not generated'}]}
          if os.environ['COLLECT_OUTCOME'] != 'success':
              verdict.setdefault('blocking_issues', []).append({
                  'source': source, 'issue_type': 'COLLECTOR_NONZERO_EXIT',
                  'severity': 'BLOCKING', 'detail': os.environ['COLLECT_OUTCOME']})
          if source == 'ENVINFO' and os.environ['ATTACHMENT_OUTCOME'] != 'success':
              verdict.setdefault('blocking_issues', []).append({
                  'source': source, 'issue_type': 'ATTACHMENT_RECOVERY_FAILED',
                  'severity': 'BLOCKING', 'detail': os.environ['ATTACHMENT_OUTCOME']})
          if verdict.get('blocking_issues'):
              verdict['status'] = 'REVIEW_REQUIRED'
          verdict['source_only'] = True
          verdict['source'] = source
          verdict['g0_promoted'] = False
          verdict['icis_pair_gate'] = ('NOT_RUN_IN_INDEPENDENT_SOURCE_MODE'
                                       if source in {'PRTR','CHEM_STATS'} else 'NOT_APPLICABLE')
          root.mkdir(parents=True, exist_ok=True)
          (root / 'Collection_Acceptance.json').write_text(
              json.dumps(verdict, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'source': source, 'verdict': verdict['status'],
                            'blocking_issue_count': len(verdict.get('blocking_issues') or []),
                            'g0_promoted': False}, ensure_ascii=False))
          PY
      - name: Preserve both success and failure evidence for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-public-fallback-${{ github.run_id }}-${{ matrix.source }}
          path: |
            public-fallback/
            output/${{ matrix.source }}/
          if-no-files-found: warn
          retention-days: 21
          compression-level: 0
      - name: Do not pass unverified or incomplete public-source evidence
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('public-fallback/Collection_Acceptance.json')
          if not p.exists():
              raise SystemExit('No source-only collection acceptance: REVIEW_REQUIRED')
          d = json.loads(p.read_text(encoding='utf-8'))
          if d.get('status') not in {'PASS', 'PASS_WITH_LIMITATION'}:
              raise SystemExit('G0 source-only verdict REVIEW_REQUIRED: ' + str(d.get('source')))
          PY

  public_site_crosscheck:
    name: Compare public source-native site IDs
    needs: [public_fallback_preflight, public_source_fallback]
    if: ${{ always() && needs.public_fallback_preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install evidence parsing dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Collect independent source evidence from this run
        uses: actions/download-artifact@v4
        with:
          pattern: g0-public-fallback-${{ github.run_id }}-*
          path: source-evidence
          merge-multiple: true
      - name: Recover the same preflight-verified legal identity
        uses: actions/download-artifact@v4
        with:
          name: verified-public-fallback-request-${{ github.run_id }}
          path: verified-request
      - name: Produce non-merging source-native ID correlation report
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          evidence=json.loads(Path('verified-request/identity_evidence.json').read_text(encoding='utf-8'))
          legal=str(evidence['legal_name'])
          cmd=[
              sys.executable, '-m', 'orchestrator.public_site_crosscheck',
              '--output-root', 'source-evidence/output',
              '--legal-name', legal,
              '--out', 'site-crosscheck/Public_Source_Site_Crosscheck.json',
          ]
          result=subprocess.run(cmd,check=False)
          p=Path('site-crosscheck/Public_Source_Site_Crosscheck.json')
          if not p.exists():
              raise SystemExit('Missing cross-source audit evidence')
          audit=json.loads(p.read_text(encoding='utf-8'))
          if audit.get('facility_id_crosswalk_verified') is not False:
              raise SystemExit('Unsafe cross-source native ID auto-merge')
          if any(v.get('disclosure_applicability')!='UNCONFIRMED'
                 for v in audit.get('tms',{}).values()):
              raise SystemExit('Unsafe TMS applicability inference')
          lines=[
              '공공자료원 사업장 식별 교차검증',
              '법인: '+legal,
              '판정: '+audit['status'],
              '주의: 같은 주소라도 자료원별 사업장 식별자가 같다는 뜻은 아닙니다.',
              '주의: TMS 목록 미매칭은 배출량 0이나 설치의무 비대상을 뜻하지 않습니다.',
              'ENVINFO 고유 ID 수: '+str(len(audit.get('envinfo_native_ids',[]))),
              '화학물질 통계 고유 ID 수: '+str(len(audit.get('chem_native_ids',[]))),
              '검토 항목: '+', '.join(audit.get('review_issues',[])),
          ]
          out=Path('site-crosscheck/Public_Source_Site_Crosscheck_Readme.txt')
          out.write_text('\\n'.join(lines)+'\\n',encoding='utf-8')
          print(json.dumps({'source_site_audit':audit['status'],
                            'blocked_inference_safety_pass':True,
                            'analyzer_exit_code':result.returncode},ensure_ascii=False))
          PY
      - name: Preserve cross-source evidence even with unresolved facility identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-public-site-crosscheck-${{ github.run_id }}
          path: site-crosscheck/
          retention-days: 21
          if-no-files-found: warn

  public_source_human_pdf_excel:
    name: Deliver five public registries as readable PDF and Excel ZIP
    needs: [public_fallback_preflight, public_source_fallback]
    if: ${{ always() && needs.public_fallback_preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
    env:
      PYTHONPATH: .:orchestrator
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Korean PDF printing and user-document validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-nanum chromium-browser || sudo apt-get install -y -qq fonts-noto-cjk fonts-nanum chromium
          sudo fc-cache -f
          python -m pip install --disable-pip-version-check requests beautifulsoup4 xlsxwriter pypdf openpyxl Pillow
      - name: Fetch five source archives independently without JSON filename collisions
        uses: actions/download-artifact@v4
        with:
          pattern: g0-public-fallback-${{ github.run_id }}-*
          path: source-artifacts
          merge-multiple: false
      - name: Fetch verified legal entity (not guessed from source names)
        uses: actions/download-artifact@v4
        with:
          name: verified-public-fallback-request-${{ github.run_id }}
          path: verified-request
      - name: Assemble exactly the five original public source directories
        run: |
          set -euo pipefail
          mkdir -p combined/output
          for source in ENVINFO PRTR CHEM_STATS CLEANSYS_AIR SOOSIRO_WATER; do
            input="source-artifacts/g0-public-fallback-${{ github.run_id }}-$source/output/$source"
            test -s "$input/status.json"
            cp -a "$input" "combined/output/$source"
          done
      - name: Render ENVINFO disclosure PDFs, preserve attachments, build 5-source Excel
        run: |
          python - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          evidence=json.loads(Path('verified-request/identity_evidence.json').read_text(encoding='utf-8'))
          legal=str(evidence['legal_name'])
          if evidence['status']!='COMPANY_VERIFIED_PUBLIC_DISCOVERY_ONLY' or not legal:
              raise SystemExit('Unverified legal entity cannot receive public user archive')
          # This is intentionally a public-registry-only ZIP; company ESG reports
          # were not collected in the fallback and remain an explicit limitation.
          cmd=[
              sys.executable,'-m','orchestrator.public_source_human_delivery',
              '--output-root','combined/output',
              '--out','human-delivery',
              '--company',legal,
          ]
          raise SystemExit(subprocess.run(cmd,check=False).returncode)
          PY
      - name: Verify user ZIP, completeness caveat and PDF/Excel-only formats
        run: |
          python - <<'PY'
          import json,zipfile
          from pathlib import Path
          q=json.loads(Path('human-delivery/Internal_Delivery_QA.json').read_text(encoding='utf-8'))
          if q['status'] not in {'USER_PDF_EXCEL_ZIP_READY','USER_PDF_EXCEL_ZIP_READY_WITH_LIMITATIONS'}:
              raise SystemExit('No validated user PDF/Excel bundle')
          if 'CORPORATE_REPORTS_NOT_INCLUDED_IN_PUBLIC_SOURCE_ONLY_PACKAGE' not in q.get('limitations',[]):
              raise SystemExit('Missing disclosure of nonincluded corporate reports')
          z=Path(q['outputs']['zip'])
          with zipfile.ZipFile(z) as a:
              files=[x for x in a.namelist() if not x.endswith('/')]
              if a.testzip() or not files or not all(f.endswith(('.pdf','.xlsx')) for f in files):
                  raise SystemExit('User bundle contains machine files or corrupted material')
          print('PDF/Excel validated; disclosure caveats preserved; JSON kept internal')
          PY
      - name: Publish validated user-facing PDF and Excel ZIP
        id: user_upload
        uses: actions/upload-artifact@v4
        with:
          name: public-registry-human-PDF-Excel-${{ github.run_id }}
          path: human-delivery/Public_Environmental_PDF_Excel.zip
          if-no-files-found: error
          retention-days: 21
          compression-level: 0
      - name: Require uploaded user ZIP ID
        env:
          USER_ARTIFACT_ID: ${{ steps.user_upload.outputs.artifact-id }}
        run: |
          test -n "$USER_ARTIFACT_ID"
          echo "User PDF/Excel ZIP artifact ID $USER_ARTIFACT_ID"
      - name: Retain internal evidence outside user ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-registry-internal-delivery-QA-${{ github.run_id }}
          path: human-delivery/Internal_Delivery_QA.json
          if-no-files-found: warn
          retention-days: 21
