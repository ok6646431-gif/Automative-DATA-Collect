name: Apply v1 review boundary patch final

on:
  push:
    branches:
      - run/control-plane
    paths:
      - '.github/workflows/apply-v1-review-boundary-final.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Repair maintenance helper and remove optional brittle rewrite
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('maintenance/apply_v1_review_boundary_patch.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("        html = '''<html><body>", '        html = """<html><body>', 1)
          s = s.replace("        </body></html>'''", '        </body></html>"""', 1)
          s = s.replace("'stages': {'official_site': {'recovery': {'rename_signals': [{'year': 2012}, {'year': 1997}]}}}}", "'stages': {'official_site': {'recovery': {'rename_signals': [{'year': 2012}, {'year': 1997}]}}}", 1)
          start_marker = "old = '''            if CATALOG_ROAD_ADDRESS_RE.search(value):"
          end_marker = "text = text.replace(old, new, 1)\n"
          if start_marker in s:
              start = s.index(start_marker)
              end = s.index(end_marker, start) + len(end_marker)
              s = s[:start] + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply exact v1 patch
        run: python maintenance/apply_v1_review_boundary_patch.py
      - name: Run targeted regressions
        run: |
          python -m py_compile orchestrator/g0_domestic_site_catalog.py orchestrator/g0_promotion_policy.py
          python -m unittest tests.test_g0_domestic_site_catalog tests.test_g0_promotion_policy -v
      - name: Commit verified v1 patch and clean temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply-v1-review-boundary-final.yml .github/workflows/fix-v1-maintenance-quoting.yml .github/workflows/apply-v1-review-boundary.yml maintenance/apply_v1_review_boundary_patch.py
          git add orchestrator/g0_domestic_site_catalog.py orchestrator/g0_promotion_policy.py tests/test_g0_domestic_site_catalog.py tests/test_g0_promotion_policy.py
          git diff --cached --check
          git commit -m 'Bound v1 site pairing and historical review scope'
          git push origin HEAD:run/control-plane
