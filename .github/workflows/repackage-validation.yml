name: Repackage validation against retained source artifacts

on:
  push:
    branches:
      - 'run/control-plane'
    paths:
      - '.github/workflows/repackage-validation.yml'
      - 'orchestrator/postprocess.py'
      - 'orchestrator/postprocess_core.py'
      - 'orchestrator/package_run.py'
      - 'orchestrator/package_run_core.py'
      - 'orchestrator/requested_scope.py'
      - 'tests/test_final_validation_semantics.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  repackage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 xlsxwriter
      - name: Run complete regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install Korean fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-nanum
          sudo fc-cache -f
      - name: Bootstrap current Discovery inputs
        run: >-
          python orchestrator/bootstrap_inputs.py
          --profile-out requests/runtime/company_profile.generated.json
          --request-out requests/current.generated.json
          --summary-out requests/runtime/Company_Discovery_Summary.json
      - name: Download retained stable source artifacts
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33735414258
          github-token: ${{ github.token }}
          pattern: stable-*
          path: collected/stable
          merge-multiple: true
      - name: Download retained ICIS attempt
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33735414258
          github-token: ${{ github.token }}
          pattern: icis-attempt-*
          path: collected/icis
          merge-multiple: false
      - name: Assemble and validate with current code
        run: >-
          python orchestrator/package_run.py
          --stable collected/stable
          --icis collected/icis
          --profile requests/runtime/company_profile.generated.json
          --out assembled
      - name: Build human-facing archive
        run: >-
          python orchestrator/archive_stage.py
          --package assembled
          --stable collected/stable
          --documents requests/document_evidence.json
      - name: Upload validation metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repackage-validation-final
          path: assembled/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload human archive
        if: ${{ always() && hashFiles('assembled/Human_Archive.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: repackage-validation-human
          path: assembled/Human_Archive.zip
          if-no-files-found: warn
          retention-days: 14
