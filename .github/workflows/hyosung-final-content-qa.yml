name: Hyosung final human archive content QA

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/hyosung-final-content-qa.yml'

permissions:
  contents: write
  actions: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: orchestrator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/control-plane
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 xlsxwriter openpyxl pypdf cryptography
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-nanum poppler-utils >/dev/null
          sudo fc-cache -f

      - name: Download retained Hyosung final package
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 35112968790
          name: enterprise-env-final
          path: source
          github-token: ${{ github.token }}

      - name: Prepare independent replay lanes
        run: |
          set -euo pipefail
          test -s source/Company_Profile.json
          test -s source/output/ENVINFO/status.json
          mkdir -p stable evidence
          cp -a source/output/CORP_DOCS stable/CORP_DOCS
          if [ -s source/Document_Evidence.json ]; then
            cp source/Document_Evidence.json evidence/Document_Evidence.json
          fi
          rm -rf source/Human_Archive source/Human_Archive.zip

      - name: Run current fidelity tests
        run: python -m unittest tests.test_envinfo_user_fidelity -v

      - name: Rebuild Human Archive with current production code
        run: |
          python orchestrator/archive_stage.py             --package source             --stable stable             --documents evidence/Document_Evidence.json

      - name: Inspect every ENV-INFO user PDF
        run: |
          rm -rf qa
          mkdir -p qa/extracted qa/screens
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          from pypdf import PdfReader

          zpath=Path('source/Human_Archive.zip')
          if not zpath.exists() or zpath.stat().st_size==0:
              raise SystemExit('Human Archive missing after rebuild')
          out=Path('qa/extracted')
          with zipfile.ZipFile(zpath) as z:
              members=[
                  n for n in z.namelist()
                  if '/01_사용자자료/03_환경정보공개시스템/' in n
                  and n.lower().endswith('.pdf')
                  and '첨부자료/' not in n
              ]
              if len(members) != 15:
                  raise SystemExit(f'Expected 15 ENV-INFO disclosure PDFs, got {len(members)}: {members}')
              extracted=[]
              for i,name in enumerate(sorted(members),1):
                  target=out/f'{i:02d}_{Path(name).name}'
                  target.write_bytes(z.read(name))
                  extracted.append((name,target))

          anchors=['사업현황','녹색경영','대기오염물질 배출량','수질오염물질 배출량','폐기물','화학물질 배출량','환경법규 위반','지속가능']
          report=[]
          for name,path in extracted:
              reader=PdfReader(str(path))
              pages=len(reader.pages)
              text='\n'.join((p.extract_text() or '') for p in reader.pages)
              lines=[x.strip() for x in text.splitlines() if x.strip()]
              single=sum(1 for x in lines if len(x)==1)
              ratio=single/len(lines) if lines else 1.0
              found={a:(a in text) for a in anchors}
              item={
                  'member':name,
                  'file':str(path),
                  'pages':pages,
                  'nonempty_lines':len(lines),
                  'single_char_lines':single,
                  'single_char_ratio':round(ratio,4),
                  'anchors':found,
              }
              report.append(item)
              if pages < 5:
                  raise SystemExit(f'ENV-INFO PDF too short for full disclosure: {name} pages={pages}')
              if len(lines) < 80:
                  raise SystemExit(f'ENV-INFO PDF text unexpectedly sparse: {name} lines={len(lines)}')
              if ratio > 0.10:
                  raise SystemExit(f'ENV-INFO PDF still shows fragmented text: {name} ratio={ratio}')
              if sum(found.values()) < 6:
                  raise SystemExit(f'ENV-INFO PDF missing disclosure headings: {name} anchors={found}')

          Path('qa/envinfo_content_qa.json').write_text(
              json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('qa/envinfo_content_qa.txt').write_text(
              '\n'.join(
                  f"{x['pages']} pages | single={x['single_char_ratio']:.4f} | "
                  f"anchors={sum(x['anchors'].values())}/8 | {x['member']}"
                  for x in report
              )+'\n',encoding='utf-8')
          print(Path('qa/envinfo_content_qa.txt').read_text(encoding='utf-8'))

          candidates=[(name,path) for name,path in extracted if '2020' in name and '효성티앤씨 주식회사' in name]
          if not candidates:
              candidates=[x for x in extracted if '2020' in x[0]]
          if not candidates:
              raise SystemExit('No 2020 representative ENV-INFO PDF found')
          Path('qa/representative_pdf_path.txt').write_text(str(candidates[0][1]),encoding='utf-8')
          PY

      - name: Render representative PDF pages to PNG
        run: |
          set -euo pipefail
          PDF="$(cat qa/representative_pdf_path.txt)"
          PAGES="$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')"
          MID=$(( (PAGES + 1) / 2 ))
          for N in 1 "$MID" "$PAGES"; do
            pdftoppm -f "$N" -l "$N" -png -r 130 -singlefile "$PDF" "qa/screens/page-$N"
          done
          ls -lh qa/screens

      - name: Upload content QA
        uses: actions/upload-artifact@v4
        with:
          name: hyosung-human-content-qa
          path: |
            qa/envinfo_content_qa.json
            qa/envinfo_content_qa.txt
            qa/screens/
          retention-days: 3

      - name: Upload regenerated Human Archive
        uses: actions/upload-artifact@v4
        with:
          name: hyosung-current-human-archive
          path: source/Human_Archive.zip
          retention-days: 7
          compression-level: 0

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name 'openai-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/hyosung-final-content-qa.yml
          git commit -m 'Remove Hyosung final content QA workflow'
          git push origin HEAD:run/control-plane
