name: Diagnose report HTML once

on:
  push:
    branches:
      - run/control-plane
    paths:
      - '.github/workflows/diagnose-report-html.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install diagnostic dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect live domestic-site catalog structure
        run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          url='https://www.kumhotire.com/ko/company/domeList.do'
          r=requests.get(url,timeout=(6,20),headers={'User-Agent':'Mozilla/5.0','Accept-Language':'ko,en;q=0.8'})
          print('STATUS',r.status_code,'FINAL',r.url,'CTYPE',r.headers.get('content-type'),'LEN',len(r.text))
          soup=BeautifulSoup(r.text,'html.parser')
          text=' '.join(soup.stripped_strings)
          print('TEXT',text[:12000])
          for needle in ['국내사업장','국내 사업장','중앙연구소','광주공장','평택공장','곡성공장','어등대로','평택항로','금호길']:
              print('\n===',needle,'===')
              m=re.search(re.escape(needle),r.text,re.I)
              if m:
                  print(r.text[max(0,m.start()-1200):min(len(r.text),m.end()+2200)].replace('\n',' ')[:3600])
              else:
                  print('NOT FOUND')
          print('\n=== ADDRESS-LIKE TAGS ===')
          shown=0
          for tag in soup.find_all(True):
              blob=' '.join(tag.stripped_strings)
              if re.search(r'(서울|광주|경기|전남|전라남도).{0,120}(로|길)\s*\d+',blob):
                  print(str(tag)[:4000].replace('\n',' '))
                  shown+=1
                  if shown>=20: break
          PY
