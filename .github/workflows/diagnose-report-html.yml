name: Diagnose report HTML once

on:
  push:
    branches:
      - run/control-plane
    paths:
      - '.github/workflows/diagnose-report-html.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install diagnostic dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Verify data-attribute report recovery against live page
        run: |
          python - <<'PY'
          import json
          from orchestrator import zero_touch_discovery as base
          from orchestrator.g0_data_attr_report_recovery import (
              candidates_from_data_attr_page,
              extract_data_controls,
          )
          url='https://www.kumhotire.com/ko/ESG/Materials/Report/'
          http=base.Http()
          r=http.get(url)
          if not r or r.status_code >= 400:
              raise SystemExit('report page fetch failed')
          controls=extract_data_controls(r.text,2020,2026)
          found,diagnostics=candidates_from_data_attr_page(http,r.url,r.text,2020,2026)
          print('CONTROL_YEARS',sorted({x['year'] for x in controls}))
          print('FOUND_YEARS',sorted({x['year'] for x in found}))
          print('FOUND')
          print(json.dumps(found,ensure_ascii=False,indent=2))
          print('DIAGNOSTICS')
          print(json.dumps(diagnostics,ensure_ascii=False,indent=2)[:30000])
          expected={2020,2022,2023,2024,2025,2026}
          actual={int(x['year']) for x in found}
          if actual != expected:
              raise SystemExit(f'expected {sorted(expected)} but recovered {sorted(actual)}')
          PY
