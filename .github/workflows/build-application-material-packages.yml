name: Build application material package

on:
  push:
    branches:
      - run/control-plane
    paths:
      - requests/application_package_request.json
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Workflow run ID that contains a verified Human Archive
        required: true
        type: string
      source_artifact_name:
        description: Artifact containing Human_Archive.zip
        required: true
        default: enterprise-env-human-archive
        type: string
      package_label:
        description: Optional user-facing company label for the output filename
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and test generic application package tools
        run: |
          python -m py_compile \
            tools/build_application_material_package.py \
            tools/validate_application_material_package.py \
            tools/build_application_material_from_archive.py
          python -m unittest -v \
            tests/test_application_material_package.py \
            tests/test_application_material_package_validation.py \
            tests/test_application_material_from_archive.py

      - name: Resolve package request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          INPUT_SOURCE_ARTIFACT_NAME: ${{ inputs.source_artifact_name }}
          INPUT_PACKAGE_LABEL: ${{ inputs.package_label }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          if os.environ.get('EVENT_NAME') == 'workflow_dispatch':
              request = {
                  'source_run_id': os.environ.get('INPUT_SOURCE_RUN_ID', ''),
                  'source_artifact_name': os.environ.get('INPUT_SOURCE_ARTIFACT_NAME', ''),
                  'package_label': os.environ.get('INPUT_PACKAGE_LABEL', ''),
              }
          else:
              request = json.loads(
                  Path('requests/application_package_request.json').read_text(encoding='utf-8')
              )

          run_id = str(request.get('source_run_id') or '').strip()
          artifact_name = str(
              request.get('source_artifact_name') or 'enterprise-env-human-archive'
          ).strip()
          package_label = str(request.get('package_label') or '').strip()

          if not run_id.isdigit() or int(run_id) <= 0:
              raise RuntimeError(f'invalid source_run_id: {run_id!r}')
          if not artifact_name:
              raise RuntimeError('source_artifact_name is required')
          if '\n' in artifact_name or '\r' in artifact_name:
              raise RuntimeError('source_artifact_name contains a newline')
          if '\n' in package_label or '\r' in package_label:
              raise RuntimeError('package_label contains a newline')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'source_run_id={run_id}\n')
              f.write(f'source_artifact_name={artifact_name}\n')
              f.write(f'package_label={package_label}\n')
          print(json.dumps({
              'source_run_id': run_id,
              'source_artifact_name': artifact_name,
              'package_label': package_label,
          }, ensure_ascii=False))
          PY

      - name: Download verified Human Archive
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.request.outputs.source_artifact_name }}
          path: source
          repository: ${{ github.repository }}
          run-id: ${{ steps.request.outputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate Human Archive
        shell: bash
        run: |
          set -euo pipefail
          HUMAN_ZIP="$(find source -type f -name 'Human_Archive.zip' -print -quit)"
          if [ -z "$HUMAN_ZIP" ]; then
            echo 'Human_Archive.zip not found in requested artifact' >&2
            find source -maxdepth 5 -type f -printf '%p\n' | head -100 >&2
            exit 1
          fi
          echo "HUMAN_ZIP=$HUMAN_ZIP" >> "$GITHUB_ENV"
          ls -lh "$HUMAN_ZIP"

      - name: Build and validate application package
        env:
          SOURCE_RUN_ID: ${{ steps.request.outputs.source_run_id }}
          PACKAGE_LABEL: ${{ steps.request.outputs.package_label }}
        run: |
          set -euo pipefail
          args=(
            --input "$HUMAN_ZIP"
            --output-dir delivery
            --source-run "$SOURCE_RUN_ID"
            --summary-out delivery/application_package_result.json
          )
          if [ -n "$PACKAGE_LABEL" ]; then
            args+=(--package-label "$PACKAGE_LABEL")
          fi
          python tools/build_application_material_from_archive.py "${args[@]}"

      - name: Inspect generated delivery
        run: |
          python - <<'PY'
          import json, zipfile
          from pathlib import Path

          result = json.loads(Path('delivery/application_package_result.json').read_text(encoding='utf-8'))
          package = Path(result['output_zip'])
          if not package.is_file():
              raise RuntimeError(f"output package missing: {package}")
          with zipfile.ZipFile(package) as z:
              if z.testzip() is not None:
                  raise RuntimeError('generated package ZIP integrity failure')
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload application material package
        uses: actions/upload-artifact@v4
        with:
          name: application-environment-materials
          path: delivery/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
