name: Archive dedup unit QA

on:
  push:
    branches:
      - 'run/control-plane'
    paths:
      - 'requests/archive_dedup_unit_qa.marker'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_archive_dedup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install archive QA dependencies
        run: python -m pip install --disable-pip-version-check xlsxwriter
      - name: Run archive dedup unit tests
        run: python -m unittest tests.test_archive_zip_dedup -v
