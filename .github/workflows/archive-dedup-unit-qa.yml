name: Archive dedup unit QA

on:
  push:
    branches:
      - 'run/control-plane'
    paths:
      - 'orchestrator/archive_user_dedup_v2.py'
      - 'orchestrator/archive_zip_dedup.py'
      - 'tests/test_archive_user_dedup_v2.py'
      - 'tests/test_archive_zip_dedup.py'
      - '.github/workflows/archive-dedup-unit-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_archive_dedup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install archive QA dependencies
        run: python -m pip install --disable-pip-version-check xlsxwriter pypdf
      - name: Run archive dedup unit tests
        env:
          PYTHONPATH: orchestrator
        run: >-
          python -m unittest
          tests.test_archive_zip_dedup
          tests.test_archive_user_dedup_v2
          -v
