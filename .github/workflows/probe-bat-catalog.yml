name: Probe official BAT catalog discovery
on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/probe-bat-catalog.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Probe dedicated IEPS BAT search
        run: |
          python - <<'PY'
          import json,re,requests,time
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 (BATCatalogDiscovery/1.0)'
          terms=['철강','비철금속','유기화학','석유정제','무기화학','정밀화학','비료','펄프','전자부품','반도체','섬유염색']
          out=[]
          for term in terms:
              found=[]
              for method in ('get','post'):
                  data={'CERT_TYP':'6','pMENUMST_ID':'95','tab':'seven','searchType':'ALL','searchWord':term}
                  try:
                      r=s.request(method,'https://ieps.nier.go.kr/web/board/5/',params=data if method=='get' else None,data=data if method=='post' else None,timeout=(15,60)); r.raise_for_status(); soup=BeautifulSoup(r.text,'html.parser')
                      links=[]
                      for a in soup.find_all('a'):
                          href=str(a.get('href') or ''); label=' '.join(a.stripped_strings); m=re.search(r'/web/board/5/(\d+)/?',href)
                          if m: links.append({'id':m.group(1),'href':urljoin(r.url,href),'label':label})
                      found.append({'method':method,'status':r.status_code,'url':r.url,'links':links})
                      print(term,method,[(x['id'],x['label']) for x in links])
                      if links: break
                  except Exception as e:
                      found.append({'method':method,'error':repr(e)}); print(term,method,'ERR',repr(e))
                  time.sleep(.2)
              out.append({'term':term,'attempts':found})
          open('bat_probe.json','w',encoding='utf-8').write(json.dumps({'queries':out},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bat-catalog-probe
          path: bat_probe.json
          retention-days: 3
