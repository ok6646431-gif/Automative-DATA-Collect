name: Probe official BAT catalog discovery
on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/probe-bat-catalog.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect IEPS board filters
        run: |
          python - <<'PY'
          import json,requests
          from bs4 import BeautifulSoup
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          url='https://ieps.nier.go.kr/web/board/5/?pMENUMST_ID=95'
          r=s.get(url,timeout=(10,30)); r.raise_for_status(); soup=BeautifulSoup(r.text,'html.parser')
          forms=[]
          for f in soup.find_all('form'):
              item={'action':f.get('action'),'method':f.get('method'),'id':f.get('id'),'name':f.get('name'),'controls':[]}
              for x in f.find_all(['input','select','button']):
                  c={'tag':x.name,'name':x.get('name'),'id':x.get('id'),'type':x.get('type'),'value':x.get('value')}
                  if x.name=='select': c['options']=[{'value':o.get('value'),'text':' '.join(o.stripped_strings),'selected':o.has_attr('selected')} for o in x.find_all('option')]
                  if x.name=='button': c['text']=' '.join(x.stripped_strings)
                  item['controls'].append(c)
              forms.append(item)
          # Also capture all selects outside forms and script fragments mentioning the filter names.
          selects=[]
          for x in soup.find_all('select'):
              selects.append({'name':x.get('name'),'id':x.get('id'),'options':[{'value':o.get('value'),'text':' '.join(o.stripped_strings)} for o in x.find_all('option')]})
          scripts=[]
          for sc in soup.find_all('script'):
              txt=sc.get_text('\n',strip=True)
              if 'gubunList' in txt or 'batIndutyCd' in txt or '/web/board/5/' in txt:
                  scripts.append(txt[:12000])
          payload={'status':r.status_code,'url':r.url,'forms':forms,'selects':selects,'scripts':scripts}
          open('bat_probe.json','w',encoding='utf-8').write(json.dumps(payload,ensure_ascii=False,indent=2))
          print(json.dumps({'selects':selects,'form_count':len(forms),'script_count':len(scripts)},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bat-catalog-probe
          path: bat_probe.json
          retention-days: 3
