name: Probe official BAT catalog discovery
on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/probe-bat-catalog.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Probe IEPS board
        run: |
          python - <<'PY'
          import json,re,requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          out=[]; details={}
          for page in range(1,31):
              url=f'https://ieps.nier.go.kr/web/board/5/?pMENUMST_ID=95&page={page}'
              try:
                  r=s.get(url,timeout=(10,30)); status=r.status_code; text=r.text
              except Exception as e:
                  out.append({'page':page,'error':repr(e)}); continue
              soup=BeautifulSoup(text,'html.parser')
              links=[]
              for a in soup.find_all('a'):
                  href=str(a.get('href') or '')
                  label=' '.join(a.stripped_strings)
                  m=re.search(r'/web/board/5/(\d+)/?',href)
                  if m:
                      links.append({'id':m.group(1),'href':urljoin(r.url,href),'label':label})
              out.append({'page':page,'status':status,'url':r.url,'bytes':len(r.content),'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'links':links[:50], 'text_head':' '.join(soup.stripped_strings)[:500]})
              for item in links:
                  details[item['id']]=item
          # Fetch unique detail pages and keep BAT-classified items.
          bat=[]
          for bid,item in sorted(details.items(), key=lambda kv:int(kv[0]), reverse=True):
              try:
                  r=s.get(item['href'],timeout=(10,30)); soup=BeautifulSoup(r.text,'html.parser'); txt=' '.join(soup.stripped_strings)
              except Exception as e:
                  continue
              if '최적가용기법 기준서' not in txt and '최적가용기법기준서' not in txt:
                  continue
              title=''
              # Prefer visible board title cell/text; fallback anchor label.
              for tag in soup.find_all(['h1','h2','h3','h4','strong','td','th','dt','dd']):
                  t=' '.join(tag.stripped_strings)
                  if '최적가용기법' in t and len(t)<250:
                      title=t; break
              bat.append({'id':bid,'detail_url':r.url,'list_label':item['label'],'title_guess':title,'text_head':txt[:1200]})
          open('bat_probe.json','w',encoding='utf-8').write(json.dumps({'pages':out,'detail_count':len(details),'bat_count':len(bat),'bat':bat},ensure_ascii=False,indent=2))
          print(json.dumps({'pages':len(out),'detail_count':len(details),'bat_count':len(bat),'bat_ids':[x['id'] for x in bat[:30]]},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bat-catalog-probe
          path: bat_probe.json
          retention-days: 3
