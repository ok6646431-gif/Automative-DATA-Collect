name: Probe official BAT catalog discovery
on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/probe-bat-catalog.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Verify common boiler BAT government direct PDF
        run: |
          python - <<'PY'
          import hashlib,json,requests
          url='https://www.korea.kr/common/download.do?fileId=196628937&tblKey=EDN'
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 (BATCatalogDiscovery/1.0)'
          r=s.get(url,timeout=(15,90),allow_redirects=True); r.raise_for_status()
          payload={'requested_url':url,'final_url':r.url,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type',''),'is_pdf':r.content.lstrip().startswith(b'%PDF-'),'sha256':hashlib.sha256(r.content).hexdigest()}
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          open('bat_probe.json','w',encoding='utf-8').write(json.dumps(payload,ensure_ascii=False,indent=2))
          if not payload['is_pdf']: raise SystemExit('Government direct endpoint did not return PDF bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bat-catalog-probe
          path: bat_probe.json
          retention-days: 3
