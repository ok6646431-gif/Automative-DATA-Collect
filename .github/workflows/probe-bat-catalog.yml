name: Probe official BAT catalog discovery
on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/probe-bat-catalog.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Probe dedicated IEPS BAT list
        run: |
          python - <<'PY'
          import json,re,time,requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 (BATCatalogDiscovery/1.0)'
          pages=[]; items={}
          for page in range(1,21):
              url='https://ieps.nier.go.kr/web/board/5/'
              params={'CERT_TYP':'6','pMENUMST_ID':'95','tab':'seven','page':page}
              try:
                  r=s.get(url,params=params,timeout=(15,60)); r.raise_for_status()
                  soup=BeautifulSoup(r.text,'html.parser'); links=[]
                  for a in soup.find_all('a'):
                      href=str(a.get('href') or ''); label=' '.join(a.stripped_strings)
                      m=re.search(r'/web/board/5/(\d+)/?',href)
                      if m:
                          it={'id':m.group(1),'href':urljoin(r.url,href),'label':label}
                          links.append(it); items[it['id']]=it
                  pages.append({'page':page,'status':r.status_code,'url':r.url,'links':links,'text_head':' '.join(soup.stripped_strings)[:1200]})
                  print('PAGE',page,'links',len(links),[(x['id'],x['label'][:60]) for x in links[:10]])
                  if page>1 and not links: break
              except Exception as e:
                  pages.append({'page':page,'error':repr(e)}); print('PAGE',page,'ERROR',repr(e));
                  if page==1: break
              time.sleep(.2)
          open('bat_probe.json','w',encoding='utf-8').write(json.dumps({'pages':pages,'item_count':len(items),'items':sorted(items.values(),key=lambda x:int(x['id']),reverse=True)},ensure_ascii=False,indent=2))
          print(json.dumps({'item_count':len(items),'ids':sorted(items,key=int,reverse=True)[:50]},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bat-catalog-probe
          path: bat_probe.json
          retention-days: 3
