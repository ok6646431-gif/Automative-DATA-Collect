name: Probe official BAT catalog discovery
on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/probe-bat-catalog.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Probe IEPS BAT search routes
        run: |
          python - <<'PY'
          import json,re,requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          base='https://ieps.nier.go.kr/web/board/5?pMENUMST_ID=95'
          attempts=[]
          specs=[
            ('POST_ALL', 'post', base, {'pMENUMST_ID':'95','tab':'','CERT_TYP':'','searchType':'ALL','searchWord':'최적가용기법'}),
            ('POST_TITLE','post', base, {'pMENUMST_ID':'95','tab':'','CERT_TYP':'','searchType':'TITL','searchWord':'최적가용기법'}),
            ('GET_ALL','get','https://ieps.nier.go.kr/web/board/5/', {'pMENUMST_ID':'95','searchType':'ALL','searchWord':'최적가용기법'}),
            ('GET_TITLE','get','https://ieps.nier.go.kr/web/board/5/', {'pMENUMST_ID':'95','searchType':'TITL','searchWord':'최적가용기법'}),
          ]
          for name,method,url,data in specs:
              try:
                  r=s.request(method,url,data=data if method=='post' else None,params=data if method=='get' else None,timeout=(10,45)); r.raise_for_status()
                  soup=BeautifulSoup(r.text,'html.parser'); links=[]
                  for a in soup.find_all('a'):
                      href=str(a.get('href') or ''); label=' '.join(a.stripped_strings)
                      m=re.search(r'/web/board/5/(\d+)/?',href)
                      if m: links.append({'id':m.group(1),'href':urljoin(r.url,href),'label':label})
                  attempts.append({'name':name,'status':r.status_code,'url':r.url,'bytes':len(r.content),'links':links,'text':' '.join(soup.stripped_strings)[:4000]})
                  print(name,r.status_code,r.url,'links',len(links),[(x['id'],x['label'][:70]) for x in links[:20]])
              except Exception as e:
                  attempts.append({'name':name,'error':repr(e)}); print(name,'ERROR',repr(e))
          open('bat_probe.json','w',encoding='utf-8').write(json.dumps({'attempts':attempts},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bat-catalog-probe
          path: bat_probe.json
          retention-days: 3
