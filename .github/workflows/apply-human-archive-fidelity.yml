name: Apply human archive fidelity integration
on:
  push:
    branches: [run/control-plane]
    paths: ['.github/workflows/apply-human-archive-fidelity.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check xlsxwriter openpyxl beautifulsoup4 requests
      - name: Integrate human-facing exporter
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('orchestrator/archive_builder.py')
          s=p.read_text(encoding='utf-8')
          anchor='from cross_entity_attachment_scope import match_envinfo_attachment\n'
          imp='from human_archive_exports import build_human_excels\n'
          if imp not in s:
              if anchor not in s: raise SystemExit('archive import anchor missing')
              s=s.replace(anchor, anchor+imp, 1)
          old="    excels=build_user_excels(package_root,archive_root,scope)\n"
          new="    excels=build_human_excels(package_root,archive_root,scope)\n    fidelity=read_json(archive_root/'00_자료목록'/'Human_Delivery_Fidelity.json',{}) or {}\n"
          if old in s:
              s=s.replace(old,new,1)
          elif 'excels=build_human_excels(package_root,archive_root,scope)' not in s:
              raise SystemExit('archive exporter call anchor missing')
          old_checks="    checks={'user_excel_exports':len(excels)>=4,'envinfo_pdf_complete':len([p for p in env_created if str(p).lower().endswith('.pdf')])>=expected_env if expected_env else True,'sustainability_minimum_5':distinct_file_count(sustainability)>=5,'public_policy_present':len(policy)>=1,'guideline_reference_present':len(guides)>=1,'review_report_present':review_pdf_present,'user_machine_formats_absent':user_machine_formats_absent}\n"
          new_checks="    checks={'user_excel_exports':len(excels)>=4,'human_delivery_fidelity':fidelity.get('pass') is True,'envinfo_pdf_complete':len([p for p in env_created if str(p).lower().endswith('.pdf')])>=expected_env if expected_env else True,'sustainability_minimum_5':distinct_file_count(sustainability)>=5,'public_policy_present':len(policy)>=1,'guideline_reference_present':len(guides)>=1,'review_report_present':review_pdf_present,'user_machine_formats_absent':user_machine_formats_absent}\n"
          if old_checks in s:
              s=s.replace(old_checks,new_checks,1)
          elif "'human_delivery_fidelity':fidelity.get('pass') is True" not in s:
              raise SystemExit('archive acceptance checks anchor missing')
          p.write_text(s,encoding='utf-8')

          w=Path('.github/workflows/source-regression-checkpoint.yml')
          x=w.read_text(encoding='utf-8')
          needle='tests.test_application_material_from_archive -v'
          if 'tests.test_human_archive_exports' not in x:
              if needle not in x: raise SystemExit('R1 test list anchor missing')
              x=x.replace(needle,'tests.test_application_material_from_archive tests.test_human_archive_exports -v',1)
          w.write_text(x,encoding='utf-8')
          PY
      - name: Targeted regression
        run: |
          python -m py_compile orchestrator/archive_builder.py orchestrator/human_archive_exports.py
          python -m unittest tests.test_human_archive_exports tests.test_archive_builder tests.test_archive_delivery_contract tests.test_application_material_from_archive -v
      - name: Commit verified integration
        run: |
          git config user.name 'openai-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/apply-human-archive-fidelity.yml
          git add orchestrator/archive_builder.py .github/workflows/source-regression-checkpoint.yml
          git diff --cached --check
          git commit -m 'Integrate human-facing source fidelity exports'
          git push origin HEAD:run/control-plane
