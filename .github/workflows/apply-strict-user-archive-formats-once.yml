name: Apply strict user archive formats once

on:
  push:
    branches:
      - run/control-plane
    paths:
      - '.github/workflows/apply-strict-user-archive-formats-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/control-plane
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install archive test dependencies
        run: python -m pip install --disable-pip-version-check xlsxwriter beautifulsoup4
      - name: Apply archive format patch
        run: python scripts/patch_user_archive_formats.py
      - name: Validate archive builder
        run: |
          python -m py_compile orchestrator/archive_builder.py
          python -m unittest tests.test_user_archive_format_contract -v
          python -m unittest discover -s tests -p 'test_archive*.py' -v
      - name: Commit source patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orchestrator/archive_builder.py
          git commit -m 'Enforce human-readable user archive formats'
          git push origin HEAD:run/control-plane
