name: Apply strict user archive formats once

on:
  push:
    branches:
      - run/control-plane
    paths:
      - '.github/workflows/apply-strict-user-archive-formats-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/control-plane
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch archive builder and add regression tests
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('orchestrator/archive_builder.py')
          s=p.read_text(encoding='utf-8')

          old="""    for name,required in REVIEW_REPORT_FILES:\n        src=root/name\n        if not src.exists(): continue\n        created.append(unique_copy(src,folder,f'{safe(company_name)}_{name}'))\n        if name.endswith('.pdf'): found_pdf=True\n"""
          new="""    for name,required in REVIEW_REPORT_FILES:\n        # Machine-readable traceability files stay in 90_시스템원본.\n        # The user-facing layer exposes only the finished PDF/XLSX report artifacts.\n        if not required: continue\n        src=root/name\n        if not src.exists(): continue\n        created.append(unique_copy(src,folder,f'{safe(company_name)}_{name}'))\n        if name.endswith('.pdf'): found_pdf=True\n"""
          if old not in s:
              raise SystemExit('review-report exposure block not found')
          s=s.replace(old,new,1)

          old="""        suffix=src.suffix or Path(str(doc.get('original_filename') or '')).suffix\n        if dtype=='SUSTAINABILITY_REPORT' and year: name=f'{safe(company_name)}_지속가능경영보고서_{year}{suffix}'\n        elif year: name=f'{year}_{safe(title or doc.get(\"original_filename\") or src.name)}{suffix if suffix and not str(title).lower().endswith(suffix.lower()) else \"\"}'\n        else: name=doc.get('original_filename') or f'{safe(title)}{suffix}'\n        copied=unique_copy(src,folder,name); created.append(copied)\n        x=dict(doc); x['user_archive_path']=str(copied.relative_to(archive_root)); rows.append(x)\n"""
          new="""        suffix=src.suffix or Path(str(doc.get('original_filename') or '')).suffix\n        source_for_user=src; rendered_tmp=None\n        # Official web pages are retained as raw HTML in 90_시스템원본, but the\n        # human-facing archive must expose a directly readable PDF instead.\n        if str(suffix).lower() in {'.html','.htm'}:\n            rendered_tmp=root/f'.user_render_{sha256(src)[:16]}.pdf'\n            ok,err=render_html_pdf(src,rendered_tmp)\n            if not ok:\n                x=dict(doc); x['user_archive_status']='PDF_RENDER_FAILED'; x['user_archive_error']=err; rows.append(x)\n                if rendered_tmp.exists(): rendered_tmp.unlink()\n                continue\n            source_for_user=rendered_tmp; suffix='.pdf'\n        if dtype=='SUSTAINABILITY_REPORT' and year: name=f'{safe(company_name)}_지속가능경영보고서_{year}{suffix}'\n        elif year: name=f'{year}_{safe(title or doc.get(\"original_filename\") or src.name)}{suffix if suffix and not str(title).lower().endswith(suffix.lower()) else \"\"}'\n        else:\n            raw_name=doc.get('original_filename') or f'{safe(title)}{suffix}'\n            name=f'{Path(str(raw_name)).stem}{suffix}' if rendered_tmp is not None else raw_name\n        copied=unique_copy(source_for_user,folder,name); created.append(copied)\n        if rendered_tmp is not None and rendered_tmp.exists(): rendered_tmp.unlink()\n        x=dict(doc); x['user_archive_path']=str(copied.relative_to(archive_root)); rows.append(x)\n"""
          if old not in s:
              raise SystemExit('corporate user copy block not found')
          s=s.replace(old,new,1)

          old="""    checks={'user_excel_exports':len(excels)>=4,'envinfo_pdf_complete':len([p for p in env_created if str(p).lower().endswith('.pdf')])>=expected_env if expected_env else True,'sustainability_minimum_5':distinct_file_count(sustainability)>=5,'public_policy_present':len(policy)>=1,'guideline_reference_present':len(guides)>=1,'review_report_present':review_pdf_present}\n"""
          new="""    forbidden_user_suffixes={'.html','.htm','.json','.jsonl'}\n    user_machine_formats_absent=not any(p.is_file() and p.suffix.lower() in forbidden_user_suffixes for p in (archive_root/USER_ROOT).rglob('*'))\n    checks={'user_excel_exports':len(excels)>=4,'envinfo_pdf_complete':len([p for p in env_created if str(p).lower().endswith('.pdf')])>=expected_env if expected_env else True,'sustainability_minimum_5':distinct_file_count(sustainability)>=5,'public_policy_present':len(policy)>=1,'guideline_reference_present':len(guides)>=1,'review_report_present':review_pdf_present,'user_machine_formats_absent':user_machine_formats_absent}\n"""
          if old not in s:
              raise SystemExit('archive acceptance checks block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          test=Path('tests/test_user_archive_format_contract.py')
          test.write_text(r'''import csv
import sys
import tempfile
import unittest
from pathlib import Path
from unittest import mock

sys.path.insert(0, str(Path(__file__).resolve().parents[1] / "orchestrator"))
import archive_builder as ab


class UserArchiveFormatContractTests(unittest.TestCase):
    def test_review_user_layer_exposes_only_finished_pdf_and_xlsx(self):
        with tempfile.TemporaryDirectory() as td:
            root=Path(td)/"pkg"; arc=Path(td)/"arc"; root.mkdir(); arc.mkdir()
            for name,_ in ab.REVIEW_REPORT_FILES:
                (root/name).write_bytes(b"dummy")
            created,pdf_present=ab.build_review_report_user(root,arc,"회사")
            self.assertTrue(pdf_present)
            self.assertEqual({p.suffix.lower() for p in created},{".pdf",".xlsx"})
            self.assertFalse(any(p.suffix.lower() in {".html",".json",".jsonl"} for p in (arc/ab.USER_ROOT).rglob("*") if p.is_file()))

    def test_corporate_html_is_rendered_to_pdf_for_user_layer(self):
        with tempfile.TemporaryDirectory() as td:
            root=Path(td)/"pkg"; arc=Path(td)/"arc"; docs=root/"output"/"CORP_DOCS"; docs.mkdir(parents=True); arc.mkdir()
            src=docs/"page.html"; src.write_text("<html><body>official</body></html>",encoding="utf-8")
            fields=["collection_status","stored_path","document_type","title","report_year","original_filename"]
            with (docs/"document_index.csv").open("w",encoding="utf-8-sig",newline="") as f:
                w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerow({"collection_status":"DOWNLOADED","stored_path":"output/CORP_DOCS/page.html","document_type":"ENVIRONMENTAL_POLICY","title":"환경정책","report_year":"2026","original_filename":"환경정책.html"})
            def fake_render(_src,dst):
                Path(dst).write_bytes(b"%PDF-1.4\n%%EOF"); return True,""
            with mock.patch.object(ab,"render_html_pdf",side_effect=fake_render):
                created,rows=ab.build_corporate_user(root,arc,"회사")
            self.assertEqual(len(created),1)
            self.assertEqual(created[0].suffix.lower(),".pdf")
            self.assertFalse(any(p.suffix.lower()==".html" for p in (arc/ab.USER_ROOT).rglob("*") if p.is_file()))
            self.assertTrue(rows[0].get("user_archive_path","").endswith(".pdf"))


if __name__ == "__main__":
    unittest.main()
''',encoding='utf-8')
          PY
      - name: Run focused and archive regression tests
        run: |
          python -m py_compile orchestrator/archive_builder.py
          python -m unittest tests.test_user_archive_format_contract -v
          python -m unittest discover -s tests -p 'test_archive*.py' -v
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orchestrator/archive_builder.py tests/test_user_archive_format_contract.py
          git commit -m 'Enforce human-readable user archive formats'
          git push origin HEAD:run/control-plane
