name: Apply split stable source jobs
on:
  push:
    branches: [run/control-plane]
    paths:
      - 'tools/patch_split_stable_sources.py'
      - '.github/workflows/apply-split-stable-sources.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split public sources and corporate documents
        run: python tools/patch_split_stable_sources.py
      - name: Verify split workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/collect.yml').read_text(encoding='utf-8')
          required = [
              '  corporate_documents:',
              'name: stable-public-sources',
              'name: stable-corporate-documents',
              'needs: [stable_sources, corporate_documents, icis_attempt_1, icis_attempt_2, icis_attempt_3, icis_replay]',
              'pattern: stable-*',
              'merge-multiple: true',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('missing split workflow markers: ' + ', '.join(missing))
          stable = text.split('  stable_sources:', 1)[1].split('  corporate_documents:', 1)[0]
          if 'Collect corporate documents' in stable:
              raise SystemExit('corporate collector still nested in stable_sources')
          PY
      - name: Commit split orchestrator structure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/collect.yml
          git diff --cached --exit-code && exit 0
          git commit -m 'Run corporate documents independently from public sources'
          git push
