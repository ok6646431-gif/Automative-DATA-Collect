name: Apply generic JS static-variable recovery

on:
  workflow_dispatch:
  push:
    branches:
      - run/control-plane
    paths:
      - tools/patch_g0_static_env.py
      - .github/workflows/apply-g0-static-env.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Apply generic patch
        run: python tools/patch_g0_static_env.py
      - name: Compile modified module
        run: python -m py_compile orchestrator/g0_generic_js_report_recovery.py
      - name: Run focused regressions
        run: >-
          python -m unittest
          tests.test_g0_scripted_report_enrichment
          tests.test_g0_generic_js_local_year
          -v
      - name: Commit generic recovery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orchestrator/g0_generic_js_report_recovery.py tests/test_g0_scripted_report_enrichment.py
          if git diff --cached --quiet; then
            echo 'No patch changes to commit.'
          else
            git commit -m 'Resolve generic JS report targets through local variables'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
