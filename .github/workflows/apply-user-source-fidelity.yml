# retrigger: apply production fidelity patch after workflow became active
name: Apply user source fidelity policy
on:
  push:
    branches: [run/control-plane]
    paths: ['.github/workflows/apply-user-source-fidelity.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 requests xlsxwriter openpyxl
      - name: Patch finalizer and ENV-INFO delivery
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('orchestrator/g0_report_finalizer.py')
          s=p.read_text(encoding='utf-8')
          imp='from orchestrator.document_language_preference import prefer_korean_sustainability\n'
          anchor='from orchestrator.document_year_guard import route_year_conflicts, strong_route_matches_year\n'
          if imp not in s:
              if anchor not in s: raise SystemExit('finalizer import anchor missing')
              s=s.replace(anchor,anchor+imp,1)
          marker='    documents["documents"] = out\n'
          replacement='    out, language_preference = prefer_korean_sustainability(discovery, out)\n    documents["documents"] = out\n'
          if marker in s:
              s=s.replace(marker,replacement,1)
          elif 'prefer_korean_sustainability(discovery, out)' not in s:
              raise SystemExit('finalizer output anchor missing')
          audit_anchor='        "removed_resolved_gaps": removed_gaps,\n'
          if '"language_preference": language_preference' not in s:
              if audit_anchor not in s: raise SystemExit('finalizer audit anchor missing')
              s=s.replace(audit_anchor,audit_anchor+'        "language_preference": language_preference,\n',1)
          p.write_text(s,encoding='utf-8')

          p=Path('orchestrator/archive_builder.py')
          s=p.read_text(encoding='utf-8')
          old="""        pdf=user/safe(display)/f'환경정보공개_{safe(display)}_{year}.pdf'\n        ok,err=render_html_pdf(matches[0],pdf)\n        if ok: created.append(pdf)\n        else: failures.append({'site':display,'year':year,'reason':err})\n"""
          new="""        site_dir=user/safe(display)\n        live_url=f'https://www.env-info.kr/user/register/viewUserSearch2.do?YEAR={year}&COMP_ID={comp}&OPEN_YN=Y'\n        pdf=site_dir/f'환경정보공개_{safe(display)}_{year}_공식화면인쇄본.pdf'\n        ok,err=render_url_pdf(live_url,pdf)\n        render_mode='OFFICIAL_LIVE_PAGE'\n        if not ok:\n            pdf=site_dir/f'환경정보공개_{safe(display)}_{year}_수집HTML_재현본.pdf'\n            ok,local_err=render_html_pdf(matches[0],pdf)\n            render_mode='COLLECTED_HTML_FALLBACK'\n            err=f'live={err}; local={local_err}'\n        if ok:\n            created.append(pdf)\n            raw_path=_raw_archive_path(root,matches[0]) or '90_시스템원본/output/ENVINFO/raw_detail'\n            notice=site_dir/f'환경정보공개_{safe(display)}_{year}_출처안내.txt'\n            if render_mode=='OFFICIAL_LIVE_PAGE':\n                explanation='공식 ENV-INFO 상세화면을 실행 시점에 브라우저 인쇄한 화면 보존본입니다. 사이트에서 직접 배포한 원본 PDF 파일은 아닙니다.'\n            else:\n                explanation='공식 상세화면의 실시간 재현에 실패하여 수집 당시 HTML 응답을 다시 인쇄한 재현본이며 원문 자체가 아님을 명시합니다.'\n            notice.write_text(\n                'ENV-INFO 사용자자료 출처 안내\\n\\n'+explanation+'\\n'\n                f'공식 상세 URL: {live_url}\\n'\n                f'수집 당시 원문 HTML 보존 경로: {raw_path}\\n'\n                f'표시 방식: {render_mode}\\n'\n                '원자료 확인이 필요하면 90_시스템원본의 수집 HTML과 공식 상세 URL을 우선 기준으로 사용하십시오.\\n',\n                encoding='utf-8'\n            )\n            created.append(notice)\n        else:\n            failures.append({'site':display,'year':year,'reason':err})\n"""
          if old in s:
              s=s.replace(old,new,1)
          elif '_공식화면인쇄본.pdf' not in s:
              raise SystemExit('ENVINFO render anchor missing')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Targeted regression
        run: |
          python -m py_compile orchestrator/document_language_preference.py orchestrator/g0_report_finalizer.py orchestrator/archive_builder.py
          python -m unittest tests.test_document_language_preference tests.test_envinfo_user_fidelity tests.test_g0_report_finalizer tests.test_archive_delivery_contract -v
      - name: Commit verified changes
        run: |
          git config user.name 'openai-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/apply-user-source-fidelity.yml
          git add orchestrator/g0_report_finalizer.py orchestrator/archive_builder.py
          git diff --cached --check
          git commit -m 'Prefer source-faithful ENV-INFO and Korean reports'
          git push origin HEAD:run/control-plane
