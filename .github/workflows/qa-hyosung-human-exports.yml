name: QA Hyosung human-facing exports
on:
  push:
    branches: [run/control-plane]
    paths: ['.github/workflows/qa-hyosung-human-exports.yml']
permissions:
  contents: read
  actions: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QA dependency
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Download regenerated Hyosung exports
        uses: actions/download-artifact@v4
        with:
          name: hyosung-human-exports-qc
          path: hyosung-qc
          repository: ${{ github.repository }}
          run-id: 35223739218
          github-token: ${{ github.token }}
      - name: Verify fidelity and workbook contents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from openpyxl import load_workbook
          out=Path('hyosung-qc')
          fidelity=json.loads((out/'00_자료목록'/'Human_Delivery_Fidelity.json').read_text(encoding='utf-8'))
          print('FIDELITY=',json.dumps(fidelity,ensure_ascii=False,indent=2))
          assert fidelity.get('pass') is True, fidelity

          specs={
              'PRTR': out/'01_사용자자료'/'02_화학물질'/'PRTR_배출이동량'/'PRTR_화학물질배출이동량_정리.xlsx',
              'CHEM_STATS': out/'01_사용자자료'/'02_화학물질'/'화학물질통계'/'화학물질통계_정리.xlsx',
              'SOOSIRO_WATER': out/'01_사용자자료'/'01_TMS'/'수질_SOOSIRO'/'SOOSIRO_수질TMS_정리.xlsx',
              'CLEANSYS_AIR': out/'01_사용자자료'/'01_TMS'/'대기_CleanSYS'/'CleanSYS_대기TMS_정리.xlsx',
          }
          qa={'fidelity':fidelity,'workbooks':{}}
          for source,path in specs.items():
              wb=load_workbook(path,read_only=True,data_only=True)
              sheets={}
              for ws in wb.worksheets:
                  headers=[c.value for c in next(ws.iter_rows(min_row=1,max_row=1))]
                  sheets[ws.title]={'data_rows':max(ws.max_row-1,0),'headers':headers}
              qa['workbooks'][source]=sheets
              print('\n###',source)
              for n,v in sheets.items(): print(n,'rows=',v['data_rows'],'headers=',v['headers'][:14])

          prtr=load_workbook(specs['PRTR'],read_only=True,data_only=True)
          ph=[c.value for c in next(prtr['확정_사업장연도'].iter_rows(min_row=1,max_row=1))]
          assert ph[:4]==['자료연도','원문 사업장명','원문 주소','PRTR 사업장ID']
          assert prtr['확정_사업장연도'].max_row-1 == 10
          assert prtr['확정_원문표'].max_row-1 == 186

          chem=load_workbook(specs['CHEM_STATS'],read_only=True,data_only=True)
          ch=[c.value for c in next(chem['확정_사업장연도'].iter_rows(min_row=1,max_row=1))]
          assert ch[:5]==['자료연도','해당연도 원문 사업장명','해당연도 원문 주소','화학물질통계 사업장ID','원문 업종']
          assert chem['확정_사업장연도'].max_row-1 == 6
          assert chem['확정_원문표'].max_row-1 == 664

          water=load_workbook(specs['SOOSIRO_WATER'],read_only=True,data_only=True)
          assert water['검토필요_연간'].max_row-1 == 6
          assert water['검토필요_일자료'].max_row-1 == 370
          wh=[c.value for c in next(water['검토필요_연간'].iter_rows(min_row=1,max_row=1))]
          assert wh[:4]==['자료연도','원문 사업장명','원문 주소','SOOSIRO 사업장코드']

          air=load_workbook(specs['CLEANSYS_AIR'],read_only=True,data_only=True)
          assert air['확정_연간데이터'].max_row-1 == 5
          ah=[c.value for c in next(air['확정_연간데이터'].iter_rows(min_row=1,max_row=1))]
          assert ah[:4]==['자료연도','원문 사업장명','원문 주소','CleanSYS 사업장코드']

          (out/'QA_summary.json').write_text(json.dumps(qa,ensure_ascii=False,indent=2),encoding='utf-8')
          print('\nVERIFIED PASS')
          PY
      - name: Upload verified workbooks
        uses: actions/upload-artifact@v4
        with:
          name: hyosung-human-exports-verified
          path: hyosung-qc/
          if-no-files-found: error
          retention-days: 7
