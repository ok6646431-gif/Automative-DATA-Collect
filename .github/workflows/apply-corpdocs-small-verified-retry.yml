name: Apply corpdocs small verified retry
on:
  push:
    branches: [run/control-plane]
    paths:
      - 'tools/apply_corpdocs_small_verified_retry.marker'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/control-plane
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Apply patch
        run: python tools/patch_corporate_docs_small_verified_retry.py
      - name: Run regression tests
        run: >-
          python -m unittest
          tests.test_corporate_docs_collect
          tests.test_corporate_docs_slow_retry
          tests.test_corporate_docs_range_segments
          tests.test_corporate_docs_content_encoding
          tests.test_corporate_docs_small_verified_retry
          tests.test_kumho_report_source_routing -v
      - name: Commit collector repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add collectors/corporate_docs_collect.py
          if git diff --cached --quiet; then
            echo 'Collector already patched.'
          else
            git commit -m 'Retry small verified documents after valid slow response'
            git push origin HEAD:run/control-plane
          fi
