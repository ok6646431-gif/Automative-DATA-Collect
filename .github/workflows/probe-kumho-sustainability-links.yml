name: Probe Kumho sustainability links

on:
  push:
    branches: ['run/control-plane']
    paths: ['.github/workflows/probe-kumho-sustainability-links.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect official report page
        run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          url='https://www.kkpc.com/kor/winwin/esg/sustainabilityList/'
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0 Chrome/151'},timeout=(15,40)); r.raise_for_status()
          print('STATUS',r.status_code,'BYTES',len(r.content),'URL',r.url)
          html=r.text
          soup=BeautifulSoup(html,'html.parser')
          print('--- ANCHORS/ONCLICK containing sustainability/report/pdf/download/year ---')
          for tag in soup.find_all(['a','button','img']):
              s=' '.join([str(tag.get('href') or ''),str(tag.get('onclick') or ''),str(tag.get('src') or ''),str(tag.get('alt') or ''),tag.get_text(' ',strip=True)])
              if re.search(r'202[0-6]|sustain|report|pdf|download',s,re.I): print(tag.name,repr(s[:1200]))
          print('--- RAW LINES around years/download ---')
          for line in html.splitlines():
              if re.search(r'202[0-6]|SUSTAINABILITY|download|\.pdf',line,re.I): print(line[:3000])
          PY
