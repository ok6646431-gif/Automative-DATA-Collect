name: Probe Kumho sustainability links

on:
  push:
    branches: ['run/control-plane']
    paths: ['.github/workflows/probe-kumho-sustainability-links.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Resolve official legacy report redirects
        run: |
          python - <<'PY'
          import requests, json
          page='https://www.kkpc.com/kor/winwin/esg/sustainabilityList/'
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 Chrome/151'
          r=s.get(page,timeout=(15,40)); r.raise_for_status()
          endpoint='https://www.kkpc.com/kor/invest/library/sustainabilitySurvey/'
          for label,seq in {'2023':'7019','2022':'6252','2021':'5173','2020':'4017'}.items():
              x=s.get(endpoint,params={'ATTACH_FILE_SEQ':seq,'SURVEY':'기타'},headers={'Referer':page},timeout=(15,30),allow_redirects=False,stream=True)
              print(json.dumps({'year':label,'seq':seq,'status':x.status_code,'location':x.headers.get('Location'),'ctype':x.headers.get('Content-Type'),'clen':x.headers.get('Content-Length'),'cd':x.headers.get('Content-Disposition')},ensure_ascii=False))
              x.close()
          PY
