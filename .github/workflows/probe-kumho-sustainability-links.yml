name: Probe Kumho sustainability links

on:
  push:
    branches: ['run/control-plane']
    paths: ['.github/workflows/probe-kumho-sustainability-links.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Verify legacy official report download IDs
        run: |
          python - <<'PY'
          import requests, json
          ids={'2022_KOR':'6252','2021_KOR':'5173','2020_KOR':'4017','2023_KOR':'7019'}
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 Chrome/151'
          # establish official page session/referer first
          page='https://www.kkpc.com/kor/winwin/esg/sustainabilityList/'
          r=s.get(page,timeout=(15,40)); r.raise_for_status()
          for label,seq in ids.items():
              url=f'https://www.kkpc.com/download/?seq={seq}'
              try:
                  x=s.get(url,headers={'Referer':page},timeout=(15,45),allow_redirects=True)
                  print(json.dumps({'label':label,'seq':seq,'status':x.status_code,'url':x.url,'bytes':len(x.content),'ctype':x.headers.get('Content-Type'),'cd':x.headers.get('Content-Disposition'),'magic':x.content[:8].hex()},ensure_ascii=False))
              except Exception as e:
                  print(json.dumps({'label':label,'seq':seq,'error':type(e).__name__+': '+str(e)},ensure_ascii=False))
          PY
