name: Probe Kumho sustainability links

on:
  push:
    branches: ['run/control-plane']
    paths: ['.github/workflows/probe-kumho-sustainability-links.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Inspect Popup Survey implementation
        run: |
          python - <<'PY'
          import re, requests
          url='https://www.kkpc.com/kor/winwin/esg/sustainabilityList/'
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0 Chrome/151'},timeout=(15,40)); r.raise_for_status()
          html=r.text
          for pat in [r'function\s+Popup_Survey[\s\S]{0,2500}', r'frmDownChk[\s\S]{0,2500}', r'down_seq[\s\S]{0,1800}', r'seq[\s\S]{0,1200}sustainabilitySurvey']:
              print('\nPATTERN',pat)
              m=re.search(pat,html,re.I)
              print(m.group(0) if m else 'NOT_FOUND')
          print('\nFORM/INPUT LINES')
          for line in html.splitlines():
              if re.search(r'Popup_Survey|frmDownChk|sustainabilitySurvey|seq|down',line,re.I): print(line[:3000])
          PY
