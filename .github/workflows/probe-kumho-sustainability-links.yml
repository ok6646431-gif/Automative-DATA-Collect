name: Probe Kumho sustainability links

on:
  push:
    branches: ['run/control-plane']
    paths: ['.github/workflows/probe-kumho-sustainability-links.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect legacy official report sections
        run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          url='https://www.kkpc.com/kor/winwin/esg/sustainabilityList/'
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0 Chrome/151'},timeout=(15,40)); r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          for year in ('2022','2021','2020'):
              print('\n=== YEAR',year,'===')
              nodes=[x for x in soup.find_all(string=re.compile(year))]
              print('NODES',len(nodes))
              for node in nodes[:5]:
                  tag=node.parent
                  print('TAG',tag.name,repr(tag.get_text(' ',strip=True))[:500])
                  # print nearest meaningful container, including all anchors and onclick values
                  container=tag
                  for _ in range(4):
                      if container.parent: container=container.parent
                  for a in container.find_all('a'):
                      print('A',repr(a.get_text(' ',strip=True)),repr(a.get('href')),repr(a.get('onclick')))
                  raw=str(container)
                  for m in re.findall(r'[^\n]{0,180}(?:202[0-2]|download|Popup_Survey|\.pdf)[^\n]{0,260}',raw,re.I):
                      print('RAW',m[:900])
          PY
