name: Hanwha source and annual report quality remediation

on:
  push:
    branches: [run/control-plane]
    paths:
      - '.github/workflows/hanwha-quality-remediation.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: hanwha-quality-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/control-plane
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QA dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 xlsxwriter pypdf cryptography openpyxl
      - name: Download prior real-source ICIS fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35480886754 --repo "$GITHUB_REPOSITORY" --name icis-attempt-1 --dir /tmp/hanwha-icis-fixture
      - name: Apply guarded shared-source fixes
        run: python tools/hanwha_quality_runner.py --test-source-root /tmp/hanwha-icis-fixture
      - name: Run focused and full archive regressions
        run: |
          python -m compileall -q collectors/chem_stats_collect.py orchestrator/archive_zip_dedup.py orchestrator/archive_builder.py
          python -m unittest discover -s tests -p 'test_*.py' -q
          git diff --check
      - name: Commit validated common fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add collectors/chem_stats_collect.py orchestrator/archive_zip_dedup.py orchestrator/archive_builder.py tools/hanwha_quality_remediation.py
          git diff --cached --quiet && { echo 'No staged remediation'; exit 1; }
          git commit -m 'Reject empty ICIS details and require official annual report evidence'
          git pull --rebase origin run/control-plane
          git push origin HEAD:run/control-plane
      - name: Dispatch fresh Hanwha full collection on validated head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --repo "$GITHUB_REPOSITORY" --ref run/control-plane
