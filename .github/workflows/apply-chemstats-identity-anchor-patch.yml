name: Apply chemical-statistics identity anchor patch

on:
  push:
    branches: [run/control-plane]
    paths:
      - 'tools/patch_chemstats_identity_anchor.py'
      - '.github/workflows/apply-chemstats-identity-anchor-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/patch_chemstats_identity_anchor.py
      - run: python -m unittest tests.test_postprocess -v
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orchestrator/postprocess.py
          git diff --cached --quiet && exit 0
          git commit -m "Use source-ID anchor metadata for hidden chemical rounds"
          git push
