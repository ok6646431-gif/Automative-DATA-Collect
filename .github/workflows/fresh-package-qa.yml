name: Fresh package live QA
# semantic bridge validation v2

on:
  push:
    branches:
      - 'run/control-plane'
    paths:
      - '.github/workflows/fresh-package-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package_qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 xlsxwriter
      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Bootstrap current KKPC request
        run: >-
          python orchestrator/bootstrap_inputs.py
          --profile-out requests/runtime/company_profile.generated.json
          --request-out requests/current.generated.json
          --summary-out requests/runtime/Company_Discovery_Summary.json
      - name: Download verified stable sources from Master 121
        uses: actions/download-artifact@v4
        with:
          name: stable-sources
          path: collected/stable
          run-id: 33178406275
          github-token: ${{ github.token }}
      - name: Download fresh ICIS attempt from Master 122
        uses: actions/download-artifact@v4
        with:
          name: icis-attempt-1
          path: collected/icis/icis-attempt-1
          run-id: 33181052754
          github-token: ${{ github.token }}
      - name: Assemble fresh package candidate
        run: >-
          python orchestrator/package_run.py
          --stable collected/stable
          --icis collected/icis
          --profile requests/runtime/company_profile.generated.json
          --out package-qa
      - name: Assert semantic bridge result
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          root=Path('package-qa')
          manifest=json.loads((root/'Master_Manifest.json').read_text(encoding='utf-8'))
          cross=json.loads((root/'Cross_Layer_Review_Summary.json').read_text(encoding='utf-8'))
          sem=json.loads((root/'Document_Semantics_Summary.json').read_text(encoding='utf-8'))
          assert manifest['package_health']=='PASS', manifest
          assert manifest['validation']=='REVIEW_REQUIRED', manifest
          assert manifest['icis_selection_state']=='GOOD_ATTEMPT', manifest
          assert manifest['icis_replayed_sources']==[], manifest
          assert sem['failures']==[], sem
          assert cross['schema_version']=='2.0', cross
          assert cross['four_layer_ready']==1, cross
          assert cross['semantic_bridge_blocked']==4, cross
          rows=list(csv.DictReader((root/'Cross_Layer_Review_Candidates.csv').open(encoding='utf-8-sig',newline='')))
          initial_topic_ids={
              'TOPIC_28254682C65D':'Y2_AIR',
              'TOPIC_B0802384E73B':'Y2_CHEM',
              'TOPIC_ED1857F91626':'Y2_WATER',
              'TOPIC_8F530E183570':'Y1_AIR',
              'TOPIC_E8AB5ED252DD':'Y1_CHEM',
          }
          selected={initial_topic_ids[r['topic_id']]:r for r in rows if r.get('topic_id') in initial_topic_ids}
          assert selected['Y1_AIR']['review_state']=='FOUR_LAYER_READY', selected['Y1_AIR']
          assert selected['Y1_AIR']['semantic_bridge_state']=='READY', selected['Y1_AIR']
          assert 'NOX' in selected['Y1_AIR']['semantic_bridge_anchors'].split('|'), selected['Y1_AIR']
          assert selected['Y2_AIR']['review_state']=='MULTI_LAYER_REVIEW', selected['Y2_AIR']
          assert selected['Y2_AIR']['semantic_bridge_state']=='NO_COMMON_TOPIC_BRIDGE', selected['Y2_AIR']
          assert selected['Y2_WATER']['review_state']=='MULTI_LAYER_REVIEW', selected['Y2_WATER']
          assert selected['Y2_WATER']['semantic_bridge_state']=='NO_COMMON_TOPIC_BRIDGE', selected['Y2_WATER']
          for key in ('Y1_CHEM','Y2_CHEM'):
              assert selected[key]['review_state']=='MULTI_LAYER_REVIEW', selected[key]
              assert selected[key]['semantic_bridge_state']=='CHEMICAL_AGGREGATE_DRIVER_REQUIRED', selected[key]
          qtypes={r['question_type'] for r in csv.DictReader((root/'Study_Question_Queue.csv').open(encoding='utf-8-sig',newline=''))}
          assert 'TOPIC_SEMANTIC_BRIDGE_GAP' in qtypes, qtypes
          assert 'CHEMICAL_DRIVER_GAP' in qtypes, qtypes
          print(json.dumps({
              'package_health':manifest['package_health'],
              'four_layer_ready':cross['four_layer_ready'],
              'semantic_bridge_blocked':cross['semantic_bridge_blocked'],
              'checked':{k:{
                  'site_name':v.get('site_name'),
                  'domain':v.get('domain'),
                  'review_state':v.get('review_state'),
                  'semantic_bridge_state':v.get('semantic_bridge_state'),
                  'semantic_bridge_anchors':v.get('semantic_bridge_anchors'),
                  'semantic_bridge_note':v.get('semantic_bridge_note'),
              } for k,v in selected.items()},
          },ensure_ascii=False,indent=2))
          PY
      - name: Upload semantic bridge QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-bridge-qa
          path: |
            package-qa/Master_Manifest.json
            package-qa/Cross_Layer_Review_Summary.json
            package-qa/Cross_Layer_Review_Candidates.csv
            package-qa/Evidence_Layer_Registry.csv
            package-qa/Review_Topic_Candidates.csv
            package-qa/Review_Signal_Registry.csv
            package-qa/Management_Action_Ledger.csv
            package-qa/Document_Semantic_Candidates.csv
            package-qa/Generated_Semantic_Evidence.json
            package-qa/Document_Semantics_Summary.json
            package-qa/Industry_Reference_Applicability.csv
            package-qa/Study_Question_Queue.csv
            package-qa/REVIEW_REQUIRED.json
          if-no-files-found: warn
          retention-days: 7
