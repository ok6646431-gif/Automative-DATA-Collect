name: Hyosung human fidelity QA
on:
  push:
    branches: [run/control-plane]
    paths: ['.github/workflows/qa-hyosung-user-fidelity.yml']
permissions:
  contents: write
  actions: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install QA dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 xlsxwriter openpyxl jsonschema
      - name: Download verified Hyosung final package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p old_artifact
          gh run download 35112968790 -n enterprise-env-final -D old_artifact
          find old_artifact -maxdepth 3 -type f -printf '%p %s bytes\n' | head -80
      - name: Locate package root
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          old=Path('old_artifact')
          def roots(base):
              return [p.parent for p in base.rglob('Company_Profile.json') if (p.parent/'output').exists()]
          found=roots(old)
          if not found:
              unpack=Path('old_unpacked'); unpack.mkdir(exist_ok=True)
              for i,z in enumerate(old.rglob('*.zip')):
                  target=unpack/f'z{i}'; target.mkdir(parents=True,exist_ok=True)
                  try:
                      with zipfile.ZipFile(z) as f: f.extractall(target)
                  except zipfile.BadZipFile: pass
              found=roots(unpack)
          if not found:
              raise SystemExit('No assembled package root found')
          root=sorted(found,key=lambda p: len(str(p)))[0].resolve()
          Path('package_root.txt').write_text(str(root),encoding='utf-8')
          print('PACKAGE_ROOT=',root)
          print('output sources=',sorted(p.name for p in (root/'output').iterdir() if p.is_dir()))
          PY
      - name: Rebuild only human-facing structured exports and ENV-INFO
        env:
          PYTHONPATH: .:orchestrator
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          from orchestrator import archive_builder as ab
          root=Path('package_root.txt').read_text(encoding='utf-8').strip()
          root=Path(root)
          qa=Path('qa_archive')
          if qa.exists(): shutil.rmtree(qa)
          profile=ab.read_json(root/'Company_Profile.json',{}) or {}
          scope,labels,tokens=ab.source_id_scope(root,profile)
          excels=ab.build_human_excels(root,qa,scope)
          env_created,env_failures,env_exclusions=ab.build_envinfo_user(root,qa,scope,labels)
          summary={
            'company':profile.get('company_display_name') or profile.get('company_input'),
            'excels':[str(p) for p in excels],
            'env_created':[str(p) for p in env_created],
            'env_failures':env_failures,
            'env_exclusions':env_exclusions,
            'scope':{k:sorted(map(str,v)) for k,v in scope.items()},
          }
          Path('qa_archive/qa_generation_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Verify actual workbook order and ENV-INFO provenance
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          from openpyxl import load_workbook

          qa=Path('qa_archive')
          result={'checks':{},'details':{}}
          def read_sheet(pattern,sheet):
              p=next(qa.rglob(pattern))
              wb=load_workbook(p,read_only=True,data_only=True)
              ws=wb[sheet]
              rows=list(ws.iter_rows(values_only=True))
              headers=[str(x or '') for x in rows[0]]
              out=[dict(zip(headers,r)) for r in rows[1:] if any(x is not None for x in r)]
              return p,out
          def year(v):
              m=re.search(r'20\d{2}',str(v or ''))
              return int(m.group()) if m else 9999
          def text(v): return str(v or '')

          p,rows=read_sheet('CleanSYS_대기TMS_정리.xlsx','확정_연간데이터')
          keys=[(text(r.get('원문 사업장명')),year(r.get('자료연도'))) for r in rows]
          result['details']['cleansys_keys']=keys
          result['checks']['cleansys_site_year_sorted']=keys==sorted(keys)

          p,rows=read_sheet('SOOSIRO_수질TMS_정리.xlsx','검토필요_연간')
          keys=[(text(r.get('원문 사업장명')),year(r.get('자료연도')),text(r.get('방류구번호'))) for r in rows]
          result['details']['soosiro_annual_keys']=keys
          result['checks']['soosiro_annual_sorted']=keys==sorted(keys)
          p,daily=read_sheet('SOOSIRO_수질TMS_정리.xlsx','검토필요_일자료')
          keys=[(text(r.get('원문 사업장명')),year(r.get('자료연도')),text(r.get('일자')),text(r.get('방류구번호'))) for r in daily]
          result['details']['soosiro_daily_first_last']=[keys[:3],keys[-3:]]
          result['checks']['soosiro_daily_sorted']=keys==sorted(keys)

          for pattern,sheet,label,namecol in [
              ('PRTR_화학물질배출이동량_정리.xlsx','확정_사업장연도','prtr','원문 사업장명'),
              ('화학물질통계_정리.xlsx','확정_사업장연도','chem','해당연도 원문 사업장명')]:
              p,rows=read_sheet(pattern,sheet)
              keys=[(text(r.get(namecol)),year(r.get('자료연도'))) for r in rows]
              result['details'][label+'_keys']=keys
              result['checks'][label+'_site_year_sorted']=keys==sorted(keys)

          notices=list(qa.rglob('*_출처안내.txt'))
          pdfs=list(qa.rglob('환경정보공개_*_공식화면인쇄본.pdf'))
          fallbacks=list(qa.rglob('환경정보공개_*_수집HTML_재현본.pdf'))
          result['details']['envinfo_notice_count']=len(notices)
          result['details']['envinfo_live_pdf_count']=len(pdfs)
          result['details']['envinfo_fallback_pdf_count']=len(fallbacks)
          result['details']['envinfo_notice_samples']=[p.read_text(encoding='utf-8')[:600] for p in notices[:3]]
          result['checks']['envinfo_outputs_labeled']=bool(notices) and len(notices)==len(pdfs)+len(fallbacks)
          result['pass']=all(result['checks'].values())
          Path('qa_archive/actual_fidelity_qa.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if not result['pass']: raise SystemExit('Actual Hyosung human-fidelity QA failed')
          PY
      - name: Run current Hyosung G0 without promotion
        continue-on-error: true
        env:
          PYTHONPATH: .:orchestrator
        run: |
          set +e
          python orchestrator/zero_touch_runner.py --company-name '효성티앤씨' --out-dir g0_hyosung --start-year 2020 --max-pages 90
          code=$?
          if [ "$code" -eq 0 ]; then
            python orchestrator/g0_document_recovery_runner.py --out-dir g0_hyosung --budget-seconds 150
            code=$?
          fi
          echo "$code" > g0_exit_code.txt
          exit 0
      - name: Inspect actual sustainability language choices
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          out={'g0_exit_code':Path('g0_exit_code.txt').read_text().strip() if Path('g0_exit_code.txt').exists() else 'missing','documents':[],'audit_language_preference':None}
          p=Path('g0_hyosung/document_evidence.json')
          if p.exists():
              data=json.loads(p.read_text(encoding='utf-8'))
              for d in data.get('documents',[]):
                  if d.get('document_type')=='SUSTAINABILITY_REPORT':
                      out['documents'].append({k:d.get(k) for k in ['report_year','title','source_url','source_locator','verification_status','fallback_sources']})
          a=Path('g0_hyosung/Discovery_Audit.json')
          if a.exists():
              audit=json.loads(a.read_text(encoding='utf-8'))
              out['audit_language_preference']=(audit.get('stages',{}).get('report_finalizer',{}) or {}).get('language_preference')
          kr=[]; en=[]; unknown=[]
          def lang(x):
              s=(str(x.get('source_url') or '')+' '+str(x.get('title') or '')).lower()
              if re.search(r'(^|[/_.-])(kr|kor|korean)([/_.-]|$)',s) or '국문' in s or '한글' in s: return 'KR'
              if re.search(r'(^|[/_.-])(en|eng|english)([/_.-]|$)',s) or '영문' in s: return 'EN'
              return 'UNKNOWN'
          for d in out['documents']:
              {'KR':kr,'EN':en,'UNKNOWN':unknown}[lang(d)].append(d.get('report_year'))
          out['detected_primary_language_years']={'KR':kr,'EN':en,'UNKNOWN':unknown}
          Path('qa_archive/g0_sustainability_language_qa.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hyosung-human-fidelity-qa
          path: qa_archive
          retention-days: 7
      - name: Remove temporary QA workflow
        if: always()
        run: |
          git config user.name 'openai-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/qa-hyosung-user-fidelity.yml
          git commit -m 'Remove Hyosung human fidelity QA workflow'
          git push origin HEAD:run/control-plane
