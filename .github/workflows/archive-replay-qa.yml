name: Human archive replay QA

on:
  push:
    branches:
      - 'run/control-plane'
    paths:
      - 'requests/archive_replay_qa.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: archive-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay_archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 xlsxwriter
      - name: Install Korean/CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-nanum
          sudo fc-cache -f
      - name: Read source artifacts
        id: cfg
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          cfg=json.load(open('requests/archive_replay_qa.json',encoding='utf-8'))
          source_run_id=str(cfg['source_run_id'])
          print('source_run_id='+source_run_id)
          print('public_artifact_name='+str(cfg.get('public_artifact_name') or 'stable-public-sources'))
          print('document_run_id='+str(cfg.get('document_run_id') or source_run_id))
          print('document_artifact_name='+str(cfg.get('document_artifact_name') or 'stable-corporate-documents'))
          print('icis_run_id='+str(cfg.get('icis_run_id') or source_run_id))
          PY
      - name: Bootstrap current discovery inputs
        run: >-
          python orchestrator/bootstrap_inputs.py
          --profile-out requests/runtime/company_profile.generated.json
          --request-out requests/current.generated.json
          --summary-out requests/runtime/Company_Discovery_Summary.json
      - name: Download public-source artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.cfg.outputs.public_artifact_name }}
          path: collected/stable
          run-id: ${{ steps.cfg.outputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Download verified corporate-document artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.cfg.outputs.document_artifact_name }}
          path: collected/stable/CORP_DOCS
          run-id: ${{ steps.cfg.outputs.document_run_id }}
          github-token: ${{ github.token }}
      - name: Download ICIS attempts
        uses: actions/download-artifact@v4
        with:
          pattern: icis-attempt-*
          path: collected/icis
          merge-multiple: false
          run-id: ${{ steps.cfg.outputs.icis_run_id }}
          github-token: ${{ github.token }}
      - name: Require replay inputs
        run: |
          for required in \
            collected/stable/ENVINFO/status.json \
            collected/stable/SOOSIRO_WATER/status.json \
            collected/stable/CLEANSYS_AIR/status.json \
            collected/stable/CORP_DOCS/status.json; do
            if [ ! -s "$required" ]; then
              echo "Missing replay input: $required" >&2
              exit 1
            fi
          done
      - name: Rebuild package with current code
        run: >-
          python orchestrator/package_run.py
          --stable collected/stable
          --icis collected/icis
          --profile requests/runtime/company_profile.generated.json
          --out assembled
      - name: Preserve discovery summary
        run: cp requests/runtime/Company_Discovery_Summary.json assembled/Company_Discovery_Summary.json
      - name: Build deduplicated human archive
        run: >-
          python orchestrator/archive_stage.py
          --package assembled
          --stable collected/stable
          --documents requests/document_evidence.json
      - name: Validate corporate documents in archive
        run: |
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          payload=json.loads(Path('assembled/Archive_Summary.json').read_text(encoding='utf-8'))
          archive=payload.get('archive', payload)
          checks=archive.get('acceptance_checks', {})
          downloaded=int(archive.get('downloaded_documents') or 0)
          if downloaded < 14:
              raise SystemExit(f'Expected >=14 downloaded documents, got {downloaded}')
          if not checks.get('sustainability_minimum_5'):
              raise SystemExit('Sustainability minimum-history check failed')
          if not checks.get('public_policy_present'):
              raise SystemExit('Public policy document check failed')
          if not archive.get('study_enrichment_checks', {}).get('guideline_reference_present'):
              raise SystemExit('Guideline/BAT reference check failed')
          z=zipfile.ZipFile('assembled/Human_Archive.zip')
          names=z.namelist()
          if len(names) < 100:
              raise SystemExit(f'Archive unexpectedly small: {len(names)} entries')
          print(json.dumps({
              'REPLAY_ARCHIVE_ACCEPTANCE':'PASS',
              'downloaded_documents':downloaded,
              'zip_entries':len(names),
              'zip_bytes':archive.get('zip_bytes'),
              'archive_completeness':archive.get('archive_completeness'),
              'acceptance_checks':checks,
              'study_enrichment_checks':archive.get('study_enrichment_checks', {}),
          }, ensure_ascii=False))
          PY
      - name: Show archive summary
        run: cat assembled/Archive_Summary.json
      - name: Upload archive replay result
        uses: actions/upload-artifact@v4
        with:
          name: human-archive-replay-qa
          path: |
            assembled/Human_Archive.zip
            assembled/Archive_Summary.json
            assembled/Master_Manifest.json
            assembled/Artifact_Index.csv
          if-no-files-found: error
          retention-days: 7
