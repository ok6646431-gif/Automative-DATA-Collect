name: Apply final environment-system completion blockers

on:
  workflow_dispatch:
  push:
    branches:
      - run/control-plane
    paths:
      - 'tools/apply_completion_blockers.py'
      - '.github/workflows/apply-completion-blockers.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pyyaml
      - name: Apply idempotent completion patch
        run: python tools/apply_completion_blockers.py
      - name: Validate source fixes
        run: |
          python -m unittest tests.test_document_route_merge -v
          if [ -f tests/test_g0_kind_sustainability_fallback.py ]; then python -m unittest tests.test_g0_kind_sustainability_fallback -v; fi
          python -m py_compile orchestrator/bat_collector.py orchestrator/zero_touch_runner.py orchestrator/archive_stage_core.py orchestrator/document_route_merge.py
          if [ -f orchestrator/g0_kind_sustainability_fallback.py ]; then python -m py_compile orchestrator/g0_kind_sustainability_fallback.py; fi
      - name: Commit completion patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orchestrator/bat_collector.py orchestrator/zero_touch_runner.py orchestrator/archive_stage_core.py orchestrator/document_route_merge.py orchestrator/g0_kind_sustainability_fallback.py tests/test_g0_kind_sustainability_fallback.py .github/workflows/zero-touch-discovery.yml requests/document_evidence.json requests/run_token.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No patch changes to commit.'
          else
            git commit -m 'Close final collection delivery blockers'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
