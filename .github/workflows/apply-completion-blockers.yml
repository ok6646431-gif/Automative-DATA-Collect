name: Apply final environment-system completion blockers

on:
  workflow_dispatch:
  push:
    branches:
      - run/control-plane
    paths:
      - 'tools/apply_completion_blockers.py'
      - '.github/workflows/apply-completion-blockers.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pyyaml
      - name: Apply idempotent completion patch
        run: python tools/apply_completion_blockers.py
      - name: Validate route merge and patched workflows
        run: |
          python -m unittest tests.test_document_route_merge -v
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in (Path('.github/workflows/collect.yml'), Path('.github/workflows/zero-touch-discovery.yml')):
              yaml.safe_load(path.read_text(encoding='utf-8'))
              print('YAML_OK', path)
          PY
      - name: Commit completion patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/collect.yml .github/workflows/zero-touch-discovery.yml requests/document_evidence.json requests/run_token.txt
          if git diff --cached --quiet; then
            echo 'No patch changes to commit.'
          else
            git commit -m 'Close final collection delivery blockers'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
