name: G0 verified-legal public fallback unit tests

on:
  push:
    branches: [run/control-plane]
    paths:
      - 'orchestrator/g0_public_source_fallback.py'
      - 'tests/test_g0_public_source_fallback.py'
      - '.github/workflows/g0-public-source-fallback-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify_legal_source_projection:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source profile dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Test fail-closed legal gate, projected source scope and nonpromotion of weak sites
        run: |
          python -m py_compile orchestrator/g0_public_source_fallback.py
          python -m unittest tests.test_g0_public_source_fallback tests.test_g0_promotion_policy tests.test_g0_site_verification_policy -v
