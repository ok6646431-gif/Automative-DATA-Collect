name: Apply generic scope and completeness fix

on:
  push:
    branches:
      - run/control-plane
    paths:
      - '.github/workflows/apply-generic-scope-completeness-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/control-plane
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply generic fixes and regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) BAT must consume the already-resolved requested-scope boundary instead
          # of independently rematching profile candidates against Site_Master.
          p=Path('orchestrator/bat_stage.py')
          text=p.read_text(encoding='utf-8')
          old='''def _canonical_candidate_map(package):
              package=Path(package)
              profile=json.loads((package/'Company_Profile.json').read_text(encoding='utf-8')) if (package/'Company_Profile.json').exists() else {}
              candidates=[c for c in profile.get('site_candidates',[]) or [] if isinstance(c,dict)]
              scope_ids=set((profile.get('requested_scope') or {}).get('candidate_ids',[]) or [])
              selected=[c for c in candidates if not scope_ids or str(c.get('candidate_id') or '') in scope_ids]
              address_counts=_selected_address_counts(selected)
              sites,_=_read_csv(package/'Site_Master.csv')
              inverse={}
              for candidate in selected:
                  candidate_id=str(candidate.get('candidate_id') or '')
                  if not candidate_id: continue
                  for site in sites:
                      if site.get('identity_status')!='CONFIRMED': continue
                      if _candidate_matches(candidate,site.get('canonical_site_name'),site.get('canonical_address_key'),profile,address_counts):
                          cid=str(site.get('canonical_site_id') or '')
                          if cid: inverse.setdefault(cid,[]).append(candidate_id)
              return profile,inverse
          '''.replace('          ','')
          new='''def _authoritative_requested_site_ids(package):
              """Return the central SITE_SET boundary when Requested_Scope is available.

              None means the central resolver has not produced a scope artifact yet and
              legacy rematching may be used as a compatibility fallback. An empty set is
              authoritative and must fail closed rather than reopening candidate matching.
              """
              package=Path(package)
              path=package/'Requested_Scope.json'
              if not path.exists():
                  return None
              try:
                  scope=json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  return None
              if str(scope.get('mode') or '').upper()!='SITE_SET':
                  return None
              return {str(x) for x in (scope.get('target_canonical_site_ids') or []) if str(x)}


          def _canonical_candidate_map(package):
              package=Path(package)
              profile=json.loads((package/'Company_Profile.json').read_text(encoding='utf-8')) if (package/'Company_Profile.json').exists() else {}
              candidates=[c for c in profile.get('site_candidates',[]) or [] if isinstance(c,dict)]
              scope_ids=set((profile.get('requested_scope') or {}).get('candidate_ids',[]) or [])
              selected=[c for c in candidates if not scope_ids or str(c.get('candidate_id') or '') in scope_ids]
              address_counts=_selected_address_counts(selected)
              sites,_=_read_csv(package/'Site_Master.csv')
              authoritative=_authoritative_requested_site_ids(package)
              inverse={}
              for candidate in selected:
                  candidate_id=str(candidate.get('candidate_id') or '')
                  if not candidate_id: continue
                  for site in sites:
                      if site.get('identity_status')!='CONFIRMED': continue
                      cid=str(site.get('canonical_site_id') or '')
                      if authoritative is not None and cid not in authoritative:
                          continue
                      if _candidate_matches(candidate,site.get('canonical_site_name'),site.get('canonical_address_key'),profile,address_counts):
                          if cid: inverse.setdefault(cid,[]).append(candidate_id)
              return profile,inverse
          '''.replace('          ','')
          if old not in text:
              raise SystemExit('bat_stage _canonical_candidate_map anchor not found')
          text=text.replace(old,new,1)
          old2="""    allowed=set(inverse)\n    mapped={candidate_id for values in inverse.values() for candidate_id in values}\n"""
          new2="""    authoritative=_authoritative_requested_site_ids(package)\n    allowed=set(inverse) if authoritative is None else set(authoritative)\n    mapped={candidate_id for values in inverse.values() for candidate_id in values}\n"""
          if old2 not in text:
              raise SystemExit('bat_stage allowed-set anchor not found')
          text=text.replace(old2,new2,1)
          p.write_text(text,encoding='utf-8')

          # 2) Collection completeness must distinguish requested history from the
          # current legal entity's active period. Pre-entity raw evidence remains
          # traceable, but it is not a blocking current-entity query obligation.
          p=Path('orchestrator/collection_completeness.py')
          text=p.read_text(encoding='utf-8')
          anchor='''def years_in(start, end):
              a = as_year(start); b = as_year(end)
              return list(range(a, b + 1)) if a is not None and b is not None and a <= b else []


          def row(source, kind, period, state, *, query_state="", data=False, evidence="", note=""):
          '''.replace('          ','')
          replacement='''def years_in(start, end):
              a = as_year(start); b = as_year(end)
              return list(range(a, b + 1)) if a is not None and b is not None and a <= b else []


          def current_entity_period(profile):
              """Return only a verified legal-entity lifetime boundary.

              A current-name period is intentionally not used here: a rename changes a
              name, not the corporation's birth date. Missing legacy entity metadata
              therefore fails open rather than deleting valid pre-rename evidence.
              """
              for key in ("legal_entity_active_period", "current_legal_entity_active_period"):
                  period=(profile or {}).get(key)
                  if not isinstance(period,dict):
                      continue
                  start=as_year(period.get("start_year")); end=as_year(period.get("end_year"))
                  if start is not None or end is not None:
                      return {"start_year":start,"end_year":end}
              return {}


          def apply_current_entity_period(rows, profile):
              """Mark public-source years outside the current entity as nonblocking history."""
              period=current_entity_period(profile)
              if not period:
                  return rows
              start=period.get("start_year"); end=period.get("end_year")
              out=[]
              for item in rows:
                  y=as_year(item.get("period")) if item.get("period_kind")=="YEAR" else None
                  outside=(y is not None and ((start is not None and y < start) or (end is not None and y > end)))
                  if not outside:
                      out.append(item); continue
                  revised=dict(item)
                  raw_state=str(item.get("completeness_state") or "")
                  revised["expected"]="N"
                  revised["completeness_state"]="OUTSIDE_CURRENT_ENTITY_PERIOD"
                  revised["query_state"]="HISTORICAL_REFERENCE" if item.get("data_present")=="Y" else "NOT_REQUIRED_CURRENT_ENTITY"
                  suffix=f"current_legal_entity_period={start or ''}..{end or ''}; raw_state={raw_state}"
                  revised["evidence"]=(str(item.get("evidence") or "")+"; "+suffix).strip("; ")
                  revised["user_note"]="현재 법인 존속기간 밖의 요청연도임. 원자료는 역사 참고자료로 보존하되 현 법인 수집 완결성 요구에서는 제외함"
                  out.append(revised)
              return out


          def row(source, kind, period, state, *, query_state="", data=False, evidence="", note=""):
          '''.replace('          ','')
          if anchor not in text:
              raise SystemExit('collection completeness years_in anchor not found')
          text=text.replace(anchor,replacement,1)
          old='''    legal_start = as_year(((profile or {}).get("current_legal_name_active_period") or {}).get("start_year"))
          '''
          new='''    legal_start = current_entity_period(profile).get("start_year")
          '''
          if old not in text:
              raise SystemExit('document legal-start anchor not found')
          text=text.replace(old,new,1)
          old='''    public = public_rows(output, request)
              rows = public + document_rows(package, profile, evidence or {})
          '''.replace('          ','')
          new='''    public = apply_current_entity_period(public_rows(output, request), profile)
              rows = public + document_rows(package, profile, evidence or {})
          '''.replace('          ','')
          if old not in text:
              raise SystemExit('public audit anchor not found')
          text=text.replace(old,new,1)
          old='''    complete = [x for x in rows if x["completeness_state"] in {"DATA_PRESENT", "NO_DATA_CONFIRMED"}]
          '''
          new='''    complete = [x for x in rows if x["completeness_state"] in {"DATA_PRESENT", "NO_DATA_CONFIRMED", "OUTSIDE_CURRENT_ENTITY_PERIOD"}]
              outside_entity = [x for x in rows if x["completeness_state"] == "OUTSIDE_CURRENT_ENTITY_PERIOD"]
          '''.replace('          ','')
          if old not in text:
              raise SystemExit('complete-states anchor not found')
          text=text.replace(old,new,1)
          old='''        "no_data_confirmed_items": len(no_data),
          '''
          new='''        "no_data_confirmed_items": len(no_data),
                  "outside_current_entity_items": len(outside_entity),
          '''
          if old not in text:
              raise SystemExit('summary count anchor not found')
          text=text.replace(old,new,1)
          old='''            "Every strongly verified declared official document must have a real delivered file.",
          '''
          new='''            "Years outside a verified current legal-entity active period are preserved as historical references but are not blocking current-entity completeness obligations.",
                      "Every strongly verified declared official document must have a real delivered file.",
          '''.replace('          ','')
          if old not in text:
              raise SystemExit('principle anchor not found')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')

          Path('tests/test_bat_requested_scope_authority.py').write_text(r'''import csv
          import json
          import sys
          import tempfile
          import unittest
          from pathlib import Path

          ROOT=Path(__file__).resolve().parents[1]
          sys.path.insert(0,str(ROOT/'orchestrator'))
          from bat_stage import _filter_plan_to_requested_scope


          class BATRequestedScopeAuthorityTests(unittest.TestCase):
              def test_related_entity_cannot_reenter_bat_through_weak_site_rematch(self):
                  with tempfile.TemporaryDirectory() as td:
                      root=Path(td)
                      profile={
                          'company_display_name':'테스트스틸 주식회사',
                          'requested_company_name':'테스트스틸',
                          'requested_scope':{'mode':'SITE_SET','candidate_ids':['HQ']},
                          'site_candidates':[{
                              'candidate_id':'HQ','site_name_raw':'테스트스틸 포항본사',
                              'address_raw':'경상북도 포항시 남구 동해안로 1',
                              'verification_state':'VERIFIED',
                          }],
                      }
                      (root/'Company_Profile.json').write_text(json.dumps(profile,ensure_ascii=False),encoding='utf-8')
                      (root/'Requested_Scope.json').write_text(json.dumps({
                          'mode':'SITE_SET','target_canonical_site_ids':['SITE_TARGET']
                      },ensure_ascii=False),encoding='utf-8')
                      fields=['canonical_site_id','canonical_site_name','canonical_address_key','identity_status']
                      with (root/'Site_Master.csv').open('w',encoding='utf-8-sig',newline='') as f:
                          w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows([
                              {'canonical_site_id':'SITE_TARGET','canonical_site_name':'테스트스틸 포항본사','canonical_address_key':'경북포항시남구동해안로1','identity_status':'CONFIRMED'},
                              {'canonical_site_id':'SITE_RELATED','canonical_site_name':'테스트스틸머티리얼즈 포항양극재공장','canonical_address_key':'경북포항시북구해안로929','identity_status':'CONFIRMED'},
                          ])
                      plan={'candidates':[
                          {'canonical_site_id':'SITE_TARGET','catalog_id':'BAT_A','collection_action':'REVIEW_BEFORE_COLLECTION'},
                          {'canonical_site_id':'SITE_RELATED','catalog_id':'BAT_B','collection_action':'WAIT_FOR_PUBLICATION'},
                      ]}
                      scoped,audit=_filter_plan_to_requested_scope(root,plan)
                      self.assertEqual(['SITE_TARGET'],[r['canonical_site_id'] for r in scoped['candidates']])
                      self.assertEqual(['SITE_TARGET'],audit['allowed_canonical_site_ids'])
                      self.assertEqual(1,audit['removed_out_of_scope_candidates'])


          if __name__=='__main__':
              unittest.main()
          '''.replace('          ',''),encoding='utf-8')

          Path('tests/test_collection_completeness_entity_window.py').write_text(r'''import sys
          import unittest
          from pathlib import Path

          ROOT=Path(__file__).resolve().parents[1]
          sys.path.insert(0,str(ROOT/'orchestrator'))
          from collection_completeness import apply_current_entity_period, query_row


          class CollectionCompletenessEntityWindowTests(unittest.TestCase):
              def test_pre_entity_years_are_historical_not_blocking_gaps(self):
                  rows=[
                      query_row('PRTR',2020,False,False,False,'terms=0'),
                      query_row('PRTR',2021,False,False,True,'terms=0'),
                      query_row('PRTR',2022,True,False,True,'terms=2'),
                  ]
                  got=apply_current_entity_period(rows,{'legal_entity_active_period':{'start_year':2022}})
                  self.assertEqual('OUTSIDE_CURRENT_ENTITY_PERIOD',got[0]['completeness_state'])
                  self.assertEqual('N',got[0]['expected'])
                  self.assertEqual('NOT_REQUIRED_CURRENT_ENTITY',got[0]['query_state'])
                  self.assertEqual('OUTSIDE_CURRENT_ENTITY_PERIOD',got[1]['completeness_state'])
                  self.assertEqual('Y',got[1]['data_present'])
                  self.assertEqual('HISTORICAL_REFERENCE',got[1]['query_state'])
                  self.assertEqual('DATA_PRESENT',got[2]['completeness_state'])
                  self.assertEqual('Y',got[2]['expected'])

              def test_without_entity_boundary_existing_semantics_are_unchanged(self):
                  rows=[query_row('PRTR',2020,False,False,False,'terms=0')]
                  got=apply_current_entity_period(rows,{})
                  self.assertEqual('UNQUERIED_PERIOD',got[0]['completeness_state'])
                  self.assertEqual('Y',got[0]['expected'])


          if __name__=='__main__':
              unittest.main()
          '''.replace('          ',''),encoding='utf-8')
          PY
      - name: Run focused regressions
        env:
          PYTHONPATH: orchestrator
        run: >-
          python -m unittest
          tests.test_bat_requested_scope_authority
          tests.test_collection_completeness_entity_window
          tests.test_requested_scope
          tests.test_requested_scope_analysis_entity_filter
          tests.test_collection_completeness
          tests.test_bat_effective_catalog
          -v
      - name: Commit generic fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orchestrator/bat_stage.py orchestrator/collection_completeness.py tests/test_bat_requested_scope_authority.py tests/test_collection_completeness_entity_window.py
          git commit -m 'Use authoritative scope for BAT and entity-aware completeness'
          git push origin HEAD:run/control-plane
